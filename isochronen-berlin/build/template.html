<style>

.zone-lab.zl-country span{font-size:15px;letter-spacing:.18em;color:#dfe8ff}

.scalebar .bar i:nth-child(2n){background:transparent}
@media (max-width:760px){ .scalebar{margin:0 0 100px 8px!important;padding:6px 10px 8px} .scalebar .lab b{font-size:15px} }
.fog-on .leaflet-tile-pane{filter:brightness(2.5) saturate(1.25)}

#info{left:14px;top:14px;width:330px;max-width:calc(100% - 28px);padding:14px 16px 12px}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.lang{display:flex;flex:none;margin-top:-1px}
.lang button.chip{padding:2px 7px;font-size:11px;line-height:1.3;border-radius:0}

button.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.stat{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}

.track{flex:1;min-width:0}

.ramp{height:5px;border-radius:3px;margin-top:3px}

  .timeval{font-size:16px;min-width:84px}
  .speed{display:none}
}
</style>

const merc=(lon,lat)=>{const s=Math.sin(lat*Math.PI/180);return [(lon+180)/360,0.5-Math.log((1+s)/(1-s))/(4*Math.PI)];};

// --- Straßendaten (Varint/Zickzack-Deltas, 1e-5 Grad; Code = Verkehrsmittel | Rangstufe<<3) ---
function decode(b64,HOME,NB){

function decodeHops(b64,HOME){

      if(k>0)acc+=Math.hypot(mx-lx,my-ly);

function decodeStations(arr,HOME){

      const k=Math.floor(d.x[i]/C)*1e6+Math.floor(d.y[i]/C);
      if(!cell.has(k)){cell.set(k,t);fx.push(Math.floor(d.x[i]/C));fy.push(Math.floor(d.y[i]/C));hx[bx(d.x[i])]++;hy[by(d.y[i])]++;n++;}

// --- Offline-Kacheln (512 px für scharfe Darstellung), Rückgriff auf gröbere Stufen ---
const imgCache={};
function getImg(key){
  if(!(key in TILES))return null;
  if(!imgCache[key]){const im=new Image();im.src=TILES[key]?'data:image/webp;base64,'+TILES[key]:'tiles/bg/'+key.replace(/\//g,'_')+'.webp';imgCache[key]=im;}
  return imgCache[key];
}
const TS=512;
// Bereits dekodierte Bilder sofort zeichnen und 'done' nur als Microtask melden (Leaflet trägt die Kachel erst nach
// createTile ein): so ist die Kachel schon beim nächsten Paint sichtbar. Mit setTimeout blieb jede neue Kachel einen
// Frame lang unsichtbar (.leaflet-tile ist bis 'loaded' hidden) – beim Zoomen blitzte die Karte leer.
const imReady=im=>im.complete&&im.naturalWidth>0;
const soon=f=>Promise.resolve().then(f);
const whenLoaded=(im,f)=>{im.addEventListener('load',f,{once:true});im.addEventListener('error',f,{once:true});};
const OfflineTiles=L.GridLayer.extend({
  createTile:function(c,done){
    const cv=document.createElement('canvas');cv.width=cv.height=TS;
    const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
    if(c.z<8){                       // weiter draußen als die gröbste Kachelstufe: aus Kacheln der Stufe 8 zusammensetzen
      const n=1<<(8-c.z),sz=TS/n;let pending=0;
      ctx.fillStyle='#0b0c0e';ctx.fillRect(0,0,TS,TS);
      for(let i=0;i<n;i++)for(let j=0;j<n;j++){const im=getImg('8/'+(c.x*n+i)+'/'+(c.y*n+j));if(!im)continue;
        if(imReady(im)){ctx.drawImage(im,i*sz,j*sz,sz,sz);continue;}
        pending++;
        whenLoaded(im,()=>{if(imReady(im))ctx.drawImage(im,i*sz,j*sz,sz,sz);if(--pending===0)done(null,cv);});}
      if(!pending)soon(()=>done(null,cv));
      return cv;
    }
    let z=c.z,x=c.x,y=c.y,im=null;
    while(z>=8){im=getImg(z+'/'+x+'/'+y);if(im)break;x>>=1;y>>=1;z--;}
    if(!im){ctx.fillStyle='#0b0c0e';ctx.fillRect(0,0,TS,TS);soon(()=>done(null,cv));return cv;}
    const d=c.z-z,n=1<<d,sz=TS/n,sx=(c.x-(x<<d))*sz,sy=(c.y-(y<<d))*sz;
    const draw=()=>{if(imReady(im))ctx.drawImage(im,sx,sy,sz,sz,0,0,TS,TS);else{ctx.fillStyle='#0b0c0e';ctx.fillRect(0,0,TS,TS);}};
    if(imReady(im)){draw();soon(()=>done(null,cv));}else whenLoaded(im,()=>{draw();done(null,cv);});
    return cv;
  }
});
// --- Ortsnamen: transparente Beschriftungskacheln (512 px, Stufen 8–14) in eigener Ebene über den Straßen-Canvases
// (overlayPane 400) und unter Markern (600). Ohne Kachel bleibt die Kachel leer; über z14 skaliert Leaflet die
// z14-Kacheln (maxNativeZoom), unter z8 keine Beschriftung.
const lImgCache={};
function getLImg(key){
  if(!(key in LTILES))return null;
  if(!lImgCache[key]){const im=new Image();im.src=LTILES[key]?'data:image/webp;base64,'+LTILES[key]:'tiles/lab/'+key.replace(/\//g,'_')+'.webp';lImgCache[key]=im;}
  return lImgCache[key];
}
const OfflineLabels=L.GridLayer.extend({
  createTile:function(c,done){
    const cv=document.createElement('canvas');cv.width=cv.height=TS;
    let z=c.z,x=c.x,y=c.y;
    if(z>14){const s=z-14;x>>=s;y>>=s;z=14;}          // Rückfall, falls Leaflet doch feiner anfragt
    // Zoom-11-Beschriftung gibt es nur für Berlin/Brandenburg (Dateigröße); weiter draußen die Zoom-10-Kachel vergrößert
    if(z===11&&!(x>=1080&&x<=1113&&y>=656&&y<=687)){x>>=1;y>>=1;z=10;}
    const im=z>=6?getLImg(z+'/'+x+'/'+y):null;   // ab Zoom 6: Großstädte auch in der Deutschland-Übersicht
    if(!im){soon(()=>done(null,cv));return cv;}
    const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
    const d=c.z-z,n=1<<d,sz=TS/n,sx=(c.x-(x<<d))*sz,sy=(c.y-(y<<d))*sz;
    const draw=()=>{if(imReady(im))ctx.drawImage(im,sx,sy,sz,sz,0,0,TS,TS);};

// ein Kameraschritt mit fester Zeitspanne dt (s) – auch für Tests und den Video-Export (deterministisch)
function camStep(dt){
  const t=camTarget(),z=map.getZoom(),c=map.getCenter(),cc=merc(c.lng,c.lat),S=256*Math.pow(2,z);
  // weiterführen, solange die Karte nicht anderweitig bewegt wurde (sonst vom tatsächlichen Stand ausgehen)

  for(const k in ZTHR){ if(!ZONE[k]){out[k]=Infinity;continue;}
    const rings=(ZONES[k]||[]).map(poly=>poly[0].map(([lo,la])=>merc(lo,la)));
    let x0=9,x1=-9,y0=9,y1=-9; for(const r of rings)for(const [x,y] of r){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}

document.getElementById('zones').onclick=()=>{zonesOn=!zonesOn;document.getElementById('zones').setAttribute('aria-pressed',zonesOn);
  if(zonesOn){zoneGroup.addTo(map);for(const k in ZONE){ZONE[k].shown=false;ZONE[k].vis=true;}zoneCheck();}else map.removeLayer(zoneGroup); legend();};
document.querySelectorAll('[data-cov]').forEach(b=>b.onclick=()=>{
  covMode=b.dataset.cov;
  document.querySelectorAll('[data-cov]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.body.classList.toggle('fog-on',covMode==='night');      // Nacht: Kacheln aufhellen, der Nebel dunkelt sie wieder ab
  layer.drawCov(layer.covK||0,true); legend();
});
// eigenes Verschieben/Zoomen beendet das Mitzoomen
map.on('zoomstart movestart',()=>{ if(!camProg&&!viewProg&&autoCam) setAuto(false); });
map.getContainer().addEventListener('wheel',()=>{ if(autoCam)setAuto(false); },{passive:true});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
  colorBy=b.dataset.c;
  document.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.getElementById('ramp').style.opacity=colorBy==='time'?1:.25;
  layer.full(); legend();          // (StreetLayer hat kein reset(): warf TypeError, Farben blieben bis zum nächsten full())
});
let playing=false,last=0;
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{dur=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
const playBtn=document.getElementById('play'),icon=document.getElementById('playicon');
function setPlaying(p){playing=p;icon.innerHTML=p?'<path d="M3 2h4v12H3zM9 2h4v12H9z"/>':'<path d="M4 2l10 6-10 6z"/>';playBtn.setAttribute('aria-label',tr(p?'pause':'play'));
  if(p){ if(T>=AX)T=0; last=performance.now(); requestAnimationFrame(tick);} }
// Tempo passt sich der Ausdehnung an: bis ~1:20 unverändert, danach so viel schneller, wie die Karte herauszoomt
// (gleiche sichtbare Ausbreitung pro Sekunde). Maß: Kantenlänge der Ausdehnung (Zoom-unabhängig vom Fenster).
const T_REF=78,SPD_MAX=4;
let spd=1;
function zp(t){const [x0,x1,y0,y1]=layer.extent(t);return -Math.log2(Math.max(x1-x0,(y1-y0)*1.4,1e-6));}
function speedTarget(){ if(!layer)return 1; const d=layer.d; if(d.zRef===undefined)d.zRef=zp(T_REF);
  return Math.min(SPD_MAX,Math.pow(2,1.3*Math.max(0,d.zRef-zp(T)))); }
function tick(now){
  if(!playing)return;
  const dt=Math.max(0,now-last)/1000;
  spd+=(speedTarget()-spd)*(1-Math.exp(-dt/1.2));            // weich nachführen, keine Sprünge
  T=Math.min(AX,T+dt*90/dur*spd); last=now;   // rAF-Zeitstempel kann vor performance.now() liegen → nie rückwärts (T<0)
  if(autoCam&&layer) camStep(Math.min(.1,dt));   // Kamera im selben Schritt: Züge nur einmal je Frame zeichnen
  renderAll();
  if(T>=AX){setPlaying(false);return;}
  requestAnimationFrame(tick);
}
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById('t').addEventListener('input',e=>{setPlaying(false);T=+e.target.value;renderAll();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();setPlaying(!playing);}});
window.ISO={get T(){return T},set T(v){T=v;renderAll();},map,setPlaying,camJump,camStep,setLang,get layer(){return layer},speedTarget:()=>speedTarget(),setAuto};

// --- Sprache umschalten: nur Texte neu setzen – Animation, Ansicht, Startort und Kamera bleiben unberührt ---
function setLang(l){
  if(!(l in I18N))return;
  LANG=l;try{localStorage.setItem('iso-lang',l);}catch(e){}
  document.documentElement.lang=l;document.title=tr('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n);});
  document.querySelectorAll('[data-n-de]').forEach(el=>{el.textContent=l==='en'?el.dataset.nEn:el.dataset.nDe;});   // Ländernamen
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=tr(el.dataset.i18nTitle);});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',tr(el.dataset.i18nAria));});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  const ul=document.getElementById('notes');ul.textContent='';
  for(const t of tr('notes')){const li=document.createElement('li');li.textContent=t;ul.appendChild(li);}
  for(const [id,list] of [['origins',ORIGINS],['views',VIEWS]])
    document.querySelectorAll('#'+id+' button').forEach(b=>{const it=list.find(x=>x.id===b.dataset.id);if(it)b.textContent=it.name;});
  playBtn.setAttribute('aria-label',tr(playing?'pause':'play'));
  if(map._loaded)scaleBar.update();               // vor der ersten Ansicht (Start) gibt es noch keine Kartenmitte
  if(layer){originTexts();renderAll();legend();}
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(b.dataset.lang!==LANG)setLang(b.dataset.lang);});
setLang(LANG);

setOrigin();
setAuto(true);
setTimeout(()=>setPlaying(true),700);
})();
</script>

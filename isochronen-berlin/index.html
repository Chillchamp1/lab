<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,

	}

	overflow: hidden;
	}

.leaflet-marker-icon,

	   -moz-user-select: none;

	}

.leaflet-tile::selection {

}

.leaflet-safari .leaflet-tile {

.leaflet-container .leaflet-tile-pane img,

}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;

	}

	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;

}

	-ms-touch-action: none;
	touch-action: none;
}

}
.leaflet-container a {

}

	visibility: hidden;
	}

	-moz-box-sizing: border-box;

	}

	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,

.leaflet-bottom .leaflet-control {

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

.leaflet-zoom-animated {

}

.leaflet-zoom-anim .leaflet-zoom-animated {

.leaflet-zoom-anim .leaflet-tile,

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);

	}
.leaflet-bar a {
	background-color: #fff;

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,

/* popup */

.leaflet-popup {

.leaflet-popup-content-wrapper {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

.leaflet-oldie .leaflet-control-zoom,

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;

	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

<style>
:root{
  --bg:#0b0c0e; --glass:rgba(14,16,19,.86); --ink:#eceae6; --muted:#8b9099; --line:rgba(255,255,255,.09);
  --accent:#ffb340; --chip:rgba(255,255,255,.05); --chip-on:#eceae6; --chip-on-ink:#0b0c0e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-control-attribution{background:rgba(11,12,14,.7)!important;color:#6f757e;font-size:10.5px}
.leaflet-control-attribution a{color:#99a0aa}
.leaflet-bar{border:none!important;box-shadow:none!important}
.leaflet-bar a{background:var(--glass);color:#ddd;border-color:var(--line)!important;backdrop-filter:blur(8px)}
.leaflet-bar a:hover{background:#22262c}
.leaflet-top.leaflet-right{margin-top:4px}
.start-pin{width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #0b0c0e;box-shadow:0 0 0 1.5px #fff}
.streets{position:absolute;left:0;top:0;pointer-events:none}
.zone-lab span{display:inline-block;transform:translateX(-50%);font-size:13.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;-webkit-text-stroke:3px rgba(5,6,8,.92);paint-order:stroke fill;
  color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.zone-lab.zl-umland span{color:#ffd27a}.zone-lab.zl-berlin span{color:#e6e9ee}
.zone-lab span{opacity:.85}
.zone-el{transition:opacity 1.6s ease}
.zone-off{opacity:0!important}
.zone-lab.zl-country span{font-size:15px;letter-spacing:.18em;color:#dfe8ff}
@keyframes zpulse{0%{stroke-opacity:.6}8%{stroke-opacity:1;stroke-width:5px}60%{stroke-opacity:1;stroke-width:4.5px}100%{}}
@keyframes zcas{0%{}8%{stroke-opacity:.75;stroke-width:9px}60%{stroke-opacity:.7;stroke-width:8.5px}100%{}}
@keyframes zlab{0%{opacity:.85;transform:translateX(-50%) scale(1)}8%{opacity:1;transform:translateX(-50%) scale(1.7)}60%{opacity:1;transform:translateX(-50%) scale(1.6)}100%{opacity:.85;transform:translateX(-50%) scale(1)}}
.zone-path.pulse{animation:zpulse 6s ease-in-out}
.zone-cas.pulse{animation:zcas 6s ease-in-out}
.zone-lab.pulse span{animation:zlab 6s ease-in-out;transform-origin:50% 100%}
.scalebar{margin:0 0 26px 14px!important;pointer-events:none;font-variant-numeric:tabular-nums;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 18px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.scalebar .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--muted);margin-bottom:8px;white-space:nowrap;gap:12px}
.scalebar .lab b{font-size:26px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.scalebar .bar{height:12px;display:flex;border:2px solid #eceae6;border-radius:3px;overflow:hidden;transition:width .12s linear}
.scalebar .bar i{flex:1;background:#eceae6}
.scalebar .bar i:nth-child(2n){background:transparent}
@media (max-width:760px){ .scalebar{margin:0 0 100px 8px!important;padding:6px 10px 8px} .scalebar .lab b{font-size:15px} }
.fog-on .leaflet-tile-pane{filter:brightness(2.5) saturate(1.25)}

.panel{position:absolute;z-index:1000;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#info{left:14px;top:14px;width:330px;max-width:calc(100% - 28px);padding:14px 16px 12px}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.lang{display:flex;flex:none;margin-top:-1px}
.lang button.chip{padding:2px 7px;font-size:11px;line-height:1.3;border-radius:0}
.lang button.chip:first-child{border-radius:999px 0 0 999px;border-right:none}
.lang button.chip:last-child{border-radius:0 999px 999px 0}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.lbl{color:var(--muted);font-size:11.5px;width:100%;margin-bottom:-2px}
button.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:999px;font:inherit;font-size:12.5px;cursor:pointer}
button.chip:hover{border-color:rgba(255,255,255,.25)}
button.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.stat{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat .big{font-size:22px;font-weight:650;letter-spacing:-.01em}
.stat .big small{font-size:12.5px;color:var(--muted);font-weight:500}
.now{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.now .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.07);display:flex;overflow:hidden}
.now .bar i{display:block;height:100%;transition:width .25s linear}
.now .txt{margin-top:3px;font-size:11.5px;color:var(--muted);min-height:16px}
.legend{margin-top:10px;display:grid;gap:5px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend svg{flex:none}
.legend .sw{display:inline-block;width:14px;height:4px;border-radius:2px;flex:none}
details{margin-top:10px;font-size:11.5px;color:var(--muted)}
details summary{cursor:pointer;color:#b9bdc4}
details ul{margin:6px 0 0;padding-left:16px;max-height:34vh;overflow:auto}
details li{margin-bottom:4px}

#timebar{left:50%;transform:translateX(-50%);bottom:26px;width:min(860px,calc(100% - 28px));padding:10px 16px 8px;display:flex;align-items:center;gap:14px}
button.play{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#111;cursor:pointer;display:grid;place-items:center;flex:none}
button.play svg{width:16px;height:16px;fill:currentColor}
.timeval{font-variant-numeric:tabular-nums;font-weight:650;font-size:20px;min-width:108px;white-space:nowrap}
.timeval small{font-size:12px;color:var(--muted);font-weight:500}
.track{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ramp{height:5px;border-radius:3px;margin-top:3px}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.speed{display:flex;flex-direction:column;gap:4px}
.speed button.chip{padding:2px 8px;font-size:11px}
@media (max-width:760px){
  #info{left:8px;right:8px;top:8px;width:auto;padding:10px 12px}
  #info .hide-s,#info .sub,#info .lbl{display:none}
  #info h1{font-size:14.5px}
  #info .row{flex-wrap:nowrap;overflow-x:auto;margin-top:7px;scrollbar-width:none}
  #info .row::-webkit-scrollbar{display:none}
  button.chip{padding:4px 9px;font-size:12px;white-space:nowrap}
  .stat{margin-top:8px;padding-top:7px}
  .stat .big{font-size:18px}
  #timebar{bottom:22px;width:calc(100% - 16px);gap:10px;padding:8px 10px}
  .timeval{font-size:16px;min-width:84px}
  .speed{display:none}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="info">
  <div class="head">
    <h1 id="title">ÖPNV + Rad</h1>
    <span class="lang" role="group" aria-label="Sprache / Language"><button class="chip" data-lang="de" title="Deutsch" lang="de">DE</button><button class="chip" data-lang="en" title="English" lang="en">EN</button></span>
  </div>
  <div class="sub" id="subtitle"></div>
  <span id="origins" hidden></span>
  <div class="row"><span class="lbl" data-i18n="lView">Ausschnitt</span><button class="chip" id="autocam" aria-pressed="true" data-i18n="autocam" data-i18n-title="autocamT">Kamera folgt</button><span id="views" style="display:contents"></span></div>
  <div class="row"><span class="lbl" data-i18n="lColor">Straßenfarbe</span>
    <button class="chip" data-c="time" data-i18n="cTime">Reisezeit</button>
    <button class="chip" data-c="mode" aria-pressed="true" data-i18n="cMode">Verkehrsmittel</button>
  </div>
  <div class="row"><span class="lbl" data-i18n="lZones">Stadtzonen</span>
    <button class="chip" id="zones" aria-pressed="true" data-i18n="zones" data-i18n-title="zonesT">Innenstadt · Speckgürtel</button>
  </div>
  <div class="stat">
    <div class="big" id="area">0 <small>km² erreicht</small></div>
    <div class="now" data-i18n-title="nowT"><span data-i18n="nowL">neu erreicht</span><span class="bar" id="bar"></span></div>
    <div class="now txt" id="nowtxt">–</div>
  </div>
  <div class="legend hide-s" id="legend"></div>
  <details class="hide-s">
    <summary data-i18n="dataSum">Daten &amp; Annahmen</summary>
    <ul id="notes"></ul>
  </details>
</div>
<div class="panel" id="timebar">
  <button class="play" id="play" aria-label="Abspielen"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2l10 6-10 6z"/></svg></button>
  <div class="timeval" id="tval">0 <small>min</small></div>
  <div class="track">
    <input type="range" id="t" min="0" max="180" step="any" value="0" aria-label="Reisezeit in Minuten" data-i18n-aria="slider">
    <div class="ramp" id="ramp" style="opacity:.25"></div>
    <div class="ticks" id="ticks"></div>
  </div>
  <div class="speed">
    <button class="chip" data-speed="40" data-i18n="spFast">schnell</button>
    <button class="chip" data-speed="75" aria-pressed="true" data-i18n="spNorm">normal</button>
    <button class="chip" data-speed="140" data-i18n="spSlow">langsam</button>
  </div>
</div>

  for(let s=0;s<ns;s++){
    let ed=seg[s];if(nx[ed]<0)continue;
    if(nl>=lp.length)lp=c.lp=covGrow(lp,nl+1);
    lp[nl++]=np;
    const e0=ed;

      const cell=ed>>1,x=cell%W,y=(cell-x)/W,v=ed&1,fa=F(cell),fb=F(v?cell+W:cell+1),t=(.5-fa)/(fb-fa);

  lp[nl]=np;c.nl=nl;c.np=np;c.ok=true;

// --- Offline-Kacheln (512 px für scharfe Darstellung), Rückgriff auf gröbere Stufen ---
const imgCache={};
function getImg(key){
  if(!(key in TILES))return null;
  if(!imgCache[key]){const im=new Image();im.src=TILES[key]?'data:image/webp;base64,'+TILES[key]:'tiles/bg/'+key.replace(/\//g,'_')+'.webp';imgCache[key]=im;}
  return imgCache[key];
}
const TS=512;
// Bereits dekodierte Bilder sofort zeichnen und 'done' nur als Microtask melden (Leaflet trägt die Kachel erst nach
// createTile ein): so ist die Kachel schon beim nächsten Paint sichtbar. Mit setTimeout blieb jede neue Kachel einen
// Frame lang unsichtbar (.leaflet-tile ist bis 'loaded' hidden) – beim Zoomen blitzte die Karte leer.
const imReady=im=>im.complete&&im.naturalWidth>0;
const soon=f=>Promise.resolve().then(f);
const whenLoaded=(im,f)=>{im.addEventListener('load',f,{once:true});im.addEventListener('error',f,{once:true});};
const OfflineTiles=L.GridLayer.extend({
  createTile:function(c,done){
    const cv=document.createElement('canvas');cv.width=cv.height=TS;
    const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
    if(c.z<8){                       // weiter draußen als die gröbste Kachelstufe: aus Kacheln der Stufe 8 zusammensetzen
      const n=1<<(8-c.z),sz=TS/n;let pending=0;
      ctx.fillStyle='#0b0c0e';ctx.fillRect(0,0,TS,TS);
      for(let i=0;i<n;i++)for(let j=0;j<n;j++){const im=getImg('8/'+(c.x*n+i)+'/'+(c.y*n+j));if(!im)continue;
        if(imReady(im)){ctx.drawImage(im,i*sz,j*sz,sz,sz);continue;}
        pending++;
        whenLoaded(im,()=>{if(imReady(im))ctx.drawImage(im,i*sz,j*sz,sz,sz);if(--pending===0)done(null,cv);});}
      if(!pending)soon(()=>done(null,cv));
      return cv;
    }
    let z=c.z,x=c.x,y=c.y,im=null;
    while(z>=8){im=getImg(z+'/'+x+'/'+y);if(im)break;x>>=1;y>>=1;z--;}
    if(!im){ctx.fillStyle='#0b0c0e';ctx.fillRect(0,0,TS,TS);soon(()=>done(null,cv));return cv;}
    const d=c.z-z,n=1<<d,sz=TS/n,sx=(c.x-(x<<d))*sz,sy=(c.y-(y<<d))*sz;
    const draw=()=>{if(imReady(im))ctx.drawImage(im,sx,sy,sz,sz,0,0,TS,TS);else{ctx.fillStyle='#0b0c0e';ctx.fillRect(0,0,TS,TS);}};
    if(imReady(im)){draw();soon(()=>done(null,cv));}else whenLoaded(im,()=>{draw();done(null,cv);});
    return cv;
  }
});
// --- Ortsnamen: transparente Beschriftungskacheln (512 px, Stufen 8–14) in eigener Ebene über den Straßen-Canvases
// (overlayPane 400) und unter Markern (600). Ohne Kachel bleibt die Kachel leer; über z14 skaliert Leaflet die
// z14-Kacheln (maxNativeZoom), unter z8 keine Beschriftung.
const lImgCache={};
function getLImg(key){
  if(!(key in LTILES))return null;
  if(!lImgCache[key]){const im=new Image();im.src=LTILES[key]?'data:image/webp;base64,'+LTILES[key]:'tiles/lab/'+key.replace(/\//g,'_')+'.webp';lImgCache[key]=im;}
  return lImgCache[key];
}
const OfflineLabels=L.GridLayer.extend({
  createTile:function(c,done){
    const cv=document.createElement('canvas');cv.width=cv.height=TS;
    let z=c.z,x=c.x,y=c.y;
    if(z>14){const s=z-14;x>>=s;y>>=s;z=14;}          // Rückfall, falls Leaflet doch feiner anfragt
    // Zoom-11-Beschriftung gibt es nur für Berlin/Brandenburg (Dateigröße); weiter draußen die Zoom-10-Kachel vergrößert
    if(z===11&&!(x>=1080&&x<=1113&&y>=656&&y<=687)){x>>=1;y>>=1;z=10;}
    const im=z>=6?getLImg(z+'/'+x+'/'+y):null;   // ab Zoom 6: Großstädte auch in der Deutschland-Übersicht
    if(!im){soon(()=>done(null,cv));return cv;}
    const ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
    const d=c.z-z,n=1<<d,sz=TS/n,sx=(c.x-(x<<d))*sz,sy=(c.y-(y<<d))*sz;
    const draw=()=>{if(imReady(im))ctx.drawImage(im,sx,sy,sz,sz,0,0,TS,TS);};
    if(imReady(im)){draw();soon(()=>done(null,cv));}else whenLoaded(im,()=>{draw();done(null,cv);});
    return cv;
  }
});

let colorBy='mode', dur=75;      // Sekunden je 90 Kartenminuten

  onRemove(map){

    let x0=9,x1=-9,y0=9,y1=-9; for(const r of rings)for(const [x,y] of r){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}

document.getElementById('zones').onclick=()=>{zonesOn=!zonesOn;document.getElementById('zones').setAttribute('aria-pressed',zonesOn);
  if(zonesOn){zoneGroup.addTo(map);for(const k in ZONE){ZONE[k].shown=false;ZONE[k].vis=true;}zoneCheck();}else map.removeLayer(zoneGroup); legend();};
document.querySelectorAll('[data-cov]').forEach(b=>b.onclick=()=>{
  covMode=b.dataset.cov;
  document.querySelectorAll('[data-cov]').forEach(x=>x.setAttribute('aria-pressed',x===b));

});
// eigenes Verschieben/Zoomen beendet das Mitzoomen

  colorBy=b.dataset.c;

});
let playing=false,last=0;
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{dur=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
const playBtn=document.getElementById('play'),icon=document.getElementById('playicon');
function setPlaying(p){playing=p;icon.innerHTML=p?'<path d="M3 2h4v12H3zM9 2h4v12H9z"/>':'<path d="M4 2l10 6-10 6z"/>';playBtn.setAttribute('aria-label',tr(p?'pause':'play'));
  if(p){ if(T>=AX)T=0; last=performance.now(); requestAnimationFrame(tick);} }
// Tempo passt sich der Ausdehnung an: bis ~1:20 unverändert, danach so viel schneller, wie die Karte herauszoomt
// (gleiche sichtbare Ausbreitung pro Sekunde). Maß: Kantenlänge der Ausdehnung (Zoom-unabhängig vom Fenster).
const T_REF=78,SPD_MAX=4;
let spd=1;
function zp(t){const [x0,x1,y0,y1]=layer.extent(t);return -Math.log2(Math.max(x1-x0,(y1-y0)*1.4,1e-6));}
function speedTarget(){ if(!layer)return 1; const d=layer.d; if(d.zRef===undefined)d.zRef=zp(T_REF);
  return Math.min(SPD_MAX,Math.pow(2,1.3*Math.max(0,d.zRef-zp(T)))); }
function tick(now){
  if(!playing)return;
  const dt=Math.max(0,now-last)/1000;
  spd+=(speedTarget()-spd)*(1-Math.exp(-dt/1.2));            // weich nachführen, keine Sprünge
  T=Math.min(AX,T+dt*90/dur*spd); last=now;   // rAF-Zeitstempel kann vor performance.now() liegen → nie rückwärts (T<0)
  if(autoCam&&layer) camStep(Math.min(.1,dt));   // Kamera im selben Schritt: Züge nur einmal je Frame zeichnen
  renderAll();
  if(T>=AX){setPlaying(false);return;}
  requestAnimationFrame(tick);
}
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById('t').addEventListener('input',e=>{setPlaying(false);T=+e.target.value;renderAll();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();setPlaying(!playing);}});
window.ISO={setCamZmin:z=>{CAM_ZMIN=z;},get T(){return T},set T(v){T=v;renderAll();},map,setPlaying,camJump,camStep,setLang,get layer(){return layer},speedTarget:()=>speedTarget(),setAuto};

// --- Sprache umschalten: nur Texte neu setzen – Animation, Ansicht, Startort und Kamera bleiben unberührt ---
function setLang(l){
  if(!(l in I18N))return;
  LANG=l;try{localStorage.setItem('iso-lang',l);}catch(e){}
  document.documentElement.lang=l;document.title=tr('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.dataset.i18n);});
  document.querySelectorAll('[data-n-de]').forEach(el=>{el.textContent=l==='en'?el.dataset.nEn:el.dataset.nDe;});   // Ländernamen
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=tr(el.dataset.i18nTitle);});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',tr(el.dataset.i18nAria));});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  const ul=document.getElementById('notes');ul.textContent='';
  for(const t of tr('notes')){const li=document.createElement('li');li.textContent=t;ul.appendChild(li);}
  for(const [id,list] of [['origins',ORIGINS],['views',VIEWS]])
    document.querySelectorAll('#'+id+' button').forEach(b=>{const it=list.find(x=>x.id===b.dataset.id);if(it)b.textContent=it.name;});
  playBtn.setAttribute('aria-label',tr(playing?'pause':'play'));
  if(map._loaded)scaleBar.update();               // vor der ersten Ansicht (Start) gibt es noch keine Kartenmitte
  if(layer){originTexts();renderAll();legend();}
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(b.dataset.lang!==LANG)setLang(b.dataset.lang);});
setLang(LANG);

setOrigin();
setAuto(true);
setTimeout(()=>setPlaying(true),700);
}
(async()=>{
  const el=document.createElement('div');el.id='loading';
  el.style.cssText='position:fixed;inset:0;display:grid;place-items:center;background:#0b0c0e;color:#c9ccd2;font:15px system-ui,sans-serif;z-index:5000';
  el.textContent='Loading map data …';document.body.appendChild(el);
  try{
    const r=await fetch('data/streets.json');if(!r.ok)throw new Error(r.status);
    const rd=r.body.getReader(),parts=[];let got=0;
    for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;
      el.textContent='Loading map data … '+Math.min(99,Math.round(got/38308236*100))+' %';}
    STREETS=JSON.parse(new TextDecoder().decode(await new Blob(parts).arrayBuffer()));
    el.remove();MAIN();
  }catch(e){el.textContent='Could not load the map data ('+e.message+').';}
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Germany, drawn by its timetables</title>
<meta name="description" content="Every station of Germany's long-distance and regional rail network, drawn by travel time instead of kilometres — a relief map of reach, with snow over the regions left behind.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M1 25h30' stroke='%232169a0' stroke-width='6'/%3E%3Cpath d='M3 22 12 7l7 8 5-7 5 14z' fill='%23c65c33'/%3E%3Cpath d='M12 7l3 3.4-6 0z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --plane:#000; --surface:#0c0c0c; --ink:#fff; --ink2:#bfbeb6; --muted:#7f7d77;
  --line:#232321; --axis:#33332f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--plane);color:var(--ink);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{overflow-x:hidden}

/* Karte links, Tafel rechts — wie in der Vorlage. Unter der Karte liegt der
   Reglerstreifen. Die Regler haben in der Seitenspalte gestanden, und das war
   falsch: man schaut beim Schieben auf die Karte und nicht auf den Regler, und
   wenn beide 900 Pixel auseinanderliegen, schiebt man blind. Jetzt liegt der
   Griff direkt unter dem, was er bewegt. */
#huelle{display:grid;grid-template-columns:1fr 344px;height:100svh;min-height:560px}
#links{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#buehne{position:relative;overflow:hidden;flex:1 1 auto;min-height:200px;
  padding:14px 0 0 14px}
#cv{position:absolute;inset:14px 0 0 14px;width:calc(100% - 14px);
  height:calc(100% - 14px);display:block;border-radius:10px;touch-action:pan-y}
/* Der Streifen ist **eine** Zeile hoch, und das ist keine Kosmetik: jede
   Zeile, die er sich nimmt, nimmt er der Karte weg, und die Karte sollte
   gerade größer werden. Darum liegen hier nur die drei Regler; die
   Anzeigeschalter bleiben in der Tafel, wo sie niemanden etwas kosten. */
#regler{flex:0 0 auto;padding:9px 16px 11px 14px;display:grid;
  grid-template-columns:repeat(3,1fr);gap:7px 24px;align-items:end}
#regler .reg{margin:0}
#tafel{overflow:auto;padding:20px 20px 40px;border-left:1px solid var(--line);
  background:#060605}
#tafel h1{margin:0 0 6px;font-size:21px;font-weight:650;letter-spacing:-.015em;
  line-height:1.2;text-wrap:balance}
#unterzeile{margin:0 0 16px;font-size:12.5px;color:var(--ink2)}
#unterzeile b{color:var(--ink);font-weight:600}

.gruppe{margin:0 0 15px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.gruppe:last-of-type{border-bottom:0}
.titel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 7px}
.reg{margin:0 0 10px}
.reg:last-child{margin-bottom:0}
.reg label{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;
  color:var(--muted);margin-bottom:3px}
.reg label i{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:0;accent-color:#9aa07f;height:17px}
/* Regler und Abspielknopf in einer Zeile. Der Wasserstand hat keinen
   Abspieler und bekommt statt dessen eine Lücke in derselben Breite, damit
   die drei Reglerbahnen untereinander an derselben Stelle anfangen. */
.schub{display:flex;align-items:center;gap:9px}
.schub input[type=range]{flex:1 1 auto;min-width:0;width:auto}
.schub.ohne::before{content:'';flex:0 0 27px}
button.spiel{flex:0 0 auto;width:27px;height:20px;padding:0;font-size:9px;
  line-height:1;display:grid;place-items:center;border-style:solid;
  border-color:var(--line)}
button.spiel[aria-pressed=true]{color:#9aa07f;border-color:#9aa07f}
#knoepfe{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:11px;line-height:1.2;padding:4px 8px;border-radius:6px;
  color:var(--muted);background:transparent;border:1px solid var(--axis);
  border-style:dashed;cursor:pointer}
button[aria-pressed=true],button:hover{color:var(--ink);border-style:solid}
/* Die Legende liegt unter der Karte, nicht in der Tafel: sie erklärt die
   Farben, und Farben liest man am Bild und nicht in einer Seitenspalte. Der
   Balken bekommt Teilstriche in **absoluten Minuten** — die Endpunkte allein
   waren zu wenig, weil die Leiter zwischen ihnen nicht linear ist: fünf
   Bänder liegen unter Wasser und dreißig darüber. */
#legende{flex:0 0 auto;padding:0 16px 10px 14px}
#legzeile{display:flex;justify-content:space-between;align-items:baseline;
  gap:14px;margin:0 0 5px;font-size:11px;color:var(--muted);line-height:1.3}
#legzeile b{color:var(--ink2);font-weight:600}
#legzeile > span{white-space:nowrap}
#legzeile #schneezeile{flex:0 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis}
#legzeile #hoehetitel{flex:1 1 auto;min-width:0}
#legzeile #hoehetitel{margin:0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#legmass{flex:0 0 auto;display:flex;align-items:center;gap:7px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
#mstrich{display:block;height:1px;background:var(--ink2);flex:0 0 auto}
#legtick{position:relative;height:13px;font-size:10px;color:var(--muted);
  font-variant-numeric:tabular-nums}
#legtick span{position:absolute;top:3px;transform:translateX(-50%);
  white-space:nowrap}
#legtick i{position:absolute;top:0;width:1px;height:3px;
  background:var(--axis)}
#legtick span.merk{color:var(--ink)}
#legtick i.merk{background:var(--ink2);height:4px}
#band{height:10px;border-radius:2px;margin:0 0 4px;display:flex;overflow:hidden}
#band div{flex:1}
#bandtext{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--muted);font-variant-numeric:tabular-nums}
#schneezeile{margin:7px 0 0;font-size:11.5px;color:var(--ink2)}
#polzeile{margin:6px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
#zoomhinweis{margin:9px 0 0;font-size:11px;color:var(--muted);line-height:1.35}
#polzeile b{color:var(--ink2);font-weight:600}
#schneezeile b{color:#fff}
#mstrich{height:1px;background:var(--ink2);margin:5px 0 3px}
#mtext,#mkm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#isozeile{margin:7px 0 0;font-size:11.5px;color:var(--ink2);display:none}
.tip{position:fixed;pointer-events:none;background:#141412;border:1px solid var(--axis);
  border-radius:7px;padding:6px 9px;font-size:12px;z-index:6;max-width:250px;
  opacity:0;transition:opacity .09s;box-shadow:0 6px 22px rgba(0,0,0,.6)}
/* Die Kurzinfo des gewählten Bahnhofs liegt **in** der Karte, unten links:
   dort ist bei jeder Reglerstellung schwarzer Grund, und der Blick muss
   nicht zwischen Karte und Seitenspalte hin und her. */
/* In welche Ecke, sagt der gewählte Bahnhof: in die von ihm entfernteste.
   Sonst deckt der Kasten gerade das zu, was man angeklickt hat — bei einem
   Bahnhof im Süden liegt er auf ihm. */
#wahlfeld{position:absolute;z-index:5;display:none;
  max-width:min(300px, calc(100% - 48px));background:rgba(12,12,11,.9);
  border:1px solid var(--axis);border-radius:9px;padding:9px 11px 10px;
  box-shadow:0 8px 28px rgba(0,0,0,.65);backdrop-filter:blur(6px)}
#wahlfeld.auf{display:block}
#wahlfeld.l{left:24px} #wahlfeld.r{right:10px}
#wahlfeld.o{top:26px}  #wahlfeld.u{bottom:12px}
#wahlfeld h2{margin:0 14px 3px 0;font-size:13px;font-weight:650;line-height:1.25}
#wahlfeld p{margin:0;font-size:11.5px;color:var(--ink2);
  font-variant-numeric:tabular-nums;line-height:1.45}
#wahlfeld p b{color:var(--ink);font-weight:600}
#wahlfeld .folgt{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);
  color:var(--muted);font-size:11px}
#wahlfeld .folgt b{color:var(--ink2);font-weight:600}
#wahlzu{position:absolute;top:5px;right:6px;background:none;border:0;padding:2px 4px;
  color:var(--muted);font:inherit;font-size:13px;line-height:1;cursor:pointer}
#wahlzu:hover{color:var(--ink)}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
#ueber{position:fixed;inset:0;z-index:8;background:rgba(4,4,4,.97);overflow:auto;
  padding:24px 20px 60px;display:none}
#ueber.auf{display:block}
#ueber .innen{max-width:660px;margin:0 auto}
#ueber h2{font-size:17px;margin:0 0 4px}
#ueber h3{font-size:13px;margin:22px 0 5px;color:var(--ink)}
#ueber p,#ueber li{font-size:13px;color:var(--ink2);margin:0 0 9px}
#ueber li{margin-bottom:4px}
#ueber table{border-collapse:collapse;font-size:12.5px;color:var(--ink2);
  margin:0 0 10px;width:100%}
#ueber td,#ueber th{border-bottom:1px solid var(--line);padding:4px 8px 4px 0;
  text-align:left}
#ueber th{color:var(--muted);font-weight:500;font-size:11px}
#ueber td.z{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#ueber a{color:#9aa07f}
#zu{position:sticky;top:0;float:right}
#laden{position:absolute;inset:14px;display:grid;place-items:center;
  color:var(--muted);font-size:13px;z-index:7;background:var(--plane)}
@media (max-width:900px){
  #huelle{grid-template-columns:1fr;height:auto;min-height:0}
  #links{overflow:visible}
  /* Hochkant ist die Karte breitenbegrenzt: der Rahmen ist fast quadratisch,
     das Telefon ist es nicht. 62 svh hoch stünde darum ein Drittel schwarz
     unter der Karte — also höchstens so hoch, wie die Karte breit ist. */
  #buehne{flex:0 0 auto;height:min(62svh, 104vw);min-height:280px;padding:8px 8px 0}
  #cv{inset:8px 8px 0;width:calc(100% - 16px);height:calc(100% - 8px)}
  #regler{padding:9px 12px 2px}
  #legende{padding:0 12px 8px}
  #tafel{border-left:0;border-top:1px solid var(--line);padding:16px 14px 34px;
    overflow:visible}
  #tafel h1{font-size:18px}
  #laden{inset:8px}
  /* Die Leinwand liegt hier acht Punkte vom Rand statt vierzehn. */
  #wahlfeld.l{left:18px} #wahlfeld.r{right:8px}
  #wahlfeld.o{top:18px}  #wahlfeld.u{bottom:8px}
}
@media (max-width:700px){
  /* Drei Angaben in einer Zeile gehen hier nicht mehr auf. Umbrechen ist
     besser als die Seite breiter zu machen — waagerecht scrollen soll man
     nie müssen. */
  #legzeile{flex-wrap:wrap;gap:2px 12px}
  #legzeile > span{white-space:normal}
  #legzeile #hoehetitel{flex:1 0 100%}
}
@media (max-width:640px){
  #regler{grid-template-columns:1fr 1fr}
}
/* Hochkant und schmal wird der Kasten knapp. Er liegt dort auf einer Karte,
   die nur noch ein Drittel so hoch ist wie am Schirm, und nahm mit 129 Punkten
   fast ein Drittel davon ein — er war mehr im Weg als die Auskunft wert war.
   Jetzt zwei Zeilen statt vier: die vier Zahlen mit Trennpunkten statt in
   Sätzen, der Hinweis in fünf Wörtern. Nachgemessen 78 Punkte, also ein
   Fünftel der Karte. Die Schwelle ist dieselbe, ab der die Beschriftung einen
   Punkt größer setzt (520 Punkte Leinwandbreite, hier 560 Fensterbreite). */
@media (max-width:560px){
  #wahlfeld{max-width:none;padding:5px 8px 6px}
  #wahlfeld.l, #wahlfeld.r{left:8px;right:8px}
  #wahlfeld.o{top:8px} #wahlfeld.u{bottom:6px}
  #wahlfeld h2{font-size:12px;margin:0 16px 1px 0}
  #wahlfeld p{font-size:10.5px;line-height:1.35}
  #wahlfeld .folgt{margin-top:3px;padding-top:3px;font-size:10px}
  #wahlzu{top:2px;right:3px;font-size:12px}
}
@media (max-width:440px){
  #regler{grid-template-columns:1fr;gap:8px}
}
</style>
</head>
<body>
<div id="huelle">
  <div id="links">
    <div id="buehne">
      <canvas id="cv"></canvas>
      <div id="wahlfeld"><button id="wahlzu" aria-label="Clear selection"
        title="Clear selection">×</button>
        <h2 id="wahlname">…</h2><p id="wahlzahlen">…</p>
        <p class="folgt" id="wahlfolgt">…</p></div>
      <div id="laden">Loading timetable …</div>
    </div>
    <div id="regler">
      <div class="reg">
        <label>Map → Time map <i id="wMorph">Time map</i></label>
        <div class="schub">
          <button class="spiel" id="pMorph" aria-pressed="false"
            aria-label="Sweep back and forth between map and time map"
            title="Sweep back and forth between map and time map">▶</button>
          <input id="sMorph" type="range" min="0" max="1000" value="1000">
        </div>
      </div>
      <div class="reg">
        <label>Share of population within reach <i id="wAnteil">…</i></label>
        <div class="schub">
          <button class="spiel" id="pAnteil" aria-pressed="false"
            aria-label="Sweep from the conurbation to the geography"
            title="Sweep from the conurbation to the geography">▶</button>
          <input id="sAnteil" type="range" min="0" max="1000" value="846">
        </div>
      </div>
      <div class="reg">
        <label>Sea level <i id="wWasser">…</i></label>
        <div class="schub ohne">
          <input id="sWasser" type="range" min="0" max="400" value="90">
        </div>
      </div>
    </div>
    <div id="legende">
      <div id="legzeile">
        <span class="titel" id="hoehetitel">Height</span>
        <span id="schneezeile">…</span>
        <span id="legmass"><span id="mtext">…</span><i id="mstrich"></i></span>
      </div>
      <div id="band"></div>
      <div id="legtick"></div>
    </div>
  </div>
  <div id="tafel">
    <h1>Germany, drawn by its timetables</h1>
    <p id="unterzeile">…</p>

    <div class="gruppe">
      <p class="titel">Where the share slider stands</p>
      <p id="polzeile">…</p>
      <p id="isozeile">…</p>
    </div>

    <div class="gruppe">
      <p class="titel">Show</p>
      <div id="knoepfe">
        <button id="kNamen" aria-pressed="true">Names</button>
        <button id="kLinien" aria-pressed="true">Contours</button>
        <button id="kPunkte" aria-pressed="true">Stations</button>
        <button id="kHaupt" aria-pressed="false" title="Pairs of stations that a
long-distance train (ICE, IC/EC, Nightjet) links without stopping in between.
Straight lines between stations, not track geometry.">Main axes</button>
        <button id="kNeben" aria-pressed="false" title="Every other directly
linked pair, regional trains only. These do follow the line: half of them are
under 4.5 km.">Branch network</button>
        <button id="kIso" aria-pressed="false">Isochrones</button>
        <button id="zoomzurueck" style="display:none">Reset zoom</button>
        <button id="kUeber">About this map</button>
      </div>
      <p id="zoomhinweis">Wheel or pinch to zoom, drag to pan, double-click to
        reset.</p>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div id="ueber"><div class="innen"><button id="zu">close</button>
  <div id="ueberinhalt"></div></div></div>
<script>
"use strict";
/* ===========================================================================
   Eine Karte, auf der der Maßstab nicht der Kilometer ist, sondern die Minute.

   Zwei Zahlen stecken in jedem Bild. Die **Lage** kommt aus einem
   Federmodell: zwischen je zwei Bahnhöfen hängt eine Feder, deren Ruhelänge
   die Reisezeit mit dem Zug ist, und die Karte ist die Lage, in der alle
   Federn zusammen am wenigsten ziehen.

   Die **Höhe** ist, wie lange es dauert, bis von hier ein bestimmter Anteil
   der Bevölkerung mit dem Zug in Reichweite ist — und dieser Anteil ist ein
   Regler, weil er zwischen den beiden Polen jeder Erreichbarkeitskarte
   schiebt. Bei einem kleinen Anteil zählt nur, wer in der Nähe wohnt, und die
   Karte wird eine Dichtekarte: das Ruhrgebiet gewinnt, weil es sich selbst
   genügt. Bei einem großen muss man bis in die Ecken des Landes, und die
   Karte wird eine Geografiekarte: Fulda und Kassel gewinnen, weil sie in der
   Mitte liegen. Dazwischen liegt, was sich als angebunden anfühlt.

   Gezeichnet wird das, wie ein Atlas ein Gebirge zeichnet: ein Höhenfeld,
   fünfunddreißig Farbbänder darüber, auf jeder Bandgrenze eine Höhenlinie,
   und ein Licht aus Nordwesten, das in die Farbe hineingerechnet wird statt
   als graue Ebene darüberzuliegen.
   =========================================================================== */

const cv = document.getElementById('cv'), ctx = cv.getContext('2d', {alpha:false});
const $ = id => document.getElementById(id);

/* ---------- Die Farbleiter: fünf Blaustufen unter Wasser, vierundzwanzig
   Höhenstufen eines physischen Atlas darüber — Tiefland satt grün, Gelbgrün,
   Gelb, Ocker, Orange, Rot, Braun —, und zuoberst sechs Bänder Schnee.
   Fünfunddreißig Bänder, damit jede Grenze eine Höhenlinie tragen kann und
   die Karte die gestochene Dichte einer Reliefkarte bekommt. ---------- */
const WASSER = ['#04182d','#072843','#0b3a5e','#11507c','#186699'];
const LAND = ['#17682b','#20742c','#2b812e','#388e31','#479a36','#589f3b',
  '#6cab41','#82b649','#98c052','#aec95b','#c2ce62','#d2cb60','#dcc05a',
  '#e3b154','#e39f4b','#df8c43','#d7793c','#cc6737','#bf5734','#ae4931',
  '#9b3d2e','#8d3b2d','#7f3f33','#77483f'];
const SCHNEE = ['#9c918d','#b4aca9','#c9c2bf','#dcd8d6','#efedec','#ffffff'];
const RAMPE = WASSER.concat(LAND, SCHNEE);
const NW = WASSER.length, NL = LAND.length, NS = SCHNEE.length;
/* Wo im Land-und-Schnee-Teil die Schneegrenze liegt. */
const SCHNEEANTEIL = NL / (NL + NS);

let P = null, ISO = null;
let n = 0, nm = [], halte = null;
let gxx, gyy, fxx, fyy, hh, roh, REICH, einzug, hmax = 1, rmin = 0;
let wx, wy;
let umriss = [], laender = [], umrissW = [], laenderW = [];
/* Das Netz als Paare von Bahnhofsindizes, Hauptachsen zuerst — `kantenHaupt`
   ist die Grenze zwischen den beiden Lagen. */
let kanten = null, kantenHaupt = 0;
let RAHMEN = null, WELT = null, ZUSCHNITT = 1, ansichtGesetzt = false;

const Z = {morph:1, wasser:90, anteil:0.50, namen:true, linien:true,
           punkte:true, iso:false, isoKnoten:-1, wahl:-1,
           haupt:false, neben:false};
/* Läuft die Kamera dem gewählten Bahnhof nach? Das wird beim Abspielen
   gesetzt und endet, sobald die Fahrt endet oder jemand selbst schiebt. */
let folgt = false;

/* ------------------------------------------------------------------ Laden */
function entpacke(b64, teiler){
  const s = atob(b64), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  const q = new Int16Array(u.buffer), f = new Float32Array(q.length);
  for (let i = 0; i < q.length; i++) f[i] = q[i] / teiler;
  return f;
}

async function los(){
  P = await (await fetch('data/karte.json')).json();
  n = P.namen.length; nm = P.namen; halte = P.halte;
  const mk = P.minprokm;
  gxx = entpacke(P.geox, 10); gyy = entpacke(P.geoy, 10);
  for (let i = 0; i < n; i++){ gxx[i] *= mk; gyy[i] *= mk; }
  fxx = entpacke(P.flachx, 10); fyy = entpacke(P.flachy, 10);
  REICH = entpacke(P.reichweite, 1);          /* STUFEN x n, ganze Minuten */
  hh = new Float32Array(n); roh = new Float32Array(n);
  einzug = entpacke(P.einzug, 0.01);
  Z.anteil = P.stufen[P.stufe_vor];
  /* Der Regler wird aus der Nutzlast gestellt und nicht im HTML: sonst
     stehen zwei Voreinstellungen in der Seite, und eine davon ist irgendwann
     die falsche. */
  {
    const Q = P.stufen, l0 = Math.log(Q[0]), l1 = Math.log(Q[Q.length-1]);
    $('sAnteil').value = Math.round(1000 * (Math.log(Z.anteil) - l0) / (l1 - l0));
  }
  stufeSetzen();
  const ring = r => {
    const X = entpacke(r[0],10), Y = entpacke(r[1],10), o = new Float32Array(X.length*2);
    for (let i=0;i<X.length;i++){ o[2*i]=X[i]*mk; o[2*i+1]=Y[i]*mk; }
    return o;
  };
  umriss = P.umriss.map(ring); laender = P.laender.map(ring);
  if (P.kanten){
    kanten = new Int32Array(entpacke(P.kanten, 1));
    kantenHaupt = P.kanten_haupt | 0;
  }
  wx = new Float32Array(n); wy = new Float32Array(n);
  geoGitterBauen();
  dreieckeBauen();
  rahmenBestimmen();
  bauLegende(); bauText(); text();
  $('laden').remove();
  addEventListener('resize', () => { messen(); bald(); });
  messen();
}

/* Der Anteil ist stufenlos, die Rechnung nicht: in der Nutzlast liegen
   achtzehn Stufen von 2 bis 90 Prozent, logarithmisch gelegt, weil sich das
   Bild unten schnell und oben langsam ändert. Zwischen den beiden
   benachbarten Stufen wird linear in log q gemischt — der Unterschied
   zwischen zwei Nachbarstufen ist klein gegen die Glättung des Höhenfeldes,
   also ist die Mischung nicht zu sehen. */
function stufeSetzen(){
  const Q = P.stufen, lq = Math.log(Z.anteil);
  let a = 0;
  while (a < Q.length - 2 && Math.log(Q[a+1]) < lq) a++;
  const f = Math.max(0, Math.min(1,
    (lq - Math.log(Q[a])) / (Math.log(Q[a+1]) - Math.log(Q[a]))));
  const o0 = a*n, o1 = (a+1)*n;
  rmin = Infinity;
  for (let i=0;i<n;i++){
    const v = REICH[o0+i] + (REICH[o1+i] - REICH[o0+i]) * f;
    roh[i] = v;
    if (v < rmin) rmin = v;
  }
  hmax = 1;
  for (let i=0;i<n;i++){
    hh[i] = roh[i] - rmin;
    if (hh[i] > hmax) hmax = hh[i];
  }
  abgelegen = null;        /* die abgelegensten Orte sind jetzt andere */
  statStand++;             /* und das Grundfeld muss neu */
  statAnteil++;            /* das Leitergitter auch */
}

/* Der Rahmen wird **einmal** bestimmt und gilt für jede Reglerstellung:
   über die Bahnhöfe in beiden Lagen *und* über den Umriss in beiden Lagen.
   Nur die Bahnhöfe zu nehmen war zu wenig — das Verschiebungsfeld verzieht
   die Küste über sie hinaus, und dann stand Sylt vor dem Bildrand. Und einen
   Rahmen je Reglerstellung zu rechnen wäre falsch: dann wandert der Maßstab
   beim Schieben, und die Verformung wäre nicht mehr zu sehen.

   Dieser Rahmen war aber zu weit, und zwar **ganz** durch die Zeitkarte:
   die Lage nach Reisezeit spannt 1.274 × 1.302 Minuten, die Landkarte nur
   715 × 956. Ein paar Enden von Nebenbahnen — Oberwiesenthal, Rügen,
   Westerland — fahren in der Zeitkarte so weit hinaus, dass Deutschland in
   der Mitte des Bildes auf drei Viertel der Bildhöhe schrumpft und dort
   sitzt wie eine Briefmarke auf einem Bogen.

   Also wird der Rahmen zugeschnitten, und zwar **so weit, wie die Landkarte
   es zulässt**: bis sie in der engeren Achse mit einem Saum von ZOOMSAUM
   Minuten genau hineinpasst. Der Faktor ist damit nicht gesetzt, sondern
   gemessen — bei diesen Daten 1,29. Der Reglerstreifen unter der Karte
   kostet auch noch Höhe, und nachgemessen gegen die Fassung davor bleibt:
   +23 % auf 1440 × 900 (Maßstab 0,809 gegen 0,660 Pixel je Minute), +21 %
   auf 1280 × 720, +24 % auf 1920 × 1080, +29 % hochkant auf dem Telefon, wo
   die Breite begrenzt und der Zuschnitt voll durchkommt. Verschoben wird
   danach nur noch, nie gedehnt, sonst wäre der Gewinn wieder weg.

   Bei morph = 0 geht damit garantiert nichts verloren. In der Zeitkarte
   fliegen die weit hinausgefahrenen Enden aus dem Bild: 108 von 4.781
   Bahnhöfen, 2,3 % — aber nur 0,9 % aller Halte, Median 20 Halte am Tag
   gegen 42 im ganzen Netz. Das ist der Handel, und er ist billig: die
   Bodenseerunde, die Rügener Kleinbahn, die Erzgebirgs- und
   Zittauer Schmalspur, Sylt und Dagebüll, der Bayerische Wald, die
   Heidekrautbahn. Halte mit acht Zügen am Tag haben kaum Federn, die sie
   halten — ihre Lage ist die unsicherste der ganzen Rechnung. */
const ZOOMSAUM = 8;
function rahmenBestimmen(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;          /* alles, beide Lagen */
  let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;          /* nur die Landkarte */
  const nimm = (x,y) => { if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; };
  const heim = (x,y) => { if(x<a0)a0=x; if(x>a1)a1=x; if(y<b0)b0=y; if(y>b1)b1=y; };
  for (let i=0;i<n;i++){ nimm(gxx[i],gyy[i]); nimm(fxx[i],fyy[i]); heim(gxx[i],gyy[i]); }
  const merk = Z.morph;
  for (const m of [0, 1]){
    Z.morph = m; lage(); umrissVerziehen();
    for (const rs of [umrissW, laenderW]) for (const r of rs)
      for (let i=0;i<r.length;i+=2){
        nimm(r[i], r[i+1]);
        if (m === 0) heim(r[i], r[i+1]);
      }
  }
  Z.morph = merk; lage();

  /* Der größte Zuschnitt, bei dem die Landkarte noch ganz hineinpasst. */
  const zoom = Math.max(1, Math.min((x1-x0) / (a1-a0 + 2*ZOOMSAUM),
                                    (y1-y0) / (b1-b0 + 2*ZOOMSAUM)));
  /* Zugeschnitten wird um die Mitte der Landkarte — dort soll der Gewinn an. */
  const cx = (a0+a1)/2, cy = (b0+b1)/2, f = 1/zoom;
  /* Schieben, bis [c0,c1] drin liegt; die Länge bleibt, was sie ist. */
  const passe = (u0, u1, c0, c1) => {
    const L = u1 - u0;
    if (c1 - c0 >= L){ const m = (c0+c1)/2; return [m - L/2, m + L/2]; }
    const d = c0 < u0 ? c0 - u0 : c1 > u1 ? c1 - u1 : 0;
    return [u0 + d, u1 + d];
  };
  const X = passe(cx + (x0-cx)*f, cx + (x1-cx)*f, a0 - ZOOMSAUM, a1 + ZOOMSAUM);
  const Y = passe(cy + (y0-cy)*f, cy + (y1-cy)*f, b0 - ZOOMSAUM, b1 + ZOOMSAUM);
  RAHMEN = [X[0], X[1], Y[0], Y[1]];
  ZUSCHNITT = zoom;
  /* Und **WELT**: der ungeschnittene Umfang, in dem es überhaupt Karte gibt.
     RAHMEN sagt nur, wohin die Ansicht beim Aufschlagen zeigt; gerechnet und
     gezeichnet wird bis WELT, damit man herauszoomen und die Enden ansehen
     kann, die der Zuschnitt aus dem Bild geworfen hat. */
  const saum = 24;
  WELT = [x0 - saum, x1 + saum, y0 - saum, y1 + saum];
  /* Und dorthin zeigt die Ansicht beim Aufschlagen: in die Mitte des
     Rahmens. Die Mitte des Umfangs läge gut achtzig Minuten weiter südlich,
     weil die Zeitkarte nach Süden weiter ausgreift — dann wäre der
     Anfangszuschnitt einseitig und oben fehlte mehr als unten. */
  if (!ansichtGesetzt){
    V.cx = (RAHMEN[0]+RAHMEN[1])/2; V.cy = (RAHMEN[2]+RAHMEN[3])/2;
    ansichtGesetzt = true;
  }
}

/* ----------------------------------------------------- Maße und Projektion */
let W = 0, H = 0, DPR = 1;
/* Der Deckel für die Punktdichte. Zwei genügen auf jedem Schirm, den es gibt,
   und alles darüber kostet nur. `let`, weil `build/film.mjs` ihn hochdreht:
   ein Film darf sich Überabtastung leisten, die Seite nicht. */
let DPRMAX = 2;
let FW = 0, FH = 0, ZELLE = 3.0, X0 = 0, Y0 = 0;          /* Bildgitter */
let GW = 0, GH = 0, GZELLE = 3.6, GX0 = 0, GY0 = 0;       /* Rechengitter */
let SW = 0, SH = 0, SX0 = 0, SY0 = 0;                     /* Grundgitter */
let mitteX = 0, mitteY = 0, skala = 1, skalaBasis = 1, zx = 0, zy = 0;

/* --------------------------------------------------------------- Ansicht
   Zoom und Verschiebung sind eine Sache des Betrachtens, nicht der Karte:
   sie ändern nur, welcher Weltausschnitt auf den Schirm kommt.

   ZOOMSTART ist die Stellung beim Aufschlagen, und sie ist größer als eins.
   Das kostet etwas, und zwar unvermeidlich: Deutschland ist hoch (990
   Minuten) und der Schirm ist breit, die Ansicht also **höhenbegrenzt** —
   das Land füllt schon bei Zoom 1 die Bildhöhe und die Hälfte der Breite
   bleibt leer. Größer geht darum nur, indem oben und unten etwas
   abgeschnitten wird: bei 1,15 sind das rund fünfzig Minuten je Seite, also
   die Spitze von Sylt und der Zipfel um Konstanz. Das ist der Handel, und er
   ist zu vertreten, seit man herauszoomen kann.

   Nach unten reicht der Zoom bis ZOOMMIN, und das ist nicht eins: dort passt
   der **ganze** Umfang ins Bild, samt der Enden, die der Zuschnitt (4.6) aus
   dem Rahmen geworfen hat. Wer sie ansehen will, zoomt heraus. */
const ZOOMSTART = 1.15, ZOOMMAX = 16;
const V = {zoom: ZOOMSTART, cx: 0, cy: 0};
let ZOOMMIN = 1;
function ansichtKlemmen(){
  const [x0,x1,y0,y1] = WELT;
  const hw = W/(2*skala), hh2 = H/(2*skala);
  if (x1 - x0 <= 2*hw) V.cx = (x0+x1)/2;
  else V.cx = Math.max(x0 + hw, Math.min(x1 - hw, V.cx));
  if (y1 - y0 <= 2*hh2) V.cy = (y0+y1)/2;
  else V.cy = Math.max(y0 + hh2, Math.min(y1 - hh2, V.cy));
}
/* Zoomen **um einen Punkt**: der Weltpunkt unter dem Finger bleibt unter dem
   Finger. Ohne das zoomt man ins Nichts und muss hinterher suchen. */
function zoomUm(px, py, faktor){
  const vorher = [schirmZuWeltX(px), schirmZuWeltY(py)];
  V.zoom = Math.max(ZOOMMIN, Math.min(ZOOMMAX, V.zoom * faktor));
  skala = skalaBasis * V.zoom;
  V.cx = vorher[0] - (px - W/2)/skala;
  V.cy = vorher[1] + (py - H/2)/skala;
  ansichtKlemmen();
}
/* Wie grob das Höhenfeld gerastert wird — in **Pixeln je Zelle**, nicht in
   Minuten (siehe feldMasseSetzen): in Ruhe eine Zelle je Pixel, beim Ziehen
   gröber, in der Fahrt noch gröber. Ein Bild, das ruckelt, zeigt weniger als
   ein Bild, das eine Rasterstufe verliert; ein Bild, das steht, soll die
   feinste haben. */
const FEIN_RUHE = 1.0, FEIN_HALT = 1.5, FEIN_ZIEH = 3.0;
/* In der Fahrt soll die Karte **nicht** weich werden. Also wird nicht
   vorsorglich gröber gerastert, sondern gemessen: die Fahrt läuft auf der
   Ruhestufe, und nur wenn ein Bild länger braucht als SPIELBUDGET, geht sie
   schrittweise gröber — nie gröber als FEIN_GROB, was einer sehr milden
   Weichheit entspricht und weit von den 3,8 Pixeln je Zelle entfernt ist,
   die hier einmal fest eingestellt waren. Wird es wieder schnell, kommt die
   Schärfe zurück. Auf einem gewöhnlichen Rechner kommt die Stufe gar nicht
   zum Tragen. */
const SPIELBUDGET = 110, FEIN_GROB = 1.35;
let spielFein = FEIN_RUHE;
let FEINHEIT = FEIN_RUHE;
let spiel = null;

function messen(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(DPRMAX, window.devicePixelRatio || 1);
  W = Math.max(280, Math.round(r.width)); H = Math.max(280, Math.round(r.height));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bald();
}

let lageMorph = NaN;
function lage(){
  const m = Z.morph;
  if (m !== lageMorph){ lageMorph = m; statStand++; }
  for (let i=0;i<n;i++){
    wx[i] = gxx[i] + (fxx[i]-gxx[i])*m;
    wy[i] = gyy[i] + (fyy[i]-gyy[i])*m;
  }
}
const schirmX = v => mitteX + (v - zx) * skala;
const schirmY = v => mitteY - (v - zy) * skala;
const schirmZuWeltX = p => zx + (p - mitteX) / skala;
const schirmZuWeltY = p => zy - (p - mitteY) / skala;

/* ------------------------------------------------- Der Umriss, verzogen
   Die Grenzen liegen in der Geografie, die Karte liegt irgendwo zwischen
   Geografie und Zeit. Verschoben wird jeder Grenzpunkt mit dem
   Verschiebungsfeld der Bahnhöfe selbst — gewichtet mit dem Kehrwert des
   Quadrats des Abstands. So bleibt die Kieler Förde die Kieler Förde, auch
   wenn Kiel wegläuft. */
let gZ=0, gW=0, gH_=0, gX0=0, gY0=0, gKopf=null, gListe=null;
function geoGitterBauen(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for (let i=0;i<n;i++){
    if(gxx[i]<x0)x0=gxx[i]; if(gxx[i]>x1)x1=gxx[i];
    if(gyy[i]<y0)y0=gyy[i]; if(gyy[i]>y1)y1=gyy[i];
  }
  gZ = 45; gX0 = x0-90; gY0 = y0-90;
  gW = Math.ceil((x1-x0+180)/gZ); gH_ = Math.ceil((y1-y0+180)/gZ);
  const anz = new Int32Array(gW*gH_+1), zelle = new Int32Array(n);
  for (let i=0;i<n;i++){
    const cx = Math.min(gW-1, Math.max(0, ((gxx[i]-gX0)/gZ)|0));
    const cy = Math.min(gH_-1, Math.max(0, ((gyy[i]-gY0)/gZ)|0));
    zelle[i] = cy*gW+cx; anz[zelle[i]+1]++;
  }
  for (let k=0;k<gW*gH_;k++) anz[k+1]+=anz[k];
  gKopf = anz; gListe = new Int32Array(n);
  const lauf = anz.slice();
  for (let i=0;i<n;i++) gListe[lauf[zelle[i]]++] = i;
}
const WARPEPS = 35*35, WARPMIN = 26;
function verziehe(px, py, aus){
  const cx0 = ((px-gX0)/gZ)|0, cy0 = ((py-gY0)/gZ)|0;
  let sw=0, sx=0, sy=0, gef=0;
  for (let r=1; r<=9 && gef<WARPMIN; r++){
    sw=0;sx=0;sy=0;gef=0;
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
      const jx=cx0+dx, jy=cy0+dy;
      if (jx<0||jy<0||jx>=gW||jy>=gH_) continue;
      for (let q=gKopf[jy*gW+jx]; q<gKopf[jy*gW+jx+1]; q++){
        const i = gListe[q], ex = gxx[i]-px, ey = gyy[i]-py;
        const w = 1/(ex*ex+ey*ey+WARPEPS);
        sw += w; sx += w*(wx[i]-gxx[i]); sy += w*(wy[i]-gyy[i]); gef++;
      }
    }
  }
  aus[0] = px + (sw>0?sx/sw:0); aus[1] = py + (sw>0?sy/sw:0);
}
function umrissVerziehen(){
  const t = [0,0];
  const eine = rs => rs.map(r => {
    const o = new Float32Array(r.length);
    for (let i=0;i<r.length;i+=2){ verziehe(r[i], r[i+1], t); o[i]=t[0]; o[i+1]=t[1]; }
    return o;
  });
  umrissW = eine(umriss); laenderW = eine(laender);
}

/* ------------------------------------------------- Der Umriss in Dreiecken
   Ein verzogener Ring lässt sich nicht einfach füllen. Das
   Verschiebungsfeld schert ihn, und wo er sich dabei selbst überschlägt,
   heben sich die Umlaufzahlen auf: mit der Nonzero-Regel wird aus der Falte
   ein **Loch**, und auf der Karte standen kleine schwarze Dreiecke mitten im
   Land. Mit Evenodd wird es nicht besser, nur anders.

   Darum wird jeder Ring **einmal** in Dreiecke zerlegt — Ohrenschneiden,
   O(n²) bei 2.528 Punkten, also einmalig nichts — und je Bild werden die
   Dreiecke gefüllt. Sie überdecken einander in der Falte, statt sich
   wegzurechnen. Damit das auch bei umgeklappten Dreiecken gilt, wird die
   Umlaufrichtung nach dem Verziehen geprüft und notfalls gedreht: dann
   zählen alle positiv, und eine Überlappung ist nie ein Loch. */
function ohren(r){
  const m = r.length/2;
  const idx = []; for (let i=0;i<m;i++) idx.push(i);
  let flaeche = 0;
  for (let i=0;i<m;i++){
    const j=(i+1)%m;
    flaeche += r[2*i]*r[2*j+1] - r[2*j]*r[2*i+1];
  }
  if (flaeche < 0) idx.reverse();
  const X = i => r[2*idx[i]], Y = i => r[2*idx[i]+1];
  const kreuz = (a,b,c) => (X(b)-X(a))*(Y(c)-Y(a)) - (Y(b)-Y(a))*(X(c)-X(a));
  const drin = (a,b,c,p) => {
    const d1 = kreuz(a,b,p), d2 = kreuz(b,c,p), d3 = kreuz(c,a,p);
    return (d1>=0 && d2>=0 && d3>=0) || (d1<=0 && d2<=0 && d3<=0);
  };
  const tri = [];
  const lebt = new Uint8Array(m).fill(1);
  let uebrig = m, wache = 0;
  let a = 0;
  const naechst = i => { let j=(i+1)%m; while(!lebt[j]) j=(j+1)%m; return j; };
  while (uebrig > 3 && wache < 8*m){
    wache++;
    const b = naechst(a), c = naechst(b);
    let ok = kreuz(a,b,c) > 0;
    if (ok) for (let q=0;q<m;q++){
      if (!lebt[q] || q===a || q===b || q===c) continue;
      if (drin(a,b,c,q)){ ok = false; break; }
    }
    if (ok){
      tri.push(idx[a], idx[b], idx[c]);
      lebt[b] = 0; uebrig--; wache = 0;
    } else a = b;
  }
  {   // der Rest als Fächer — bei einem entarteten Ring besser als nichts
      const rest = [];
      for (let q=0;q<m;q++) if (lebt[q]) rest.push(idx[q]);
      for (let q=1;q+1<rest.length;q++) tri.push(rest[0], rest[q], rest[q+1]);
  }
  return tri;
}
let dreiecke = null;
function dreieckeBauen(){
  dreiecke = [...umriss, ...laender].map(ohren);
}

/* --------------------------------------------------------- Maske und Feld */
let maskeC = null, maskeA = null, inseln = 0, maskeTakt = 0;
/* Acht Richtungen für die Nachsicht am Rand, einmal gerechnet. */
const RINGX = new Float64Array(8), RINGY = new Float64Array(8);
for (let k=0;k<8;k++){
  RINGX[k] = Math.cos(k*Math.PI/4); RINGY[k] = Math.sin(k*Math.PI/4);
}
/* `statStand` zählt hoch, sobald sich Lage oder Anteil ändern — also alles,
   was das Grundgitter betrifft. Zoom und Verschiebung ändern ihn **nicht**,
   und darum werden Grundfeld und Maske beim Betrachten nicht neu gerechnet. */
let maskeStand = -1, statStand = 0, statGerechnet = -1, statAnteil = 0;
const inselIdx = [];
/* Und je Scholle, wie weit ihr Bahnhof draußen liegt: 0 an der Küstenlinie,
   1 klar im Meer. Daran hängt ihr Radius (siehe maskeBauen). */
const inselF = [];
let fH = null;

/* Die Rasterweite wird nicht in Minuten gesetzt, sondern in
   **Bildschirmpixeln**: eine Zelle soll etwa so groß sein wie ein Pixel.
   Eine feste Minutenzahl war beides falsch — auf dem großen Schirm zu grob
   (drei Minuten waren dort zweieinhalb Pixel, und alles, was ins Raster
   gezeichnet wird, also Farbbänder, Höhenlinien und Licht, war um diesen
   Faktor verwaschen) und auf dem Telefon Verschwendung, weil dieselbe Minute
   dort ein Drittel so breit ist. So bleibt die Schärfe auf jedem Gerät
   dieselbe und die Rechenlast auch. Nach oben deckelt ZELLMAX die Zellzahl,
   damit ein sehr großes Fenster die Rechnung nicht sprengt. *//* Drei Gitter, und jedes hat genau eine Aufgabe.

   **Das Grundgitter** liegt über dem ganzen Bildausschnitt, fest mit
   SZELLE Minuten je Zelle, und hängt darum **nicht am Zoom**. Es trägt die
   Landmaske und daraus zwei Dinge, die sich beim Heranzoomen nicht ändern
   dürfen: das obere Ende der Farbleiter (4.7) und die Liste der
   Ausgewanderten (4.4). Eine Farbleiter, die beim Zoomen wandert, wäre
   keine — dieselbe Höhe muss dieselbe Farbe haben, ganz gleich wie nah man
   herangeht. Auch die Isochronen (4.9) liegen hier.

   **Das Bildgitter** deckt nur ab, was zu sehen ist, mit einer Zelle je
   Bildschirmpixel. Beim Hineinzoomen wächst damit die Auflösung und nicht
   die Zellzahl: derselbe Rechenaufwand, dreimal so viel Detail.

   **Das Rechengitter** liegt dazwischen und nur dann, wenn man
   hineingezoomt hat — dort ist das Grundgitter zu grob für ein Bild. Es
   braucht einen Saum von zweieinhalb σ über den sichtbaren Ausschnitt
   hinaus, weil die Glocke so weit trägt; ohne ihn stünde am Bildrand ein
   falscher Wert. */
/* Auch dieser Deckel ist `let` und aus demselben Grund: der Film rechnet
   Bilder in Minuten statt in Millisekunden und darf das Gitter sprengen. */
let ZELLMAX = 700000;
const SZELLE = 3.0, GSAUM = 2.5 * 11.0;
function feldMasseSetzen(){
  const [x0,x1,y0,y1] = WELT;
  /* Grundgitter: der ganze Umfang, feste Weite. Nicht nur der Rahmen, denn
     wer herauszoomt, will auch dort Land, Farben und Inseln sehen. */
  const srand = 6;
  SX0 = x0 - srand; SY0 = y0 - srand;
  SW = Math.ceil((x1 - x0 + 2*srand) / SZELLE);
  SH = Math.ceil((y1 - y0 + 2*srand) / SZELLE);

  /* Bildgitter: der sichtbare Ausschnitt, auf den Bildausschnitt geklemmt. */
  ZELLE = Math.max(0.1, FEINHEIT / skala);
  const frand = 2 * ZELLE;
  const hw = W/(2*skala) + frand, hh2 = H/(2*skala) + frand;
  let a0 = Math.max(SX0, V.cx - hw), a1 = Math.min(SX0 + SW*SZELLE, V.cx + hw);
  let b0 = Math.max(SY0, V.cy - hh2), b1 = Math.min(SY0 + SH*SZELLE, V.cy + hh2);
  const bx = a1 - a0, by = b1 - b0;
  const zellen = (bx/ZELLE) * (by/ZELLE);
  if (zellen > ZELLMAX) ZELLE *= Math.sqrt(zellen / ZELLMAX);
  X0 = a0; Y0 = b0;
  FW = Math.max(2, Math.ceil(bx / ZELLE));
  FH = Math.max(2, Math.ceil(by / ZELLE));

  /* Rechengitter: nur wenn es feiner sein müsste als das Grundgitter. */
  GZELLE = Math.max(0.2, FELDGROB / skala * (FEINHEIT / FEIN_RUHE));
  if (GZELLE >= SZELLE){ GW = 0; GH = 0; return; }
  GX0 = a0 - GSAUM; GY0 = b0 - GSAUM;
  GW = Math.ceil((bx + 2*GSAUM) / GZELLE);
  GH = Math.ceil((by + 2*GSAUM) / GZELLE);
  const gz = GW*GH;
  if (gz > ZELLMAX){
    GZELLE *= Math.sqrt(gz / ZELLMAX);
    GW = Math.ceil((bx + 2*GSAUM) / GZELLE);
    GH = Math.ceil((by + 2*GSAUM) / GZELLE);
  }
}
const feldX = x => (x - X0)/ZELLE;
const feldY = y => (Y0 + FH*ZELLE - y)/ZELLE;
const grobX = x => (x - GX0)/GZELLE;
const grobY = y => (GY0 + GH*GZELLE - y)/GZELLE;
const grundX = x => (x - SX0)/SZELLE;
const grundY = y => (SY0 + SH*SZELLE - y)/SZELLE;

/* Wo ist Land?
   Zuerst sagt es der **verzogene Umriss**: Deutschland, mit dem
   Verschiebungsfeld in die Zeit gezogen. Der reicht aber nicht, denn der
   Umriss ist ein geglättetes Mittel, und die Federkarte schleudert einzelne
   Bahnhöfe weit darüber hinaus — die Rügener Bäderbahn liegt in der Zeit
   zwölf Stunden von allem entfernt und stünde in der reinen Zeitkarte
   draußen im Schwarzen. Ein Bahnhof gehört immer auf Land.
   Dazu kommt darum eine zweite Schicht, aber **nur für die Ausgewanderten**:
   für jeden Bahnhof, der außerhalb des Umrisses liegt, eine weiche Scholle.
   Das stellt sich von selbst richtig ein — in der Landkarte liegt kein
   Bahnhof draußen und es kommt nichts hinzu, und je weiter der Regler in die
   Zeit läuft, desto mehr Inseln lösen sich vom Land. Eine frühere Fassung nahm
   dafür die Abdeckung *aller* Bahnhöfe und blies damit auch die Landkarte auf
   eine Wolke auf, zwanzig Kilometer über jede Küste hinaus.

   Die Scholle war eine Glockenkurve mit einem weichen Saum, und aus ihr wurde
   auf dem Bildschirm ein ausgefranster Nebelfleck von gut zwanzig Minuten
   Radius. Jetzt ist sie eine **Kreisscheibe** mit hartem Rand und halbem
   Radius. Das ist zweimal besser: der Rand ist eine Kante statt eines
   Verlaufs, und die Scheibe hat eine Zahl, an der man sie fassen kann. Wo
   mehrere Ausgewanderte dicht liegen, laufen die Scheiben zu einer Gruppe
   zusammen — ein Archipel statt einer Wolke. */
const INSELR = 11.5;function maskeBauen(){
  if (!maskeC){ maskeC = document.createElement('canvas'); }
  if (maskeC.width !== SW || maskeC.height !== SH){
    maskeC.width = SW; maskeC.height = SH;
  }
  const mk = maskeC.getContext('2d', {willReadFrequently:true});
  mk.clearRect(0,0,SW,SH);
  mk.fillStyle = '#fff';
  mk.beginPath();
  const alle = [...umrissW, ...laenderW];
  for (let ri=0; ri<alle.length; ri++){
    const r = alle[ri], tri = dreiecke[ri];
    for (let q=0;q<tri.length;q+=3){
      const a=tri[q], b=tri[q+1], c=tri[q+2];
      let ax=grundX(r[2*a]), ay=grundY(r[2*a+1]);
      let bx=grundX(r[2*b]), by=grundY(r[2*b+1]);
      let cx=grundX(r[2*c]), cy=grundY(r[2*c+1]);
      if ((bx-ax)*(cy-ay) - (by-ay)*(cx-ax) < 0){
        const tx=bx, ty=by; bx=cx; by=cy; cx=tx; cy=ty;
      }
      mk.moveTo(ax, ay); mk.lineTo(bx, by); mk.lineTo(cx, cy); mk.closePath();
    }
  }
  mk.fill();

  const d = mk.getImageData(0,0,SW,SH).data;
  if (!maskeA || maskeA.length !== SW*SH) maskeA = new Uint8Array(SW*SH);
  for (let k=0;k<SW*SH;k++) maskeA[k] = d[(k<<2)+3];
  /* Wer liegt draußen? Mit zwei Minuten Nachsicht, weil der Umriss auf
     Zellenkanten gerastert ist und die Bahnhöfe im Grenzsaum sonst alle als
     ausgewandert gälten. Die Nachsicht steht in **Minuten** und nicht in
     Zellen, damit dieselbe Karte immer dieselben Inseln hat.

     Gegriffen wird **bilinear** und an einem Ring statt ganzzahlig über ein
     Zellenfenster. Der alte Test lag auf der Zelle, *in* der der Bahnhof
     liegt, und sein Prüffenster sprang darum bei jeder Zellgrenze um eine
     ganze Zelle weiter — an der Küste kippte die Entscheidung dabei hin und
     her. Im Film war das als Flackern zu sehen: die Zahl der Schollen lief
     durch die Verformung nicht monoton (240, 236, 238, 237, 242, 242, 244,
     242, 241 …), also 80 Wechsel in 29 Bildern, und weiße Scheiben poppten am
     Kartenrand an und aus. Ein bilinearer Griff ist **stetig in der Lage des
     Bahnhofs**; eine Scholle wechselt damit einmal, wenn die Küste über sie
     hinwegzieht, statt im Wechsel. */
  const tolz = 2.0 / SZELLE;
  const maskeBei = (fx, fy) => {
    let jx = Math.floor(fx - 0.5), jy = Math.floor(fy - 0.5);
    const gx = fx - 0.5 - jx, gy = fy - 0.5 - jy;
    if (jx < 0) jx = 0; else if (jx > SW-2) jx = SW-2;
    if (jy < 0) jy = 0; else if (jy > SH-2) jy = SH-2;
    const r0 = jy*SW + jx, r1 = r0 + SW;
    return (maskeA[r0] + (maskeA[r0+1]-maskeA[r0])*gx) * (1-gy)
         + (maskeA[r1] + (maskeA[r1+1]-maskeA[r1])*gx) * gy;
  };
  /* **Die Scholle wächst, sie poppt nicht.** Ihr Radius hängt daran, wie weit
     der Bahnhof draußen liegt, und geht an der Küstenlinie auf null. Das war
     der zweite Teil des Flackerns, und der größere: eine Entscheidung ist
     immer ja oder nein, und mit ihr erschien bisher schlagartig eine Scheibe
     von 23 Minuten Durchmesser. Über zwei Sekunden Film traten 101 Bahnhöfe
     **einmal** über die Küste — das ist richtig so, aber bei jedem sprang eine
     weiße Scheibe ins Bild.

     Der Nebeneffekt ist der eigentliche Gewinn: die 34 Bahnhöfe, die genau auf
     der Schwelle liegen und dort hin und her kippen, haben jetzt eine Scholle
     von nahezu null Radius. Ihr Kippen ist damit nicht mehr zu sehen, ohne
     dass die Entscheidung selbst geglättet oder mit einem Gedächtnis versehen
     werden müsste — beides hätte gekostet, dass dieselbe Reglerstellung
     dieselbe Karte zeigt. */
  inselIdx.length = 0; inselF.length = 0;
  for (let i=0;i<n;i++){
    const cx = grundX(wx[i]), cy = grundY(wy[i]);
    let best = maskeBei(cx, cy);
    for (let k=0; k<8 && best <= 120; k++)
      best = Math.max(best, maskeBei(cx + RINGX[k]*tolz, cy + RINGY[k]*tolz));
    if (best > 120) continue;
    const u = (120 - best) / 120;              /* 0 an der Linie, 1 weit raus */
    inselIdx.push(i); inselF.push(u*u*(3 - 2*u));
  }
  inseln = inselIdx.length;
  /* Die Scheiben kommen ins Raster, damit die Statistik dasselbe Land sieht
     wie das Bild — gezeichnet werden sie aber als Pfad in
     Bildschirmauflösung (landPfad), nicht aus diesem Raster. */
  const rad = Math.ceil(INSELR / SZELLE + 1);
  for (let q=0;q<inselIdx.length;q++){
    const i = inselIdx[q], rz = INSELR * inselF[q] / SZELLE;
    if (rz <= 0.05) continue;
    const cx = grundX(wx[i]), cy = grundY(wy[i]);
    const ix0 = Math.max(0,(cx-rad)|0), ix1 = Math.min(SW-1,(cx+rad)|0);
    const iy0 = Math.max(0,(cy-rad)|0), iy1 = Math.min(SH-1,(cy+rad)|0);
    for (let jy=iy0;jy<=iy1;jy++){
      const dy = jy+0.5-cy, dy2 = dy*dy, row = jy*SW;
      for (let jx=ix0;jx<=ix1;jx++){
        const dx = jx+0.5-cx;
        const t = rz + 0.5 - Math.sqrt(dx*dx+dy2);   /* eine Zelle Saum */
        if (t <= 0) continue;
        const b = t >= 1 ? 255 : t * 255;
        if (b > maskeA[row+jx]) maskeA[row+jx] = b;
      }
    }
  }
}

/* Dieselbe Geometrie — Dreiecke und Inselscheiben —, aber in
   Bildschirmkoordinaten und als Pfad. Damit wird die Küste **beschnitten**
   statt ausmaskiert, und das ist der ganze Unterschied zwischen einer Kante
   und einem Verlauf: die Maske lag im Feldraster und wurde beim Hochskalieren
   bilinear über zwei, drei Bildschirmpixel verschmiert. Ein Pfad hat keine
   Auflösung. Nonzero-Umlauf trägt, weil die Dreiecke nach dem Verziehen auf
   positive Umlaufrichtung gedreht werden und ein arc() mit wachsendem Winkel
   dieselbe hat — eine Überlappung addiert also, sie hebt sich nicht auf. */
function landPfad(){
  ctx.beginPath();
  const alle = [...umrissW, ...laenderW];
  for (let ri=0; ri<alle.length; ri++){
    const r = alle[ri], tri = dreiecke[ri];
    for (let q=0;q<tri.length;q+=3){
      const a=tri[q], b=tri[q+1], c=tri[q+2];
      let ax=schirmX(r[2*a]), ay=schirmY(r[2*a+1]);
      let bx=schirmX(r[2*b]), by=schirmY(r[2*b+1]);
      let cx=schirmX(r[2*c]), cy=schirmY(r[2*c+1]);
      if ((bx-ax)*(cy-ay) - (by-ay)*(cx-ax) < 0){
        const tx=bx, ty=by; bx=cx; by=cy; cx=tx; cy=ty;
      }
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.closePath();
    }
  }
  for (let q=0;q<inselIdx.length;q++){
    const i = inselIdx[q], rs = INSELR * inselF[q] * skala;
    if (rs <= 0.15) continue;
    const x = schirmX(wx[i]), y = schirmY(wy[i]);
    ctx.moveTo(x + rs, y);
    ctx.arc(x, y, rs, 0, 6.28318530718);
    ctx.closePath();
  }
}

/* Ein Kastenfilter mit laufender Summe: zwei Additionen je Zelle, ganz
   gleich wie breit der Kasten ist. Außerhalb wird mit Null gerechnet, und
   das darf man hier, weil Zähler und Nenner denselben Filter sehen und sich
   der Rand im Quotienten wieder herauskürzt. */
function kastenX(a, b, w, h, r){
  const inv = 1/(2*r+1);
  for (let y=0;y<h;y++){
    const o = y*w;
    let s = 0;
    for (let x=0;x<=r && x<w;x++) s += a[o+x];
    for (let x=0;x<w;x++){
      b[o+x] = s * inv;
      const zu = x+r+1, ab = x-r;
      if (zu < w) s += a[o+zu];
      if (ab >= 0) s -= a[o+ab];
    }
  }
}
/* Blockweise transponieren. Der senkrechte Kastenfilter lief einmal je
   Spalte durch den ganzen Speicher — bei siebenhunderttausend Zellen sind das
   siebenhunderttausend Sprünge über 2,8 MB, und kein Cache hält das aus.
   Transponieren und waagerecht filtern liest dagegen der Reihe nach. Die
   32er-Blöcke sind dafür da, dass auch das Transponieren selbst nicht
   springt. */
function umlegen(a, b, w, h){
  const B = 32;
  for (let y0=0;y0<h;y0+=B){
    const y1 = Math.min(h, y0+B);
    for (let x0=0;x0<w;x0+=B){
      const x1 = Math.min(w, x0+B);
      for (let y=y0;y<y1;y++){
        const o = y*w;
        for (let x=x0;x<x1;x++) b[x*h+y] = a[o+x];
      }
    }
  }
}
/* Drei Kastenfilter hintereinander sind eine Glocke auf drei Prozent genau
   (Kovesi). Ein Kasten mit Radius r hat die Varianz (r²+r)/3, drei
   gleiche also r²+r — aber r ist ganzzahlig, und damit ist auch σ
   gerastert. Auf dem feinen Gitter fällt das nicht auf; auf dem gröberen
   Rechengitter (FELDGROB) liegen zwischen r = 2 und r = 3 volle vier
   Minuten, und die Karte wäre entweder zu scharf oder um ein Sechstel zu
   weich gewaschen.

   Darum **gemischte** Radien: ein Teil der Durchgänge einen Schritt breiter.
   Gesucht wird das Tripel, dessen Varianzsumme der Zielvarianz am nächsten
   kommt — ein Dutzend Vergleiche, einmal je Bild. Damit sitzt σ auf jedem
   Raster auf ein Prozent. */
function kastenRadien(sig){
  const ziel = sig*sig;
  let best = null;
  for (let r=1; r<=96; r++) for (let m=0; m<=3; m++){
    const v = (m*(r*r+r) + (3-m)*((r+1)*(r+1)+(r+1))) / 3;
    const d = Math.abs(v - ziel);
    if (!best || d < best.d) best = {d, radien: [0,1,2].map(i => i < m ? r : r+1)};
  }
  return best.radien;
}
function verwischen(a, hilf, w, h, rr){
  kastenX(a, hilf, w, h, rr[0]); kastenX(hilf, a, w, h, rr[1]);
  kastenX(a, hilf, w, h, rr[2]);
  umlegen(hilf, a, w, h);                     /* a ist jetzt h × w */
  kastenX(a, hilf, h, w, rr[0]); kastenX(hilf, a, h, w, rr[1]);
  kastenX(a, hilf, h, w, rr[2]);
  umlegen(hilf, a, h, w);                     /* und wieder w × h */
}

/* Das Höhenfeld: ein mit einer Glocke gewichteter Mittelwert der
   Bahnhofshöhen, σ = FELDSIG Minuten.

   Gerechnet wurde das lange Glocke für Glocke — jeder Bahnhof legte seine
   Kurve ins Raster. Das kostet n mal Glockenfläche Schritte mit je einem
   exp() darin, und die Glockenfläche wächst mit dem Quadrat der Feinheit:
   bei 3 Minuten je Zelle waren es zweieinhalb Millionen exp(), bei 1,5 schon
   zehn Millionen, und ein Bild dauerte 650 ms. Damit war das Raster nicht
   feiner zu machen, und genau das sollte es werden.

   Jetzt kommt jeder Bahnhof als **Impuls** ins Raster — bilinear auf vier
   Zellen verteilt, damit seine Lage im Bruchteil einer Zelle nicht verloren
   geht —, und dann werden Zähler und Nenner **getrennt verwischt**. Der
   Quotient ist derselbe gewichtete Mittelwert wie vorher, nur kostet er
   O(Zellen) statt O(n · r²): das Raster darf jetzt dreimal feiner sein und
   ist dabei schneller als vorher das grobe. */
const FELDSIG = 11.0, LOCHRUNDEN = 8, FELDGROB = 3.6;
let fT = null, fL = null, gH = null, gD = null, gT = null;
let sH = null, sD = null, sT = null;

/* Ein Gitter mit Impulsen bestreuen und Zähler und Nenner verwischen — der
   Kern aus 4.3, hier einmal geschrieben und von Grund- und Rechengitter
   gemeinsam benutzt. `ziel` nimmt das Höhenfeld auf, `dich` den Nenner. */
function feldAuf(ziel, dich, hilf, w, h, zelle, ax, ayOben, werte, sig, px, py){
  ziel.fill(0); dich.fill(0);
  const ox = px || wx, oy = py || wy;
  const inv = 1/zelle;
  for (let i=0;i<n;i++){
    const v = werte(i);
    if (v !== v) continue;                    /* unerreichbar: kein Impuls */
    const cx = (ox[i] - ax) * inv - 0.5, cy = (ayOben - oy[i]) * inv - 0.5;
    const ix = Math.floor(cx), iy = Math.floor(cy);
    const gx = cx - ix, gy = cy - iy;
    for (let dy=0;dy<2;dy++){
      const jy = iy+dy;
      if (jy<0 || jy>=h) continue;
      const wv = dy ? gy : 1-gy, row = jy*w;
      for (let dx=0;dx<2;dx++){
        const jx = ix+dx;
        if (jx<0 || jx>=w) continue;
        const g = wv * (dx ? gx : 1-gx);
        dich[row+jx] += g; ziel[row+jx] += g*v;
      }
    }
  }
  /* σ soll am Ende FELDSIG Minuten sein — und am Ende heißt: nach dem
     Verwischen **und** nach dem Hochsetzen **und** nach der Nachglättung.
     Die beiden letzten verwischen mit, also wird ihre Varianz vom Ziel
     abgezogen, statt sie oben draufzulegen. */
  const ss = sig || FELDSIG;
  const dazu = zelle*zelle * 1.0;
  const rr = kastenRadien(Math.sqrt(Math.max(1, ss*ss - dazu)) / zelle);
  verwischen(dich, hilf, w, h, rr);
  verwischen(ziel, hilf, w, h, rr);
  let summe = 0, gedeckt = 0;
  const anz = w*h;
  for (let k=0;k<anz;k++){
    if (dich[k] > 1e-12){ const q = ziel[k]/dich[k]; ziel[k] = q; summe += q; gedeckt++; }
    else ziel[k] = NaN;
  }
  /* Löcher: Zellen, die keine Glocke mehr erreicht. Sie liegen immer
     **außerhalb** des Landes — ein Bahnhof ist selbst ein Impuls und hat
     damit Abdeckung —, und das Land wird ohnehin beschnitten. Gebraucht wird
     ihr Wert nur für den Saum, über den beim Hochskalieren interpoliert wird,
     und dafür genügen ein paar Runden.

     Vierzig Runden über das ganze Raster, jede mit einer Kopie des Feldes,
     waren einmal der teuerste Posten der ganzen Rechnung — und zwar genau bei
     der Landkarte, wo die halbe Bildfläche leer ist und nie ein Loch zuging.
     Eine Liste der Löcher war der nächste Fehler: ein JavaScript-Array
     verpackt jede Zahl einzeln, und das allein kostete mehr als das ganze
     Verwischen. Jetzt ist die Liste ein Int32Array, wird einmal angelegt und
     in jeder Runde an derselben Stelle zusammengeschoben. */
  if (!fL || fL.length < anz) fL = new Int32Array(anz);
  let nl = 0;
  for (let k=0;k<anz;k++) if (Number.isNaN(ziel[k])) fL[nl++] = k;
  for (let runde=0; runde<LOCHRUNDEN && nl; runde++){
    let m = 0;
    for (let q=0;q<nl;q++){
      const k = fL[q];
      const ix = k % w, iy = (k - ix) / w;
      let sm=0,c=0;
      for (let dy=-1;dy<=1;dy++){
        const jy = iy+dy;
        if (jy<0 || jy>=h) continue;
        const row = jy*w;
        for (let dx=-1;dx<=1;dx++){
          const jx = ix+dx;
          if (jx<0 || jx>=w) continue;
          const v = ziel[row+jx];
          if (!Number.isNaN(v)){ sm+=v; c++; }
        }
      }
      if (c) ziel[k] = sm/c; else fL[m++] = k;
    }
    nl = m;
  }
  /* Was dann noch offen ist, liegt weit draußen im Schwarzen und wird nie
     gezeigt. Eine Zahl braucht es trotzdem, weil NaN sich durch die Glättung
     frisst; das Mittel der gedeckten Zellen ist oben schon mitgezählt. */
  if (nl){
    const ersatz = gedeckt ? summe/gedeckt : 0;
    for (let q=0;q<nl;q++) ziel[fL[q]] = ersatz;
  }
}

/* Bilinear von einem Gitter aufs Bildgitter setzen. */
function hochsetzen(q, qw, qh, qzelle, qx, qyOben){
  const inv = 1/qzelle;
  const B = ZELLE * inv;
  const A = (X0 + 0.5*ZELLE - qx) * inv - 0.5;
  const C = (qyOben - (Y0 + FH*ZELLE) + 0.5*ZELLE) * inv - 0.5;
  for (let iy=0; iy<FH; iy++){
    const cy = C + iy*B;
    let jy = Math.floor(cy);
    const gy = cy - jy;
    if (jy < 0) jy = 0; else if (jy > qh-2) jy = qh-2;
    const r0 = jy*qw, r1 = r0 + qw, w0 = 1-gy, ziel = iy*FW;
    for (let ix=0; ix<FW; ix++){
      const cx = A + ix*B;
      let jx = Math.floor(cx);
      const gx = cx - jx;
      if (jx < 0) jx = 0; else if (jx > qw-2) jx = qw-2;
      const u = q[r0+jx], v = q[r0+jx+1], c = q[r1+jx], e = q[r1+jx+1];
      fH[ziel+ix] = (u + (v-u)*gx) * w0 + (c + (e-c)*gx) * gy;
    }
  }
}

function feldBauen(){
  /* Das Grundgitter hängt nur an Lage und Anteil, nicht an der Ansicht: beim
     Zoomen und Schieben wird es darum nicht neu gerechnet, und genau deshalb
     ist Zoomen billig. */
  const sanz = SW*SH;
  if (!sH || sH.length !== sanz){
    sH = new Float32Array(sanz); sD = new Float32Array(sanz);
    sT = new Float32Array(sanz); statGerechnet = -1;
  }
  if (statGerechnet !== statStand){
    feldAuf(sH, sD, sT, SW, SH, SZELLE, SX0, SY0 + SH*SZELLE, i => hh[i]);
    glaetten(sH, SW, SH, sT);
    statGerechnet = statStand;
  }

  const anz = FW*FH;
  if (!fH || fH.length !== anz){ fH = new Float32Array(anz); fT = new Float32Array(anz); }
  if (GW){
    const ganz = GW*GH;
    if (!gH || gH.length !== ganz){
      gH = new Float32Array(ganz); gD = new Float32Array(ganz); gT = new Float32Array(ganz);
    }
    feldAuf(gH, gD, gT, GW, GH, GZELLE, GX0, GY0 + GH*GZELLE, i => hh[i]);
    hochsetzen(gH, GW, GH, GZELLE, GX0, GY0 + GH*GZELLE);
  } else {
    hochsetzen(sH, SW, SH, SZELLE, SX0, SY0 + SH*SZELLE);
  }
  /* Nachwischen. Eine bilineare Vergrößerung hat knickige Ableitungen, und
     die Ableitung ist hier das Licht — ohne diesen Durchgang bekäme der Hang
     kleine Facetten auf den Zellgrenzen des Gitters, von dem hochgesetzt
     wurde. */
  glaetten(fH, FW, FH, fT);
  glaetten(fH, FW, FH, fT);
}

function glaetten(a, w, h, hilf){
  const t = hilf || ((fT && fT.length === a.length) ? fT : new Float32Array(a.length));
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const l = x>0?a[y*w+x-1]:a[y*w+x], r = x<w-1?a[y*w+x+1]:a[y*w+x];
    t[y*w+x] = (l + 2*a[y*w+x] + r) * .25;
  }
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const u = y>0?t[(y-1)*w+x]:t[y*w+x], d = y<h-1?t[(y+1)*w+x]:t[y*w+x];
    a[y*w+x] = (u + 2*t[y*w+x] + d) * .25;
  }
}

/* --------------------------------------------------------------- Das Bild */
let bildC = null, bildX = null, bild = null;
let sZx = null, sZy = null;

/* ------------------------------------------------- Das Ende der Farbleiter
   Die Farbleiter läuft vom Wasserstand bis zum 99,5-Perzentil der Höhe auf
   dem Land. Es darf an genau einem Ding hängen, am Anteilsregler, der die
   Höhen selbst verschiebt — und an nichts sonst: nicht am Zoom, nicht am
   Verziehen. Sonst bekommt dieselbe Höhe je nach Ansicht eine andere Farbe,
   und die Legende wäre keine.

   Gerechnet wird es darum auf einem eigenen, kleinen Gitter über der
   **Geografie**: die Bahnhöfe an ihren geografischen Orten, das Land aus dem
   unverzogenen Umriss. Das ist auch die richtige Bezugsfläche: „das
   Perzentil über dem Land“ meint Deutschland und nicht die verzogene
   Zeitkarte. Das Gitter selbst und die Maske stehen damit ein für alle Mal
   fest; neu gerechnet wird nur das Feld, und nur wenn sich der Anteil
   ändert. */
const LZELLE = 4.0;
let lH = null, lD = null, lT = null, lM = null;
let LW = 0, LH = 0, LX0 = 0, LY0 = 0, lStand = -1, lRoh = 1;
function leiterMaske(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for (let i=0;i<n;i++){
    if(gxx[i]<x0)x0=gxx[i]; if(gxx[i]>x1)x1=gxx[i];
    if(gyy[i]<y0)y0=gyy[i]; if(gyy[i]>y1)y1=gyy[i];
  }
  const rand = 3*FELDSIG;
  LX0 = x0 - rand; LY0 = y0 - rand;
  LW = Math.ceil((x1-x0 + 2*rand) / LZELLE);
  LH = Math.ceil((y1-y0 + 2*rand) / LZELLE);
  const anz = LW*LH;
  lH = new Float32Array(anz); lD = new Float32Array(anz);
  lT = new Float32Array(anz); lM = new Uint8Array(anz);
  /* Die Landmaske aus dem **unverzogenen** Umriss — dieselben Dreiecke wie
     in 4.6, nur ohne Verziehen. */
  const c = document.createElement('canvas');
  c.width = LW; c.height = LH;
  const mk = c.getContext('2d', {willReadFrequently:true});
  mk.fillStyle = '#fff'; mk.beginPath();
  const alle = [...umriss, ...laender];
  const lx = x => (x - LX0)/LZELLE, ly = y => (LY0 + LH*LZELLE - y)/LZELLE;
  for (let ri=0; ri<alle.length; ri++){
    const r = alle[ri], tri = dreiecke[ri];
    for (let q=0;q<tri.length;q+=3){
      const a=tri[q], b=tri[q+1], cc=tri[q+2];
      let ax=lx(r[2*a]), ay=ly(r[2*a+1]);
      let bx=lx(r[2*b]), by=ly(r[2*b+1]);
      let cx=lx(r[2*cc]), cy=ly(r[2*cc+1]);
      if ((bx-ax)*(cy-ay) - (by-ay)*(cx-ax) < 0){
        const tx=bx, ty=by; bx=cx; by=cy; cx=tx; cy=ty;
      }
      mk.moveTo(ax,ay); mk.lineTo(bx,by); mk.lineTo(cx,cy); mk.closePath();
    }
  }
  mk.fill();
  const d = mk.getImageData(0,0,LW,LH).data;
  for (let k=0;k<anz;k++) lM[k] = d[(k<<2)+3];
}
function leiterBauen(){
  if (!lM) leiterMaske();
  /* Das Feld über der Geografie: dieselbe Rechnung wie in 4.3, nur mit den
     geografischen Orten statt den gezeichneten. */
  feldAuf(lH, lD, lT, LW, LH, LZELLE, LX0, LY0 + LH*LZELLE, i => hh[i],
          FELDSIG, gxx, gyy);
  lRoh = 1;
  const anz = LW*LH;
  for (let k=0;k<anz;k++) if (lM[k] > 120 && lH[k] > lRoh) lRoh = lH[k];
}
function leiterFrisch(){
  if (lStand !== statAnteil){ leiterBauen(); lStand = statAnteil; }
}
function leiterEnde(see){
  leiterFrisch();
  const N = 512, hist = new Int32Array(N + 1), anz = LW*LH;
  const roh = Math.max(see + 1, lRoh), inv = N / roh;
  let zahl = 0;
  for (let k=0;k<anz;k++){
    if (lM[k] <= 120) continue;
    let b = (lH[k] * inv + 0.5) | 0;
    hist[b < 0 ? 0 : b > N ? N : b]++;
    zahl++;
  }
  let bis = Math.floor(zahl * 0.995), s2 = 0, b2 = N;
  for (let i=0;i<=N;i++){ s2 += hist[i]; if (s2 >= bis){ b2 = i; break; } }
  return Math.max(see + 1, b2 / N * roh);
}
const R8=[], G8=[], B8=[];
for (const s of RAMPE){
  R8.push(parseInt(s.slice(1,3),16));
  G8.push(parseInt(s.slice(3,5),16));
  B8.push(parseInt(s.slice(5,7),16));
}
let landMax = 1, schneeLinie = 0;

function bildBauen(){
  if (!bildC || bildC.width !== FW || bildC.height !== FH){
    bildC = document.createElement('canvas'); bildC.width = FW; bildC.height = FH;
    bildX = bildC.getContext('2d', {willReadFrequently:true});
    bild = bildX.createImageData(FW, FH);
  }
  const d = bild.data;
  const see = Z.wasser;
  landMax = see + 1;
  /* Das 99,5-Perzentil der Höhe **auf Land** — und zwar aus dem
     Leitergitter (leiterEnde), das über der **Geografie** liegt und darum
     weder am Zoom noch am Verziehen hängt.

     Das war zweimal falsch, und beide Male aus demselben Grund. Die Höhe
     eines Bahnhofs ist eine Eigenschaft des Ortes: wie lange es von dort
     dauert, bis ein Anteil des Landes in Reichweite ist. Sie ändert sich
     nicht, wenn man die Karte verzieht — nachgemessen um genau null Minuten.
     Das obere Ende der Farbleiter kam aber aus dem *gezeichneten* Feld, und
     das hängt an der Lage: es stand bei 337 Minuten in der Landkarte und bei
     349 in der Zeitkarte, die Schneegrenze bei 520 gegen 530. Ein Farbband
     ist elf Minuten breit, also verschob das Verziehen die ganze Leiter um
     ein Band — jede Höhe bekam mitten in der Bewegung eine andere Farbe, und
     das war eine Aussage über den Regler und nicht über das Land.

     Was danach übrig bleibt, ist kein Fehler, sondern die Rechnung selbst:
     das Relief ist die geglättete Fläche **zwischen** den Bahnhöfen (4.3),
     und wer neben einem Bahnhof liegt, ist in der Zeitkarte ein anderer als
     in der Landkarte. Der Wert am Bahnhof wandert dadurch im Median um acht
     Minuten, also um zwei Drittel Farbband. Das ließe sich wegrechnen, indem
     jeder Ort seine geglättete Höhe mit sich trägt statt sie aus den
     gezeichneten Nachbarn zu ziehen — nachgemessen blieben dann noch vier
     Minuten. Nur wird die Zeitkarte davon welliger: die geografische
     Nachbarschaft ist dort die falsche, und sie steht dann als Kräuselung im
     sonst glatten Trichter. Der glatte Trichter ist das Bild; die acht
     Minuten bleiben. */
  landMax = leiterEnde(see);
  const bandL = (landMax - see) / (NL + NS);
  const bandW = Math.max(1, see) / NW;
  schneeLinie = see + bandL * NL;
  /* Licht aus Nordwesten, 45 Grad über dem Horizont. Der Gradient wird im
     Feldgitter genommen und mit einem festen Faktor überhöht — ohne ihn wäre
     ein Gelände, dessen Spanne ein Zehntel seiner Breite ist, glatt wie
     Glas. Das Licht geht in die Farbe hinein und liegt nicht als graue
     Ebene darüber: soft-light enthält den Faktor C·(1−C) und kann Weiß nicht
     dunkler machen, käme also genau auf den Gipfeln nicht an. */
  const vz = 2.7;
  const lx = -0.5774, ly = -0.5774, lz = 0.5774;
  const linien = Z.linien;
  /* Gerechnet wird nur, was auch gezeichnet wird. Das Bild deckt den ganzen
     Rahmen ab, gezeigt wird davon aber nur das Land (der Beschnitt in 4.5),
     und das ist bei der Landkarte nicht einmal die Hälfte. Eine Zelle
     Nachsicht in alle vier Richtungen, weil beim Hochskalieren über die
     Schnittkante interpoliert wird und dafür der Nachbar außerhalb mitgelesen
     werden muss. Übersprungene Zellen behalten, was im Puffer stand; sie
     liegen außerhalb des Beschnitts und sind nie zu sehen. */
  /* Für den Abkürzungstest wird jede Bildzelle auf ihre Grundzelle
     abgebildet. Die Zuordnung ist je Zeile und je Spalte dieselbe, also wird
     sie einmal in zwei kleine Tabellen geschrieben statt je Zelle gerechnet.
     Eine Grundzelle ist drei Minuten groß und damit von sich aus der Saum,
     den das Hochskalieren braucht. */
  if (!sZx || sZx.length !== FW) sZx = new Int32Array(FW);
  if (!sZy || sZy.length !== FH) sZy = new Int32Array(FH);
  for (let ix=0; ix<FW; ix++){
    const c = Math.round(grundX(X0 + (ix+0.5)*ZELLE));
    sZx[ix] = c < 0 ? 0 : c > SW-1 ? SW-1 : c;
  }
  for (let iy=0; iy<FH; iy++){
    const c = Math.round(grundY(Y0 + FH*ZELLE - (iy+0.5)*ZELLE));
    sZy[iy] = (c < 0 ? 0 : c > SH-1 ? SH-1 : c) * SW;
  }
  for (let iy=0; iy<FH; iy++){
    const oben = Math.max(0,iy-1)*FW, unten = Math.min(FH-1,iy+1)*FW, hier = iy*FW;
    const srow = sZy[iy];
    for (let ix=0; ix<FW; ix++){
      const k = hier+ix, j = k<<2;
      if (!maskeA[srow + sZx[ix]]) continue;
      const h = fH[k];
      const hx = (fH[hier + Math.min(FW-1,ix+1)] - fH[hier + Math.max(0,ix-1)]) * vz / (2*ZELLE);
      const hy = (fH[unten + ix] - fH[oben + ix]) * vz / (2*ZELLE);
      let nx = -hx, ny = hy;
      const nl = Math.sqrt(nx*nx + ny*ny + 1);
      let licht = (nx*lx + ny*ly + lz) / nl;
      licht = (licht - 0.577) * 1.45;
      const unterWasser = h < see;
      let bi, stufe, band;
      if (unterWasser){
        band = bandW; stufe = h / bandW;
        bi = Math.min(NW-1, Math.max(0, Math.floor(stufe)));
        licht *= 0.30;
      } else {
        band = bandL; stufe = (h - see) / bandL;
        bi = NW + Math.min(NL+NS-1, Math.max(0, Math.floor(stufe)));
      }
      let r = R8[bi], g = G8[bi], b = B8[bi];
      if (licht > 0){ r += (255-r)*licht*.52; g += (255-g)*licht*.52; b += (255-b)*licht*.52; }
      else { const f = Math.max(.47, 1 + licht*.42); r*=f; g*=f; b*=f; }
      /* Die Höhenlinie liegt auf der Bandgrenze. Gemessen wird der Abstand
         dorthin **in Zellen**, also durch den Betrag des Gradienten geteilt:
         damit ist die Linie im Steilen so dünn wie im Flachen. */
      if (linien){
        const fr = stufe - Math.floor(stufe);
        const grad = Math.sqrt(hx*hx + hy*hy) / vz / band * ZELLE;
        const ab = Math.min(fr, 1-fr) / Math.max(grad, 1e-4);
        if (ab < 0.85){
          const s = 1 - 0.34*(1 - ab/0.85);
          r*=s; g*=s; b*=s;
        }
      }
      d[j] = r<0?0:r>255?255:r; d[j+1] = g<0?0:g>255?255:g;
      /* Deckend. Die Küste schneidet der Pfad (landPfad); stünde die Maske
         hier im Alphakanal, würde sie beim Hochskalieren mitinterpoliert und
         genau die weiche Kante erzeugen, die weg soll. Außerhalb des Landes
         steht trotzdem eine sinnvolle Farbe — das Höhenfeld ist überall
         gefüllt —, und darum blutet an der Schnittkante kein Schwarz ein. */
      d[j+2] = b<0?0:b>255?255:b; d[j+3] = 255;
    }
  }
  bildX.putImageData(bild, 0, 0);
}

/* ------------------------------------------------------------- Zeichnen */
function zeichne(){
  const angefangen = performance.now();
  /* Der Maßstab zuerst: das Raster hängt an ihm (feldMasseSetzen). */
  const [x0,x1,y0,y1] = RAHMEN;
  skalaBasis = Math.min(W / (x1-x0), H / (y1-y0)) * 0.985;
  /* Wie weit darf man heraus? So weit, dass der ganze Umfang ins Bild passt,
     und ein Stück darüber hinaus, damit die äußersten Enden nicht am Rand
     kleben. */
  const [wx0,wx1,wy0,wy1] = WELT;
  ZOOMMIN = Math.min(1, Math.min(W/(wx1-wx0), H/(wy1-wy0)) * 0.985
                        / skalaBasis * 0.92);
  V.zoom = Math.max(ZOOMMIN, Math.min(ZOOMMAX, V.zoom));
  skala = skalaBasis * V.zoom;
  ansichtKlemmen();
  zx = V.cx; zy = V.cy;
  mitteX = W/2; mitteY = H/2;

  lage();
  /* Die Kamera am gewählten Bahnhof. Geklemmt wird auf den **Umfang** und
     nicht wie sonst auf „Bild ganz im Umfang": der Bahnhof soll genau in der
     Mitte stehen, auch wenn dafür schwarzer Grund an den Rand kommt — sonst
     zieht die Klemmung ihn bei der Anfangsstellung sofort wieder in die
     Bildmitte des Landes, und dann bewegt sich die Kamera gar nicht. Fährt er
     über den Umfang hinaus, bleibt sie an seiner Kante stehen, statt ins
     Schwarze zu laufen. */
  if (folgt && Z.wahl >= 0){
    const [fx0,fx1,fy0,fy1] = WELT;
    V.cx = Math.max(fx0, Math.min(fx1, wx[Z.wahl]));
    V.cy = Math.max(fy0, Math.min(fy1, wy[Z.wahl]));
    zx = V.cx; zy = V.cy;
  }
  umrissVerziehen();
  feldMasseSetzen();
  feldBauen();
  /* Die Rastermaske wird nur noch als Statistik gebraucht — für das
     Perzentil der Farbleiter und für die Liste der Ausgewanderten; gezeichnet
     wird die Küste als Pfad (4.5). Sie liegt auf dem Grundgitter und hängt
     damit nicht an der Ansicht: beim Zoomen und Schieben bleibt sie stehen.
     In der Fahrt reicht jedes zweite Bild — ein Bahnhof, der gerade die
     Küste überquert, bekommt seine Scholle einen Wimpernschlag zu früh oder
     zu spät. Das kostet dreißig Millisekunden je Bild, und die fehlen der
     Schärfe. */
  if (!maskeA || maskeA.length !== SW*SH || maskeStand !== statStand
      || !(spiel && !spiel.halt) || (maskeTakt++ & 1) === 0){
    maskeBauen(); maskeStand = statStand;
  }
  bildBauen();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled = true;
  ctx.save();
  /* erst der Umfang — das Feld reicht darüber hinaus, und das soll nicht in
     den schwarzen Rand lappen —, dann das Land selbst */
  ctx.beginPath();
  ctx.rect(schirmX(wx0), schirmY(wy1), (wx1-wx0)*skala, (wy1-wy0)*skala);
  ctx.clip();
  landPfad();
  ctx.clip();
  ctx.drawImage(bildC, schirmX(X0), schirmY(Y0 + FH*ZELLE),
                FW*ZELLE*skala, FH*ZELLE*skala);
  ctx.restore();
  grenzenMalen();
  if (kanten && (Z.haupt || Z.neben)) netzMalen();
  if (Z.iso && ISO && Z.isoKnoten >= 0) isoMalen();
  if (Z.punkte) punkteMalen();
  if (Z.namen) ortePunkteMalen(W < 520 ? 24 : W < 820 ? 42 : 62);
  if (Z.namen) namenMalen(); else namensFelder = [];
  /* Der Ring hängt nicht an der Beschriftung: er soll auch stehen, wenn die
     Namen ausgeschaltet sind oder für diesen einen kein Platz war. */
  if (Z.wahl >= 0 && imRahmen(wx[Z.wahl], wy[Z.wahl]))
    wahlRing(schirmX(wx[Z.wahl]), schirmY(wy[Z.wahl]));
  tafelSetzen();

  /* Der Regelkreis für die Fahrt: nachsehen, wie lange dieses Bild
     gebraucht hat, und die Rasterstufe entsprechend nachziehen. Gemessen
     wird nur in der Bewegung — im Halt und in Ruhe soll ohnehin die feinste
     Stufe stehen. */
  if (spiel && !spiel.halt){
    const ms = performance.now() - angefangen;
    if (ms > SPIELBUDGET) spielFein = Math.min(FEIN_GROB, spielFein * 1.18);
    else if (ms < SPIELBUDGET * 0.6) spielFein = Math.max(FEIN_RUHE, spielFein / 1.10);
  }
}

function grenzenMalen(){
  const f = 1 - 0.62 * Z.morph;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const r of laenderW) pfad(r);
  ctx.strokeStyle = 'rgba(255,255,255,' + (.11*f).toFixed(3) + ')';
  ctx.lineWidth = .8; ctx.stroke();
  ctx.beginPath();
  for (const r of umrissW) pfad(r);
  ctx.strokeStyle = 'rgba(255,255,255,' + (.34*f).toFixed(3) + ')';
  ctx.lineWidth = 1.1; ctx.stroke();
}
function pfad(r){
  ctx.moveTo(schirmX(r[0]), schirmY(r[1]));
  for (let i=2;i<r.length;i+=2) ctx.lineTo(schirmX(r[i]), schirmY(r[i+1]));
}

/* ---------- Das Netz, das die Karte erklärt.

   Bis hierher zeigt die Karte Orte und Höhen, aber nicht das, was beides
   macht. Was der Fahrplan an Netz hergibt, ist genau eine Sorte Kante: **zwei
   Bahnhöfe, zwischen denen ein Zug ohne Zwischenhalt fährt.** Das ist ein
   Verbindungsgraph und **keine Gleiskarte** — die Gerade Berlin–Frankfurt ist
   der Sprung eines ICE, nicht der Verlauf der Strecke, und die Gleise liegen
   in diesen Daten nirgends.

   Darum ist die Trennung nach Produktklasse hier die ehrliche und nicht
   irgendein Schwellenwert: im Fernverkehr *sind* die Kanten Sprünge (Median
   31 km, bis 415 km), im Regionalverkehr folgen sie der Strecke (Median
   4,5 km, 99 Prozent unter 29 km, ganze drei über 60 km). Die Hauptachsen
   sind also als Geraden richtig gelesen, das Nebennetz zeichnet nebenbei
   wirklich das Streckennetz nach.

   Und beide werden mitverzogen. In der Zeitkarte ist die Länge eines Strichs
   keine Entfernung mehr, sondern eine Dauer: die Achse Berlin–Hannover
   schrumpft, die Nebenbahn dahinter bleibt lang. Das ist der Grund, sie
   überhaupt einzublenden — man sieht, welche Linien das Land zusammenziehen.

   Gezeichnet wird wie die Isochronen: dunkle Unterlage, helle Mitte, beide
   in CSS-Pixeln, also zoomunabhängig. Die Hauptachsen kommen zuletzt und in
   Bernstein, damit sie nicht mit den weißen Höhenlinien, Grenzen und
   Isochronen verwechselt werden. */
function netzMalen(){
  const alle = kanten.length / 2;
  const zug = (von, bis, farbe, breite) => {
    ctx.beginPath();
    for (let k = von; k < bis; k++){
      const a = kanten[2*k], b = kanten[2*k+1];
      ctx.moveTo(schirmX(wx[a]), schirmY(wy[a]));
      ctx.lineTo(schirmX(wx[b]), schirmY(wy[b]));
    }
    ctx.strokeStyle = farbe; ctx.lineWidth = breite; ctx.stroke();
  };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (Z.neben){
    zug(kantenHaupt, alle, 'rgba(0,0,0,.34)', 1.9);
    zug(kantenHaupt, alle, 'rgba(255,255,255,.42)', .7);
  }
  if (Z.haupt){
    zug(0, kantenHaupt, 'rgba(0,0,0,.52)', 3.6);
    zug(0, kantenHaupt, 'rgba(255,214,122,.92)', 1.6);
  }
}

/* Gezeichnet wird, wo es Karte gibt — und das ist WELT, der ganze Umfang, und
   nicht der Rahmen. Der Rahmen sagt nur, wohin die Ansicht beim Aufschlagen
   zeigt; wer herauszoomt, bekommt die hinausgefahrenen Enden samt Namen und
   Scholle zu sehen. Jenseits von WELT ist dagegen nichts: dort stünde ein
   roter Punkt mit Namen allein im Schwarzen, und das sieht nicht nach „aus
   der Karte gefallen" aus, sondern nach einem Fehler. */
const imRahmen = (x, y) =>
  x >= WELT[0] && x <= WELT[1] && y >= WELT[2] && y <= WELT[3];

/* Die Bahnhöfe sind von Anfang an eingeblendet: sie sind das, woraus die
   Karte gemacht ist, und ohne sie sieht ein Relief aus wie eine Behauptung.
   Beim Hineinzoomen werden die Punkte etwas größer — nicht linear, sondern
   mit der Wurzel, weil sie sonst schon bei Zoom 4 wie Murmeln lägen.

   **Rot heißt: hier steht ein Name.** Das ist der Kern der Sache — der rote
   Punkt ist der Anker der Beschriftung, und er gehört zu ihr. Weiß sind die
   übrigen viertausendsiebenhundert, aus denen das Relief gemacht ist.

   Eine Fassung lang war Rot der **Ortsmarken** vorbehalten, weil das eine
   feste Liste ist und sich beim Verziehen nichts umfärbt. Das war zu
   vorsichtig: welche Bahnhöfe rot sind, *soll* sich mit dem Zoom ändern, denn
   beim Hineinzoomen kommen neue Namen dazu, und ohne Anker schwebt ein Name
   im Gelände. Der Preis ist, dass mitten in der Bewegung ein paar Punkte
   kommen und gehen, weil dann andere Namen Platz finden — nachgezählt 86 in
   der Landkarte gegen 79 in der Zeitkarte, also eine Handvoll von achtzig.
   Dafür sagt die Farbe wieder etwas Lesbares: rot ist, was benannt ist.

   Die Ortsmarken bleiben zusätzlich rot, auch wenn ihr Name keinen Platz
   fand — sonst verschwände beim Hineinzoomen die Mitte einer Stadt ganz. */
const ORTROT = '#e8291c';
/* Ein roter Punkt mit dunklem Saum: derselbe für die Ortsmarke und für den
   beschrifteten Bahnhof, damit die Karte eine Sorte roter Punkte hat. */
function rotPunkt(X, Y, r){
  ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.2832);
  ctx.fillStyle = ORTROT; ctx.fill();
  ctx.lineWidth = .7; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
}
/* So groß wie früher der Ankerpunkt (Radius 1,7 bei der Anfangsstellung) und
   beim Hineinzoomen ein wenig mitwachsend, wie die weißen Punkte auch. */
const rotR = () => Math.min(2.0, 1.55 * Math.sqrt(Math.min(2, V.zoom)));
/* Der gewählte Bahnhof bekommt einen Ring statt einer weiteren Farbe: eine
   vierte Farbe wäre eine vierte Behauptung, ein Ring ist eine Markierung. */
function wahlRing(X, Y){
  const r = rotR() + 3.4;
  ctx.beginPath(); ctx.arc(X, Y, r, 0, 6.2832);
  ctx.lineWidth = 2.6; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.stroke();
  ctx.lineWidth = 1.3; ctx.strokeStyle = '#fff'; ctx.stroke();
}
function punkteMalen(){
  const r = Math.min(2.2, 1.3 * Math.sqrt(V.zoom));
  ctx.fillStyle = 'rgba(255,255,255,' + (V.zoom > 1.6 ? .62 : .45) + ')';
  for (let i=0;i<n;i++) if (imRahmen(wx[i], wy[i]))
    ctx.fillRect(schirmX(wx[i])-r/2, schirmY(wy[i])-r/2, r, r);
}
/* Die Ortsmarken, unabhängig davon, ob ihr Name untergebracht werden konnte. */
function ortePunkteMalen(anzahl){
  const rr = rotR();
  for (const [i] of P.marken.slice(0, anzahl)){
    if (!imRahmen(wx[i], wy[i])) continue;
    const X = schirmX(wx[i]), Y = schirmY(wy[i]);
    if (X < -8 || X > W+8 || Y < -8 || Y > H+8) continue;
    rotPunkt(X, Y, rr);
  }
}

/* Beschriftet werden Orte, nicht Bahnhofsnamen, und zwar so viele, wie ohne
   Überdeckung hineinpassen: jeder versucht acht Plätze um seinen Punkt, wer
   keinen findet, wird nicht gezeichnet. Zwei Namen übereinander sind
   schlechter als ein Name weniger. */
const FERNVORRAT = 22;
let abgelegen = null, rangliste = null;
/* Wo welcher Name steht — gefüllt beim Zeichnen, gelesen beim Klicken.
   Ein Name ist die größere Fläche und das, worauf man zeigt: ein Punkt von
   drei Pixeln ist ein Ziel für die Maus, aber keines für einen Finger. */
let namensFelder = [];
/* Die Schrift war 11,5 Pixel groß und damit für eine Karte zu laut: sie hat
   die Karte gelesen statt sie zu beschriften. Jetzt sind es 8 — dreißig
   Prozent kleiner, das schonende Ende der gewünschten Spanne, weil eine
   Beschriftung, die man nicht mehr liest, keine ist. Was sie an Größe
   verliert, bekommt sie an Kontrast zurück: der schwarze Saum bleibt
   anteilig dicker als vorher. Alle Abstände hängen an SCHRIFT, damit ein
   anderer Wert nicht die Halterei durcheinanderbringt. */
const SCHRIFT = 8, SCHRIFT_ENG = 9, SAUMSTRICH = 2.2;

function namenMalen(){
  /* Auf dem Telefon einen Punkt größer: dort stehen ohnehin nur zwei Dutzend
     Namen, Platz ist also da, und acht Pixel auf einem kleinen Schirm sind
     die Grenze des Lesbaren. */
  const sr = W < 520 ? SCHRIFT_ENG : SCHRIFT;
  const NAHX = Math.round(sr * 0.55);           /* seitlicher Abstand zum Punkt */
  const NAHY = Math.round(sr * 1.1);            /* Zeilensprung nach oben/unten */
  const KASTH = Math.round(sr * 1.3);           /* Höhe des Belegtkastens */
  const belegt = [];
  namensFelder = [];
  const frei = (x,y,w,h2) => {
    if (x < 5 || x+w > W-5 || y < 5 || y+h2 > H-5) return false;
    for (const b of belegt)
      if (x < b[2] && b[0] < x+w && y < b[3] && b[1] < y+h2) return false;
    return true;
  };
  ctx.font = '600 ' + sr + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.textBaseline = 'middle';
  const wieviele = W < 520 ? 24 : W < 820 ? 42 : 62;
  /* Und dann die abgelegensten Orte, dazu die abgelegensten *Bahnhöfe* mit
     ihrem eigenen Namen. In der Zeitkarte lösen sich deren Inseln vom Land,
     und eine weiße Scholle ohne Namen ist ein Fleck: die Bäderbahn auf
     Rügen, die Stichbahnen um Konstanz und Freiburg, die Fichtelbergbahn,
     die Heidekrautbahn. Ortsmarken helfen da nicht, denn Konstanz Hbf liegt
     gut angebunden am Land und Konstanz-Wollmatingen draußen im Meer. */
  const fern = W < 520 ? 4 : W < 820 ? 8 : 12;
  if (!abgelegen){
    abgelegen = P.marken.slice().sort((a,b) => hh[b[0]] - hh[a[0]]).slice(0, FERNVORRAT);
    const ord = Array.from({length:n}, (_,i)=>i).sort((a,b) => hh[b] - hh[a]);
    const weit = [];
    for (const i of ord){
      if (weit.length >= FERNVORRAT) break;
      if (weit.every(j => (wx[i]-wx[j])**2 + (wy[i]-wy[j])**2 > 55*55))
        weit.push(i);
    }
    abgelegen = abgelegen.concat(weit.map(i => [i, nm[i]]));
  }
  /* Aus dem Vorrat kommen mehr Kandidaten als Plätze: in der Zeitkarte sind
     die abgelegensten oft genau die, die über den Rand hinausgefahren sind,
     und ohne Nachrücker bliebe dann keine Scholle beschriftet. Gezählt wird
     darum, was **gemalt** wurde, nicht was angeboten war — sonst rücken mit
     jedem Ausfall zwei neue Namen nach und die Karte wird ein Register. */
  /* Beim Hineinzoomen kommen **neue Namen** dazu, und zwar die der kleineren
     Bahnhöfe: bei der Anfangsstellung stehen die Ortsmarken, und mit jedem

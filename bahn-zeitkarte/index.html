     Zoomschritt wird ein Budget für Bahnhofsnamen frei, das aus einer
     Rangliste nach Halten am Tag gefüllt wird. Der größte Bahnhof im Bild
     kommt also zuerst. Gebremst wird das doppelt: von diesem Budget und vom
     Kollisionstest, der ohnehin nur unterbringt, was Platz hat — beim
     Herauszoomen verschwinden die Namen damit von selbst wieder.

     Eine Rangliste und nicht die Reihenfolge der Daten, weil sonst beim
     Hineinzoomen zufällige Haltepunkte vor den Knoten stünden. */
  if (!rangliste){
    const marke = new Set(P.marken.map(m => m[0]));
    rangliste = Array.from({length:n}, (_,i)=>i)
      .filter(i => !marke.has(i))
      .sort((a,b) => halte[b] - halte[a])
      .map(i => [i, kurzname(nm[i]), 3]);
  }
  /* Angeboten wird die **ganze** Rangliste und nicht ihr Kopf: wer in den
     Harz hineinzoomt, soll dort Namen sehen und nicht die von Hannover, das
     national weiter oben steht, aber außerhalb des Bildes liegt. Teuer ist
     das nicht, weil eine Zeile, deren Budget aufgebraucht ist, nur noch
     einen Vergleich kostet. */
  /* Wie viele Bahnhofsnamen dazukommen, sagt **nicht** der Zoom, sondern der
     Platz: die Gesamtzahl der Namen im Bild soll ungefähr gleich bleiben.
     Beim Hineinzoomen fallen die Ortsmarken aus dem Bild — bei Zoom 8 sind
     von 62 noch drei übrig —, und genau diese Lücke füllen die Bahnhofsnamen
     auf. Eine Zahl, die am Zoom hing, gab bei Zoom 8 zweihundert Namen: das
     war kein Kartenbild mehr, sondern ein Register. */
  /* Der gewählte Bahnhof steht **vorn** und hat seinen eigenen Platz: wer
     ihn angeklickt hat, soll seinen Namen sehen, auch wenn er es im Budget
     der Rangliste nie so weit nach oben geschafft hätte. */
  const reihe = (Z.wahl >= 0 ? [[Z.wahl, nm[Z.wahl], 4]] : [])
    .concat(P.marken.slice(0, wieviele).map(m => [m[0], m[1], 0]),
            abgelegen.slice(0, fern + 10).map(m => [m[0], m[1], 1]),
            abgelegen.slice(FERNVORRAT, FERNVORRAT + fern + 10)
              .map(m => [m[0], m[1], 2]),
            rangliste);
  const platz = [wieviele, fern, fern, 1e9, 1];
  let gesamt = 0;
  const schon = new Set();
  for (const [i, t, g] of reihe){
    if (schon.has(i) || platz[g] <= 0) continue;
    if (g === 3 && gesamt >= wieviele) break;    /* das Bild ist voll */
    schon.add(i);
    if (!imRahmen(wx[i], wy[i])) continue;
    const X = schirmX(wx[i]), Y = schirmY(wy[i]);
    const b = ctx.measureText(t).width;
    let hin = null;
    for (const [dx,dy] of [[NAHX,0],[-NAHX-b,0],[NAHX,-NAHY],[-NAHX-b,-NAHY],
                           [NAHX,NAHY],[-NAHX-b,NAHY],
                           [-b/2,-NAHY-1],[-b/2,NAHY+1]]){
      const x = X+dx, y = Y+dy-KASTH/2;
      if (frei(x-2, y-1, b+4, KASTH)){
        hin = [x, y + KASTH/2]; belegt.push([x-2,y-1,x+b+2,y+KASTH-1]); break;
      }
    }
    if (!hin) continue;
    ctx.lineWidth = SAUMSTRICH; ctx.strokeStyle = 'rgba(0,0,0,.68)';
    ctx.strokeText(t, hin[0], hin[1]);
    ctx.fillStyle = i === Z.wahl ? ORTROT : '#fff';
    ctx.fillText(t, hin[0], hin[1]);
    /* Der Kasten wird um zwei Pixel großzügiger vermerkt als gemalt: wer auf
       den Rand eines Buchstabens zeigt, hat den Namen gemeint. */
    namensFelder.push([i, hin[0]-3, hin[1]-KASTH/2-2, hin[0]+b+3, hin[1]+KASTH/2+2]);
    /* Der Anker: rot, weil hier ein Name steht. Die Ortsmarken (g = 0)
       haben ihren schon, die zeichnet ortePunkteMalen ohnehin. */
    if (g !== 0) rotPunkt(X, Y, rotR());
    platz[g]--; gesamt++;
  }
}

/* ------------------------------------------------------------ Isochronen */
let isoF = null, isoD = null, isoT = null;
function isoMalen(){
  const r0 = Z.isoKnoten * n;
  /* Dasselbe Verfahren wie beim Höhenfeld: Impulse ins Raster, dann Zähler
     und Nenner getrennt verwischen. σ ist hier 22 Minuten — die Isochrone
     soll eine Linie sein und kein Zickzack. */
  /* Gerechnet wird auf dem **Grundgitter**: σ = 22 Minuten ist mehr als
     sieben Zellen, also reichlich aufgelöst, und die Linien kommen als Pfad
     in Weltkoordinaten heraus und sind darum bei jedem Zoom scharf. Auf dem
     Bildgitter gerechnet wäre es zwanzigmal so teuer, und beim Hineinzoomen
     fehlte der Glocke am Bildrand der halbe Saum. */
  const anz = SW*SH;
  if (!isoF || isoF.length !== anz){
    isoF = new Float32Array(anz); isoD = new Float32Array(anz);
    isoT = new Float32Array(anz);
  }
  const feld = isoF, dich = isoD, hilf = isoT;
  feldAuf(feld, dich, hilf, SW, SH, SZELLE, SX0, SY0 + SH*SZELLE,
          i => { const v = ISO[r0+i]; return v === 255 ? NaN : v * P.isoschritt; },
          22.0);
  /* Marschierende Quadrate: je Zelle die vier Ecken gegen die Stufe, die
     Schnittpunkte auf den Kanten linear interpoliert und verbunden. Eine
     Linie, nicht eine Punktreihe — einer Isochrone, der man nicht folgen
     kann, ist keine. */
  const w = (a,b,L) => (L-a)/(b-a);
  const STUFEN2 = [60,120,180,240,300,360,420,480];
  /* Ein Durchgang über die Zellen für **alle** Stufen, nicht acht. Bei
     einer Zelle je Pixel sind das siebenhunderttausend Zellen, und sie
     achtmal zu lesen, um jedes Mal festzustellen, dass keine Stufe durch
     sie läuft, war die Hälfte der Rechenzeit. Jetzt sagen Kleinst- und
     Größtwert der vier Ecken sofort, welche Stufen überhaupt in Frage
     kommen — bei den meisten Zellen keine. */
  const segs = STUFEN2.map(() => []);
  for (let iy=0; iy<SH-1; iy++) for (let ix=0; ix<SW-1; ix++){
    if (maskeA[iy*SW+ix] < 120) continue;
    const a = feld[iy*SW+ix], b = feld[iy*SW+ix+1],
          c = feld[(iy+1)*SW+ix+1], e = feld[(iy+1)*SW+ix];
    if (Number.isNaN(a)||Number.isNaN(b)||Number.isNaN(c)||Number.isNaN(e)) continue;
    let lo = a, hi = a;
    if (b<lo) lo=b; else if (b>hi) hi=b;
    if (c<lo) lo=c; else if (c>hi) hi=c;
    if (e<lo) lo=e; else if (e>hi) hi=e;
    for (let si=0; si<STUFEN2.length; si++){
      const stufe = STUFEN2[si];
      if (stufe <= lo || stufe >= hi) continue;
      const kn = [];
      if ((a-stufe)*(b-stufe) < 0) kn.push([ix + w(a,b,stufe), iy]);
      if ((b-stufe)*(c-stufe) < 0) kn.push([ix+1, iy + w(b,c,stufe)]);
      if ((e-stufe)*(c-stufe) < 0) kn.push([ix + w(e,c,stufe), iy+1]);
      if ((a-stufe)*(e-stufe) < 0) kn.push([ix, iy + w(a,e,stufe)]);
      if (kn.length === 2) segs[si].push(kn);
      else if (kn.length === 4){ segs[si].push([kn[0],kn[1]]); segs[si].push([kn[2],kn[3]]); }
    }
  }
  for (let si=0; si<STUFEN2.length; si++){
    const stufe = STUFEN2[si], seg = segs[si];
    if (!seg.length) continue;
    const zug = (farbe, breite) => {
      ctx.beginPath();
      for (const [u,v] of seg){
        ctx.moveTo(schirmX(SX0+u[0]*SZELLE), schirmY(SY0+(SH-u[1])*SZELLE));
        ctx.lineTo(schirmX(SX0+v[0]*SZELLE), schirmY(SY0+(SH-v[1])*SZELLE));
      }
      ctx.strokeStyle = farbe; ctx.lineWidth = breite;
      ctx.lineCap = 'round'; ctx.stroke();
    };
    zug('rgba(0,0,0,.6)', 3.2);
    zug(stufe % 120 === 0 ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.5)',
        stufe % 120 === 0 ? 1.6 : 1.0);
  }
  const i0 = P.isoknoten[Z.isoKnoten];
  ctx.beginPath(); ctx.arc(schirmX(wx[i0]), schirmY(wy[i0]), 5.5, 0, 6.2832);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
}

function bauLegende(){
  const b = $('band'); b.innerHTML = '';
  for (const c of RAMPE){
    const d = document.createElement('div'); d.style.background = c; b.appendChild(d);
  }
}
/* „half" liest sich besser als „50 %", wo es passt. */
const BRUCH = [[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[1,6],[1,8],[1,10],
               [1,12],[1,16],[1,20],[1,25],[1,32],[1,50]];
const BRUCHWORT = {'1/2':'half','1/3':'a third','2/3':'two thirds',
  '1/4':'a quarter','3/4':'three quarters','1/5':'a fifth',
  '2/5':'two fifths','1/6':'a sixth','1/8':'an eighth',
  '1/10':'a tenth','1/12':'a twelfth','1/16':'a sixteenth',
  '1/20':'a twentieth','1/25':'a twenty-fifth',
  '1/32':'a thirty-second','1/50':'a fiftieth'};
function anteilWort(q){
  for (const [z,nn] of BRUCH)
    if (Math.abs(q - z/nn) < 0.006) return BRUCHWORT[z+'/'+nn];
  return anteilKurz(q);
}
/* Fuer die Tabelle im Panel: der Name so kurz, dass die Spalte nicht bricht. */
function kurzname(t){
  return t.replace(' Flughafen Fernbahnhof', ' Flughafen')
          .replace(' Hauptbahnhof', ' Hbf').replace(' Bahnhof', '')
          .replace(', Hbf', ' Hbf').replace('D-Flughafen Bf', 'Düsseldorf Flughafen');
}
function anteilKurz(q){
  return (q*100).toFixed(q < 0.1 ? 1 : 0) + ' %';
}

/* Die Teilstriche der Legende. Die Farbleiter ist **nicht** linear in der
   Höhe: fünf ihrer fünfunddreißig Bänder liegen unter Wasser und dehnen die
   Minuten bis zum Meeresspiegel über ein Siebtel der Breite. Ein Strich muss
   darum stückweise gesetzt werden, sonst steht er an der falschen Stelle.
   Dazu kommen zwei benannte Marken: der Meeresspiegel und die Schneegrenze —
   die beiden Zahlen, um die es geht. */
function legAnteil(v){
  const see = Z.wasser;
  if (v <= see) return (see > 0 ? v/see : 0) * NW / RAMPE.length;
  return (NW + (v - see) / Math.max(1e-6, landMax - see) * (NL + NS)) / RAMPE.length;
}
function legendeSetzen(){
  const t = $('legtick');
  const abs = v => Math.round(rmin + v);
  const von = abs(0), bis = abs(landMax);
  /* Eine runde Schrittweite, die etwa sieben Striche ergibt. */
  const roh = (bis - von) / 7;
  const stufen = [10,15,20,25,30,50,60,75,100,120,150,200,300];
  const schritt = stufen.find(x => x >= roh) || 500;
  /* Die beiden benannten Marken zuerst, und ein runder Strich, der ihnen zu
     nah kommt, fällt aus: zwei Zahlen übereinander sind schlechter als eine
     Zahl weniger — dasselbe Argument wie bei der Beschriftung (4.8). */
  const breite = t.getBoundingClientRect().width || 600;
  const marken = [];
  let html = '';
  const setz = (wert, klasse, text) => {
    const f = legAnteil(wert - rmin);
    if (f < -0.002 || f > 1.002) return false;
    if (!klasse && marken.some(m => Math.abs(m - f) * breite < 46)) return false;
    marken.push(f);
    const l = (f*100).toFixed(2) + '%';
    html += '<i class="' + klasse + '" style="left:' + l + '"></i>'
          + '<span class="' + klasse + '" style="left:' + l + '">' + text + '</span>';
    return true;
  };
  setz(abs(Z.wasser), 'merk', abs(Z.wasser) + ' sea');
  setz(abs(schneeLinie), 'merk', abs(schneeLinie) + ' snow');
  for (let v = Math.ceil(von/schritt)*schritt; v <= bis; v += schritt)
    setz(v, '', String(v));
  t.innerHTML = html;
}

/* Der Wasserstand ist intern ein Aufschlag auf den besten Bahnhof, angezeigt
   wird er absolut — und der beste Bahnhof wandert mit dem Anteilsregler.
   Die Anzeige gehört darum zu jedem Bild und nicht nur zum eigenen Regler:
   sonst stand am Regler eine andere Zahl als in der Legende. */
function wasserWort(){
  $('wWasser').textContent = Math.round(rmin + Z.wasser) + ' min';
}
function tafelSetzen(){
  /* Beschriftet wird **absolut**, nicht als Aufschlag auf den besten
     Bahnhof: „water below 181 minutes" ist eine Aussage, „below +100" ist
     eine Rechenaufgabe. Gerechnet wird intern weiter über dem Besten, weil
     die Farbleiter dort ihren Nullpunkt hat. */
  const abs = v => Math.round(rmin + v);
  $('schneezeile').innerHTML = 'Sea below <b>' + abs(Z.wasser)
    + ' min</b>, snow above <b>' + abs(schneeLinie) + ' min</b>';
  const px = 60 * skala;
  $('mstrich').style.width = Math.round(px) + 'px';
  $('mtext').textContent = '60 min ≈ ' + Math.round(60 / P.minprokm) + ' km';
  $('hoehetitel').textContent = 'Height: time until ' + anteilWort(Z.anteil)
    + ' of Germany is within reach';
  wasserWort();
  legendeSetzen();
  if (Z.wahl >= 0) wahlSetzen();
  const iz = $('isozeile');
  if (Z.iso && ISO && Z.isoKnoten >= 0){
    iz.style.display = 'block';
    iz.innerHTML = '<b>Isochrones</b> around <b>' + nm[P.isoknoten[Z.isoKnoten]]
      + '</b>, every 60 minutes. Click another hub to move them.';
  } else iz.style.display = 'none';
}
function text(){
  const hh2 = m => String(Math.floor(m/60)).padStart(2,'0') + ':'
                 + String(m%60).padStart(2,'0');
  const t0 = P.spitze[0];
  $('unterzeile').innerHTML =
    '<b>' + P.bahnhoefe.toLocaleString('en-GB') + ' stations</b> of the '
    + 'long-distance and regional network, drawn by travel time by train '
    + 'instead of by kilometres. One kilometre as the crow flies is worth '
    + P.minprokm.toFixed(2) + ' minutes here. The height is how long it takes '
    + 'until a <b>share of Germany\u2019s population</b> is within reach — and '
    + 'that share is a slider, because it moves between the two poles every '
    + 'accessibility map sits between: conurbation or geography. Reach people '
    + 'fast and you lie under water; over the regions left behind lies snow. '
    + 'Timetable: Wednesday 13 May 2026, departing in the busiest hour of the '
    + 'day, ' + hh2(t0) + '–' + hh2(t0+60) + '.';
}

/* ------------------------------------------------------------- Bedienung */
let geplant = false;
function bald(){
  if (geplant) return;
  geplant = true;
  requestAnimationFrame(() => { geplant = false; zeichne(); });
}
function regler(id, feld, faktor, zeige){
  const e = $(id);
  const auf = () => { Z[feld] = e.value / faktor; zeige(); bald(); };
  e.addEventListener('input', () => { FEINHEIT = ziehFein(); auf(); });
  e.addEventListener('change', () => { FEINHEIT = spiel ? ziehFein() : FEIN_RUHE; auf(); });
  haendeDran(e);
  zeige();
}

/* Wie fein das nächste Bild wird: in Ruhe am feinsten, beim Ziehen gröber,
   in der Fahrt am gröbsten — und im Halt an den Endpunkten wieder fein, weil
   das Bild dort steht und genau dann angesehen wird. Im Halt nicht ganz das
   Feinste: ein Bild, das eine halbe Sekunde zum Rechnen braucht, sieht
   mitten in einer Fahrt nicht nach einer Pause aus, sondern nach einem
   Hänger. Bleibt die Fahrt stehen, kommt über den Reglerwechsel ohnehin
   FEIN_RUHE nach. */
function ziehFein(){
  if (greift) return FEIN_GREIF;
  return !spiel ? FEIN_ZIEH : spiel.halt > 0 ? FEIN_HALT : spielFein;
}

/* ---------- Zoomen und Schieben.

   Am Rad, mit zwei Fingern, und zum Verschieben mit einem — letzteres aber
   nur, wenn es etwas zu verschieben gibt: bei Zoom 1 gehört die Wischbewegung
   der Seite, sonst kann man auf dem Telefon nicht mehr scrollen. Darum
   schaltet `touch-action` mit dem Zoom um.

   Während der Bewegung wird gröber gerastert und danach wieder fein. Das ist
   hier anders als bei der Fahrt (dort wird gemessen): eine Zoomgeste ist
   kurz, ihr Ende ist ein klarer Zeitpunkt, und ein Bild, das während des
   Ziehens hinterherhinkt, macht das Zielen unmöglich. Nach GREIFRUHE
   Millisekunden ohne Ereignis kommt die Ruhestufe zurück. */
const FEIN_GREIF = 3.4, GREIFRUHE = 220;
let greift = false, greifUhr = 0;
const zeiger = new Map();
let zieh = null, gewischt = 0;

function greifAn(){
  if (!greift){ greift = true; FEINHEIT = FEIN_GREIF; }
  clearTimeout(greifUhr);
  greifUhr = setTimeout(() => {
    greift = false; FEINHEIT = spiel ? ziehFein() : FEIN_RUHE; bald();
  }, GREIFRUHE);
}
function kannSchieben(){
  const [x0,x1,y0,y1] = WELT;
  return (x1-x0) * skala > W + 1 || (y1-y0) * skala > H + 1;
}
function zoomTasten(){
  /* Bei Zoom 1 gehört das Wischen der Seite, sonst der Karte. */
  cv.style.touchAction = V.zoom > ZOOMSTART*1.001 ? 'none' : 'pan-y';
  const z = $('zoomzurueck');
  if (z) z.style.display =
    Math.abs(V.zoom - ZOOMSTART) > 0.002 ? 'inline-block' : 'none';
}
function zoomBinden(){
  cv.addEventListener('wheel', ev => {
    ev.preventDefault();
    /* Ein Zeilen-Delta bedeutet auf jedem Gerät etwas anderes; entscheidend
       ist nur das Vorzeichen und eine gedämpfte Schrittweite. */
    const d = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
    const r = cv.getBoundingClientRect();
    greifAn();
    zoomUm(ev.clientX - r.left, ev.clientY - r.top,
           Math.exp(-Math.max(-4, Math.min(4, d / 240)) * 0.40));
    zoomTasten(); bald();
  }, {passive:false});

  cv.addEventListener('pointerdown', ev => {
    zeiger.set(ev.pointerId, {x: ev.clientX, y: ev.clientY});
    gewischt = 0;
    /* Mit der Maus wird geschoben, sobald es etwas zu schieben gibt; mit dem
       Finger erst, wenn man hineingezoomt hat — bei der Anfangsstellung
       gehört das Wischen der Seite, sonst kommt man nicht mehr an den Text
       darunter. */
    if (zeiger.size === 1 && kannSchieben()
        && (ev.pointerType === 'mouse' || V.zoom > ZOOMSTART*1.001)){
      const r = cv.getBoundingClientRect();
      zieh = {px: ev.clientX - r.left, py: ev.clientY - r.top,
              cx: V.cx, cy: V.cy};
      cv.setPointerCapture(ev.pointerId);
    } else if (zeiger.size === 2){
      zieh = null;
    }
  });
  cv.addEventListener('pointermove', ev => {
    const p = zeiger.get(ev.pointerId);
    if (!p) return;
    const vx = ev.clientX - p.x, vy = ev.clientY - p.y;
    p.x = ev.clientX; p.y = ev.clientY;
    gewischt += Math.abs(vx) + Math.abs(vy);
    if (zeiger.size === 2){
      /* Zwei Finger: der Abstand macht den Zoom, die Mitte den Mittelpunkt. */
      const [a, b] = [...zeiger.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (kneif && d > 4 && kneif > 4){
        const r = cv.getBoundingClientRect();
        folgt = false;             /* wer selbst kneift, führt */
        greifAn();
        zoomUm((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, d / kneif);
        zoomTasten(); bald();
      }
      kneif = d;
    } else if (zieh){
      /* Nicht beim ersten Pixel: ein Klick zittert, und ein Klick soll das
         Folgen nicht beenden. Geschoben wird dagegen sofort — eine Karte mit
         acht Pixeln Totgang fühlt sich klebrig an. */
      if (gewischt > 8) folgt = false;
      greifAn();
      V.cx = zieh.cx - (ev.clientX - (cv.getBoundingClientRect().left + zieh.px)) / skala;
      V.cy = zieh.cy + (ev.clientY - (cv.getBoundingClientRect().top + zieh.py)) / skala;
      ansichtKlemmen(); bald();
    }
  });
  const los = ev => {
    zeiger.delete(ev.pointerId);
    if (zeiger.size < 2) kneif = 0;
    if (!zeiger.size) zieh = null;
  };
  cv.addEventListener('pointerup', los);
  cv.addEventListener('pointercancel', los);
  cv.addEventListener('dblclick', ev => { ev.preventDefault(); zoomZurueck(); });
  $('wahlzu').addEventListener('click', () => waehlen(-1));
  zoomTasten();
}
let kneif = 0;
function zoomZurueck(){
  folgt = false;
  V.zoom = ZOOMSTART; V.cx = (RAHMEN[0]+RAHMEN[1])/2; V.cy = (RAHMEN[2]+RAHMEN[3])/2;
  ansichtKlemmen(); zoomTasten();
  FEINHEIT = FEIN_RUHE; bald();
}

/* ---------- Der Abspielknopf. Ein Regler, den man nicht anfasst, sieht wie
   eine Behauptung aus; ein Regler, der von selbst durchfährt, ist ein
   Beweis — man sieht die Verformung als Bewegung statt sie aus zwei
   Standbildern zusammenzudenken. Am Ende des Wegs kehrt die Fahrt um, statt
   zu springen, weil ein Sprung wie ein Schnitt aussieht und alles, was man
   gerade verfolgt hat, verliert. Es läuft immer nur einer: zwei gleichzeitige
   Bewegungen würden dieselbe Verformung erklären, und dann ordnet man keine
   von beiden mehr zu. Wer selbst an einen Regler greift, hat Vorrang. */
function haendeDran(e){
  e.addEventListener('pointerdown', spielAus);
  e.addEventListener('keydown', spielAus);
}
function spielAus(){
  if (!spiel) return;
  const k = $(spiel.knopf);
  k.setAttribute('aria-pressed','false'); k.textContent = '▶';
  spiel = null;
  folgt = false;
  FEINHEIT = FEIN_RUHE;
  bald();
}
/* `wie` ist für den Auftakt beim Laden da (siehe `auftakt`): `einmal` lässt
   die Fahrt am fernen Ende aufhören statt umzukehren, `vor` hält sie vor dem
   ersten Schritt noch einen Moment an. Ohne Angabe pendelt sie wie bisher. */
function spielAn(sid, dauer, wie){
  spielAus();
  const e = $(sid), knopf = 'p' + sid.slice(1);
  const lo = +e.min, hi = +e.max;
  /* zuerst in die weitere Richtung — dort ist mehr zu sehen */
  spiel = {sid, knopf, dauer, hin: (+e.value - lo) < (hi - +e.value),
           halt: (wie && wie.vor) || 0, t: performance.now(),
           einmal: !!(wie && wie.einmal)};
  /* Ist ein Bahnhof gewählt, nimmt ihn die Kamera mit. Das ist der Grund,
     einen zu wählen: man sieht nicht mehr das Land sich verziehen und muss
     sich dabei merken, wo ein Ort war — der Ort steht still und das Land
     bewegt sich um ihn. */
  folgt = Z.wahl >= 0;
  const k = $(knopf);
  k.setAttribute('aria-pressed','true'); k.textContent = '■';
  requestAnimationFrame(spielSchritt);
}
/* An beiden Enden hält die Fahrt kurz an. Ohne den Halt kehrt sie im
   Endzustand um, ohne ihn gezeigt zu haben — und die beiden Endzustände sind
   gerade das, was die Karte behauptet: hier die Geografie, dort die Zeit.
   Eine Dreiviertelsekunde reicht, um das Bild stehen zu sehen, und ist kurz
   genug, dass es nicht nach einem Hänger aussieht. Während des Halts wird
   einmal fein gerastert, weil das Bild ja steht. */
const HALT = 750;
function spielSchritt(t){
  if (!spiel) return;
  const e = $(spiel.sid), lo = +e.min, hi = +e.max;
  const dt = Math.min(100, t - spiel.t);      /* nach einem Aussetzer nicht springen */
  spiel.t = t;
  if (spiel.halt > 0){                        /* stehen bleiben, nichts neu malen */
    spiel.halt = Math.max(0, spiel.halt - dt);
    requestAnimationFrame(spielSchritt);
    return;
  }
  let v = +e.value + (spiel.hin ? 1 : -1) * (hi - lo) * dt / spiel.dauer;
  const fertig = spiel.einmal && (spiel.hin ? v >= hi : v <= lo);
  if (v >= hi){ v = hi; spiel.hin = false; spiel.halt = HALT; }
  else if (v <= lo){ v = lo; spiel.hin = true; spiel.halt = HALT; }
  e.value = v;
  /* Eine Einmal-Fahrt endet hier. Erst das Ereignis, damit der Endzustand
     gezeichnet wird, dann aus — `spielAus` stellt die Rasterstufe zurück auf
     fein, und weil `bald` je Bild nur einmal malt, ist das letzte Bild schon
     das scharfe. */
  if (fertig){ e.dispatchEvent(new Event('input')); spielAus(); return; }
  /* Der Halt wird **vor** dem Ereignis gesetzt, damit das Bild des
     Endzustands schon das feine ist. */
  e.dispatchEvent(new Event('input'));
  requestAnimationFrame(spielSchritt);
}
function start(){
  regler('sMorph','morph',1000, () => {
    const v = Z.morph;
    $('wMorph').textContent = v < .02 ? 'Map' : v > .98 ? 'Time map'
      : Math.round(v*100) + ' % time';
  });
  regler('sWasser','wasser',1, wasserWort);
  /* Der Anteilsregler läuft logarithmisch von der ersten bis zur letzten
     Stufe: unten, wo zwei Prozentpunkte die Karte umwerfen, hat er die
     Auflösung, oben braucht er sie nicht. */
  {
    const e = $('sAnteil'), Q = P.stufen;
    const l0 = Math.log(Q[0]), l1 = Math.log(Q[Q.length-1]);
    const auf = () => {
      Z.anteil = Math.exp(l0 + (l1 - l0) * e.value / 1000);
      stufeSetzen();
      const mio = (P.menschen * Z.anteil / 1e6);
      $('wAnteil').textContent = anteilKurz(Z.anteil) + ' · '
        + mio.toFixed(mio < 10 ? 1 : 0) + ' m people';
      /* Vier Bänder statt drei, seit die Hälfte die Voreinstellung ist: bei
         50 % muss man wirklich quer durchs Land, und „dazwischen" wäre dafür
         geschmeichelt. */
      $('polzeile').innerHTML = Z.anteil < 0.08
        ? '<b>The neighbourhood.</b> Only the people next door count — the map '
          + 'becomes a density map, and the Ruhr wins because it is enough for '
          + 'itself.'
        : Z.anteil < 0.20
        ? '<b>The network.</b> More than any single agglomeration can supply '
          + '(the Ruhr reaches 11.6 % of Germany in 90 minutes), and not yet so '
          + 'much that the corners matter. This is where the network decides.'
        : Z.anteil < 0.55
        ? '<b>The country.</b> Half of Germany means real distance, so a '
          + 'central position starts to pay: Frankfurt, Fulda and Kassel rise, '
          + 'and the edges sink whether or not they are well served.'
        : '<b>The corners.</b> You have to reach the far ends of the country — '
          + 'the map becomes a geography map, and it measures where a place is '
          + 'more than how it is connected.';
      bald();
    };
    e.addEventListener('input', () => { FEINHEIT = ziehFein(); auf(); });
    e.addEventListener('change', () => { FEINHEIT = spiel ? ziehFein() : FEIN_RUHE; auf(); });
    haendeDran(e);
    auf();
  }
  /* Eine Fahrt der Verformung dauert sechs Sekunden, eine Fahrt durch die
     Anteile acht: dort liegen achtzehn gemessene Stufen hintereinander, und
     jede soll man einen Augenblick lang sehen. */
  const abspieler = (id, sid, dauer) => $(id).addEventListener('click', () => {
    if (spiel && spiel.sid === sid) spielAus(); else spielAn(sid, dauer);
  });
  abspieler('pMorph','sMorph', 6000);
  abspieler('pAnteil','sAnteil', 8000);
  /* Im Hintergrund weiterrechnen wäre reine Verschwendung. */
  addEventListener('visibilitychange', () => { if (document.hidden) spielAus(); });
  const knopf = (id, feld, nach) => $(id).addEventListener('click', () => {
    Z[feld] = !Z[feld];
    $(id).setAttribute('aria-pressed', Z[feld] ? 'true':'false');
    if (nach) nach();
    bald();
  });
  knopf('kNamen','namen'); knopf('kLinien','linien'); knopf('kPunkte','punkte');
  knopf('kHaupt','haupt'); knopf('kNeben','neben');
  knopf('kIso','iso', async () => {
    if (Z.iso && !ISO){
      const j = await (await fetch('data/' + P.isodatei)).json();
      const roh = atob(j.daten);
      ISO = new Uint8Array(roh.length);
      for (let i=0;i<roh.length;i++) ISO[i] = roh.charCodeAt(i);
      if (Z.isoKnoten < 0) Z.isoKnoten = 0;
      bald();
    }
  });
  $('kUeber').addEventListener('click', () => $('ueber').classList.add('auf'));
  $('zu').addEventListener('click', () => $('ueber').classList.remove('auf'));
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    /* Erst der Kasten, dann die Wahl: Escape schließt das Oberste. */
    if ($('ueber').classList.contains('auf')) $('ueber').classList.remove('auf');
    else waehlen(-1);
  });
  cv.addEventListener('pointermove', zeigen);
  cv.addEventListener('pointerleave', () => { $('tip').style.opacity = 0; });
  cv.addEventListener('click', klick);
  zoomBinden();
  const zz = $('zoomzurueck');
  if (zz) zz.addEventListener('click', zoomZurueck);
  bald();
}

function naechster(mx, my){
  let best = -1, bd = 26*26;
  for (let i=0;i<n;i++){
    if (!imRahmen(wx[i], wy[i])) continue;      /* draußen ist nicht anklickbar */
    const dx = schirmX(wx[i])-mx, dy = schirmY(wy[i])-my, d = dx*dx+dy*dy;
    if (d < bd){ bd = d; best = i; }
  }
  return best;
}
/* **Der Name zählt wie der Punkt.** Ein Punkt ist drei Pixel breit; der Name
   daneben ist fünfzig. Wer „Göttingen" liest und darauf zeigt, hat Göttingen
   gemeint, und dass die Karte darauf nicht reagierte, war eine Fläche, die
   aussah wie ein Ziel und keines war. Die Namenskästen kommen zuerst, weil
   sie das Genauere sind: sie treffen einen bestimmten Bahnhof, während der
   Umkreis von 26 Pixeln in einem Ballungsraum ein halbes Dutzend erwischt. */
function getroffen(mx, my){
  for (const [i, x0, y0, x1, y1] of namensFelder)
    if (mx >= x0 && mx <= x1 && my >= y0 && my <= y1) return i;
  return naechster(mx, my);
}
/* ------------------------------------------------- Der gewählte Bahnhof */
function menschen(v){
  return v >= 10000 ? Math.round(v/1000).toLocaleString('en-GB') + ',000'
                    : (Math.round(v/100)*100).toLocaleString('en-GB');
}
function waehlen(i){
  if (i === Z.wahl) return;
  Z.wahl = i;
  if (i < 0) folgt = false;
  wahlStand = '';
  wahlSetzen();
  bald();
}
/* Das Feld hängt an jedem Bild — Erreichbarkeit und Anteil wandern mit den
   Reglern, und ein Kasten mit alten Zahlen ist schlechter als keiner. Neu
   geschrieben wird es aber nur, wenn sich etwas darin geändert hat: drei
   innerHTML je Bild sind in der Fahrt nicht nötig. */
let wahlStand = '';
function wahlSetzen(){
  const f = $('wahlfeld'), i = Z.wahl;
  if (i < 0){ f.classList.remove('auf'); wahlStand = ''; return; }
  /* Ob er gerade im Bild steht — man kann ihn wählen und dann wegschieben,
     und ein Kasten über etwas Unsichtbares soll das sagen. Jenseits von WELT
     kommt keiner: WELT ist als Hülle über *alle* Reglerstellungen gebaut,
     nachgezählt null Bahnhöfe draußen bei jedem Morphwert. */
  const X = schirmX(wx[i]), Y = schirmY(wy[i]);
  const drin = X >= 0 && X <= W && Y >= 0 && Y <= H;
  /* Die Ecke gehört in die Kennung, sonst bliebe der Kasten beim Schieben
     liegen, wo er war, und geriete unter den Bahnhof. */
  const oben = drin && Y > H*0.52, rechts = drin && X < W*0.42;
  const kennung = i + '|' + Math.round(roh[i]) + '|' + Math.round(rmin)
                + '|' + Z.anteil.toFixed(4) + '|' + folgt + '|' + drin
                + '|' + oben + rechts + '|' + (W < 520);
  if (kennung === wahlStand) return;
  wahlStand = kennung;
  f.classList.add('auf');
  f.classList.toggle('o', oben);   f.classList.toggle('u', !oben);
  f.classList.toggle('r', rechts); f.classList.toggle('l', !rechts);
  $('wahlname').textContent = nm[i];
  const auf = Math.round(roh[i] - rmin);
  /* Hochkant in Trennpunkten statt in Sätzen: der Kasten liegt dort auf einer
     Karte, die nur ein Drittel so hoch ist, und vier Zeilen Prosa nahmen ein
     Drittel von ihr. Dieselben vier Zahlen, zwei Zeilen. */
  const eng = W < 520;
  $('wahlzahlen').innerHTML = eng
    ? '<b>' + Math.round(roh[i]) + ' min</b> to '
      + anteilKurz(Z.anteil).replace(' ', '') + ' of Germany'
      + (auf === 0 ? ' · <b>the best</b>' : ' · <b>+' + auf + '</b>')
      + '<br>' + halte[i].toLocaleString('en-GB') + ' calls/day · '
      + menschen(einzug[i]) + ' people'
    : '<b>' + Math.round(roh[i]) + ' min</b> until ' + anteilWort(Z.anteil)
      + ' of Germany is within reach — '
      + (auf === 0 ? '<b>the best station in the country</b>'
                   : '<b>+' + auf + ' min</b> over the best')
      + '<br>' + halte[i].toLocaleString('en-GB') + ' calls a day · catchment '
      + menschen(einzug[i]) + ' people';
  $('wahlfolgt').innerHTML = !drin
    ? (eng ? '<b>Off screen</b> — <b>▶</b> brings the view back.'
           : '<b>Off screen.</b> Press <b>▶</b> and the view comes back to it.')
    : folgt
    ? (eng ? '<b>Following.</b>'
           : '<b>Following.</b> The view stays on it while the map morphs.')
    : (eng ? '<b>▶</b> below makes the view travel with it.'
           : 'Press <b>▶</b> by the time slider and the view travels with it.');
}
function zeigen(ev){
  const r = cv.getBoundingClientRect();
  const i = getroffen(ev.clientX - r.left, ev.clientY - r.top);
  cv.style.cursor = i < 0 ? '' : 'pointer';
  const t = $('tip');
  if (i < 0){ t.style.opacity = 0; return; }
  t.innerHTML = '<b>' + nm[i] + '</b><span>'
    + Math.round(roh[i]) + ' min until ' + anteilWort(Z.anteil)
    + ' of Germany is within reach<br>'
    + halte[i] + ' calls a day · catchment '
    + (einzug[i] >= 10000 ? Math.round(einzug[i]/1000) + ',000'
       : Math.round(einzug[i]/100)*100) + ' people</span>';
  t.style.opacity = 1;
  t.style.left = Math.min(innerWidth - t.offsetWidth - 8,
                          Math.max(8, ev.clientX + 12)) + 'px';
  t.style.top  = Math.min(innerHeight - t.offsetHeight - 8,
                          Math.max(8, ev.clientY - t.offsetHeight - 10)) + 'px';
}
function klick(ev){
  if (gewischt > 8) return;          /* das war ein Schieben, kein Klick */
  const r = cv.getBoundingClientRect();
  const i = getroffen(ev.clientX - r.left, ev.clientY - r.top);
  /* Ein Klick ins Leere hebt die Wahl auf — sonst bräuchte man das Kreuz. */
  waehlen(i);
  if (i < 0 || !Z.iso || !ISO) return;
  let best = -1, bd = 1e18;
  P.isoknoten.forEach((k,q) => {
    const d = (wx[k]-wx[i])**2 + (wy[k]-wy[i])**2;
    if (d < bd){ bd = d; best = q; }
  });
  Z.isoKnoten = best; bald();
}

function bauText(){
  const S = P.stress, V = P.verzerrung, K = P.kandidaten;
  const p = x => (x*100).toFixed(1) + ' %';
  const nz = x => x.toLocaleString('en-GB');
  const hh2 = m => String(Math.floor(m/60)).padStart(2,'0')+':'
                 + String(m%60).padStart(2,'0');
  $('ueberinhalt').innerHTML = `
<h2>About this map</h2>
<p>On an ordinary map the unit of scale is the kilometre. Here it is the
minute: every station is drawn as far from every other as the train takes
between them. Places that are quick to reach move closer; places that take
long move away. The slider sweeps back and forth between the ordinary map and
this time map.</p>

<h3>Where the numbers come from</h3>
<p>One timetable day of the open DELFI dataset, <b>Wednesday 13 May 2026</b> —
the same day that <a href="https://chillchamp1.github.io/github.io/#de">A day
on the rails</a> plays back, and the dataset comes from there too. Included is
<b>long-distance and regional rail</b>: ICE, IC, EC, Flixtrain, Thalys, night
trains, RE, RB, IRE, MEX and the private operators. <b>Not</b> included is
urban transport: S-Bahn, U-Bahn, tram and bus are not in the dataset, and that
is deliberate — a map in which the Berlin S-Bahn counts like an ICE shows
conurbations and nothing else. What that costs is set out below.</p>
<table><tr><th>Quantity</th><th>Count</th></tr>
<tr><td>trips a day</td><td class="z">${nz(P.fahrten)}</td></tr>
<tr><td>timetable legs</td><td class="z">${nz(P.verbindungen)}</td></tr>
<tr><td>stations in the dataset (incl. abroad)</td><td class="z">${nz(P.bahnhoefe_alle)}</td></tr>
<tr><td>of those in Germany</td><td class="z">${nz(P.bahnhoefe_de)}</td></tr>
<tr><td>of those on the map</td><td class="z">${nz(P.bahnhoefe)}</td></tr>
<tr><td>busiest hour (departures)</td><td class="z">${hh2(P.spitze[0])}–${hh2(P.spitze[0]+60)}, ${nz(P.spitze[1])}</td></tr>
<tr><td>most trains under way at once</td><td class="z">${hh2(P.spitze_unterwegs[0])}–${hh2(P.spitze_unterwegs[0]+60)}, ${nz(Math.round(P.spitze_unterwegs[1]/60))}</td></tr>
</table>

<h3>The busiest hour, measured</h3>
<p>The peak is not assumed, it is searched for: for every minute of the day,
the number of trains departing in the following hour was counted. The maximum
lies at <b>${hh2(P.spitze[0])}–${hh2(P.spitze[0]+60)}</b> with
${nz(P.spitze[1])} departures. The day has two peaks — counted by trains
<i>simultaneously</i> under way, the evening at
${hh2(P.spitze_unterwegs[0])}–${hh2(P.spitze_unterwegs[0]+60)} is one per cent
ahead. The morning one is used, for two reasons: it has the most departures and
therefore the most connections, and someone leaving in the morning still has
the day ahead — at six in the evening a journey across the country cannot be
completed within a single day's timetable, and a travel time that fails on the
last train no longer measures the timetable.</p>

<h3>How the travel time is computed</h3>
<p><b>Door to door, from the moment of the query.</b> The wait for the first
train counts — that is the whole point of the map. A hub with four trains an
hour lies closer than a halt with one every two hours, even if the ride itself
were the same length. The result is averaged over ${P.proben} departure
minutes, ${P.raster} minutes apart, across the peak hour, so that the accident
of a single minute does not shape the map. A change costs ${P.minum} minutes,
the same everywhere. The computation is a Connection Scan over all
${nz(P.verbindungen)} timetable legs, run separately for every station:
${nz(P.bahnhoefe*P.proben)} timetable queries, from which
${Math.round(P.bahnhoefe*P.bahnhoefe/2/1e6)} million station pairs follow.</p>

<h3>The spring model</h3>
<p>Between every two stations hangs a spring whose rest length is the travel
time, and what is sought is the arrangement in which all springs together pull
least. That is solved by stress majorisation; every spring is weighted by the
inverse square of its rest length, so that the <i>relative</i> error is
measured and the long pairs do not flatten the short ones. The scale comes out
of the same computation: <b>${P.minprokm.toFixed(2)} minutes per kilometre</b>
as the crow flies, so ${Math.round(60/P.minprokm)} km/h on average from
station to station, waiting and changing included.</p>
<p>How well that works is what the stress says — the remaining difference
between drawn length and travel time, as a share:</p>
<table><tr><th>Map</th><th>Stress</th></tr>
<tr><td>the geographic map itself, best possible scaling</td><td class="z">${p(S.geo)}</td></tr>
<tr><td>the flat spring map</td><td class="z">${p(S.flach)}</td></tr>
<tr><td>the same plane, plus a height field</td><td class="z">${p(S.nurhoehe)}</td></tr>
<tr><td>plane and height solved together</td><td class="z">${p(S.gelaende)}</td></tr>
</table>

<h3>Why a relief</h3>
<p>Travel time is not a geometry of the plane. From a remote place everything
is two hours away, and in the plane there is no point that is equally far from
everything and still close by. That is why even the best flat spring map is
${p(S.flach)} off.</p>
<p>A third number per station helps, and measurably so. If the model distance
is no longer computed as a straight line but as a <b>path over terrain</b> —
the shortest chain of edges in the neighbourhood graph, each as long as
<span style="white-space:nowrap">√(Δx² + Δy² + Δh²)</span> — then the stress
falls from ${p(S.flach)} to ${p(S.gelaende)}, a third of the way from the
geographic map to a perfect one. And the plan does <i>not</i> get more
distorted in the process: it sits ${V.gelaende.toFixed(0)} km from the
geography on average, just like the flat map's ${V.flach.toFixed(0)} km.</p>
<p>Only: the height the model would like for this is no good as a statement.
It cannot be. That Hamburg lies further from everything than Fulda is already
in the plan — Hamburg is on the edge. What is left for the height is only what
the plan <i>cannot</i> say, and that is something small-scale; with measured
accessibility it correlates at r = −0.06, which is to say not at all. In one
version Frankfurt Hauptbahnhof came out higher than Westerland on Sylt.
Mathematically right, narratively wrong. So what is drawn is a
<b>measured</b> quantity instead.</p>

<h3>And which height — a slider instead of a number</h3>
<p>The question behind it is: what feels <i>connected</i>? Two obvious answers
are both wrong, and in opposite directions.</p>
<table><tr><th></th><th>Range</th><th>Median</th></tr>
<tr><td><b>A</b> mean travel time to all stations</td><td class="z">${Math.round(K.a_min)}–${Math.round(K.a_max)}</td><td class="z">${Math.round(K.a_median)}</td></tr>
<tr><td><b>B</b> the same, weighted by people</td><td class="z">${Math.round(K.b_min)}–${Math.round(K.b_max)}</td><td class="z">${Math.round(K.b_median)}</td></tr>
</table>
<p><b>A is weighted wrongly:</b> a halt with thirty inhabitants counts like
Cologne in it. <b>B fixes that — and barely changes the map.</b> A and B
correlate at <b>r = ${K.r_ab.toFixed(3)}</b>. The reason is simple once you
see it: a mean over a large country is governed by the <i>far half</i>. It
measures how far it is to the other end — that is, geography. Munich comes out
as badly as Ulm in both, and Munich does not feel that way.</p>
<p>The opposite mistake is just as easy to make. Ask “how long until a million
people are within reach” and you are essentially measuring how long it takes
to cross your own city — Berlin 18 minutes, Munich 24 — and the map becomes a
map of conurbations.</p>
<p><b>Both are the same quantity with two different parameters.</b> Sort all
other stations from one station by travel time and add up their catchments, and
a distribution appears: what share of Germany is within reach after how many
minutes. “Minutes until share q” is its q-quantile, and the two poles are its
two ends — small q is the conurbation, large q the geography. That is why the
share here is a <b>slider</b> and not a fixed number. What it does is in the
numbers:</p>
<table><tr><th>Share</th><th>Minutes</th><th>Median</th><th>the three lowest</th><th>r&nbsp;to&nbsp;A</th></tr>
${P.stufe_kennzahlen.filter((_,i)=>i%2===0 || P.stufen[i]===0.5).map(k =>
  '<tr' + (Math.abs(k.q-0.5)<1e-9 ? ' style="color:#fff"' : '') + '>'
  + '<td class="z">' + (k.q*100).toFixed(k.q<0.1?1:0) + ' %</td>'
  + '<td class="z">' + Math.round(k.min) + '–' + Math.round(k.max) + '</td>'
  + '<td class="z">' + Math.round(k.median) + '</td>'
  + '<td>' + k.tief.map(kurzname).join(', ') + '</td>'
  + '<td class="z">' + k.r_a.toFixed(2) + '</td></tr>').join('')}
</table>
<p>Read from the bottom up, that is the whole journey: at 2 % Berlin and
Cologne win, from 4 to 17 % the <b>Ruhr</b>, from 21 % <b>Frankfurt</b>, and
from two thirds on <b>Fulda, Kassel-Wilhelmshöhe and Göttingen</b> — the
geometric middle of the country. The correlation with A rises from 0.76 to
0.98 along the way: at the top end the map <i>is</i> the geography map.</p>

<h3>Where the default sits, and why</h3>
<p>The choice is not a matter of taste; it has a measured boundary. An
accessibility map stays a density map exactly as long as <b>your own
agglomeration supplies the required share by itself</b> — then nobody has to
use the network. Counted: from Essen, <b>11.6 %</b> of Germany is reachable in
90 minutes, from Frankfurt 5.6 %, from Berlin 5.4 %, from Munich 4.9 %.
Rhine-Ruhr is the largest contiguous agglomeration in the country, and it is
worth about an eighth of it.</p>
<p>Above roughly a seventh, then, no region can draw on itself any more — and
that is exactly where the table above tips over: at 17 % the Ruhr still leads,
at 21 % Frankfurt. At the other end the ranking freezes from about two thirds
on, because by then all that matters is how fast you reach Sylt and Rügen.</p>
<p>So the usable window lies between a sixth and a half, and the default sits
at its <b>upper edge: half</b> — ${(P.menschen*0.5/1e6).toFixed(0)} million
people, four times the largest agglomeration. That is the country rather than
the conurbation: at half, a central position pays, and the map rewards
Frankfurt, Fulda and Kassel. Slide down towards a sixth and you get the other
reading, where the network decides rather than the location. Both are true
statements about the same data; the slider is there because neither is the
only one.</p>

<h3>Where the people come from</h3>
<p>One population weight per station, from three steps:</p>
<ul>
<li><b>District population</b> as of ${P.menschen_jahr === '2024' ? '31 December 2024' : P.menschen_jahr}
from the neighbouring project
<a href="../bevoelkerung-kreise/">Deutschland, gezeichnet von seinen
Menschen</a> — 400 districts, ${(P.menschen/1e6).toFixed(1)} million people
in total.</li>
<li><b>District geometry</b> from the same page. It sits there as a zigzag
varint over a 64-character alphabet and is unpacked here: 400 districts,
12,000 nodes, in an equal-area projection (ETRS89-LAEA). Because that
projection is equal-area, the scale can be checked against the
<i>official</i> district areas — 1 grid unit =
${P.gitter_meter.toFixed(1)} m, and the deviation per district has a median of
${(P.flaeche_fehler*100).toFixed(2)} %. Nine cities with known coordinates all
land inside the ring of their own district.</li>
<li><b>Catchments.</b> Every district is rasterised at
${P.raster_km.toFixed(0)} km, every cell carries its share of the district
population, and that share goes to the <b>nearest station</b> — across
district boundaries, because people travel to the nearest station and not to
the nearest one inside their own district.</li>
</ul>

<h3>Snow, and the islands at sea</h3>
<p>Over the least reachable regions lies <b>snow</b> — the top six of the
thirty-five colour bands. The line is not set but derived: the ramp runs from
the sea level to the highest value <i>on land</i> (more precisely: to its
99.5th percentile, or a single halt with two trains a day flattens the whole
ramp), and the last six bands are snow. In minutes it stands in the legend
below the map — and it stays on that number while the map morphs, because the
percentile is computed over the undistorted geography rather than over
whatever is currently drawn. At half the population it sits at 519 minutes,
and 179 stations lie above it: the tip around Constance, the Bavarian Forest
around Grafenau, the Rügen seaside railway, the Heidekrautbahn at Groß
Schönebeck, Loßburg-Rodt in the Black Forest — and single halts in the middle
of the country where a train stops twice a day, such as Demker in the
Altmark.</p>
<p>The further the slider runs into time, the more <b>islands</b> break away
from the land, and that is not a drawing error. The spring map flings the
places left behind so far out that the warped outline can no longer follow
them — in the pure time map, 585 of the ${nz(P.bahnhoefe)} stations lie beyond
the coast. But a station always belongs on land, so every emigrant gets its own
<b>floe</b>: a disc with a hard edge and a radius of 11.5 minutes. Where
several lie close together the discs merge into an archipelago.</p>

<h3>What is missing, and what it costs</h3>
<ul>
<li><b>No urban transport.</b> S-Bahn, U-Bahn, tram and bus are absent. For
the conurbations that means: the map shows how well they are served by
<i>regional trains</i>, not how well they are served.</li>
<li><b>${P.raus} stations are missing entirely</b>, because their only link to
the network is an S-Bahn station and they therefore hang in mid-air in this
dataset: the Strohgäubahn near Stuttgart, the Gräfenbergbahn near Nuremberg,
the Müglitztalbahn near Dresden and a few more branch lines.</li>
<li><b>${P.busfahrten} trips on ${P.buslinien.length} lines</b> are listed as
rail in the source dataset although they are buses — regional bus networks in
Oberhavel and Havelland, around Crailsheim and Schwäbisch Hall, dial-a-ride
services around Dillingen and Memmingen, Ulm city lines and Coburg's line
1408. They are out.</li>
<li><b>${P.strassenhalte} street stops</b> of the Chemnitz dual-system cars
(${Object.keys(P.engelinien).join(', ')}) are out: railway outside town, tram
inside it. About fifteen of them are genuine halts and go with them — the
dataset does not separate them. The stations on these lines — Stollberg, Aue,
Hainichen, Mittweida — stay.</li>
<li><b>One timetable day, not an average over many Wednesdays.</b> 13 May 2026
is the day before Ascension. The regional timetable is that of an ordinary
Wednesday; in the evening long-distance service a bridging day can mean a few
extra trains.</li>
<li><b>Timetable, not reality.</b> Delays, cancellations and engineering works
are not in the planned timetable.</li>
<li><b>A change costs ${P.minum} minutes everywhere.</b> In reality the
minimum connecting time differs by station; the source does not carry it.</li>
<li><b>Population is spread evenly within a district.</b> In a rural district
with one town and a lot of forest, too much population therefore sits in the
forest. Finer would need municipal or grid data, and that is not here.</li>
<li><b>The largest catchments sit at suburban stations</b> — München Ost,
Leverkusen Mitte, Berlin Schöneweide — because the S-Bahn is missing inside
the cities and the population lands at the few remaining regional stations.
For the measure this does not matter, because those stations are minutes
apart; read as a number per station it is misleading.</li>
<li><b>The border margin does not separate Germany cleanly.</b> The national
boundary is simplified to 2,100 points; a margin of 0.6 km rescues Kehl,
Gronau and Warnemünde, but also pulls in eight foreign stations, and
Lindau-Insel, Herten and Rheinfelden (Baden) are missing in exchange.</li>
<li><b>${(P.ohne_feder*100).toFixed(3)} % of station pairs</b> cannot be
connected at all on this day from this hour. They get no spring.</li>
</ul>

<h3>Using the map</h3>
<ul>
<li><b>Map → Time map</b> warps the map from the geography into the travel
time. The outline and the state borders come along, displaced by the
displacement field of the stations themselves. The <b>play button</b> sweeps
back and forth and pauses for three quarters of a second at each end:
otherwise the sweep turns round in the end state without having shown it — and
the two end states are precisely what the map claims. The map does not go soft
during the sweep: the raster step is measured rather than set, so it runs at
the resting step and only coarsens if the machine could not keep up. <b>That
sweep runs by itself when the page opens</b>, once, from the map into the time
map — seen without the map beside it, the time map just looks like a bad map.
Touching the map stops it, and under <code>prefers-reduced-motion</code> the
page opens on the time map and stays there.</li>
<li><b>Share of population</b> is the slider that defines the height in the
first place — it moves between conurbation and geography. Eighteen steps are
precomputed in the page and blended in between. It has a play button too.</li>
<li><b>Sea level</b> raises the water in minutes. It shifts the colour ramp
with it: what lies below runs under water, and the snow line follows.</li>
<li><b>Isochrones</b> draws the lines of equal travel time around one of
${P.isoknoten.length} precomputed hubs, clickable on the map. That is the test
of the whole thing: on the geographic map they are ragged stars, on the time
map they have to become circles.</li>
<li><b>Main axes</b> and <b>Branch network</b> draw the network itself. And
here is what the data actually holds: pairs of stations that a train links
<i>without stopping in between</i> — a connection graph, not a track map. The
straight line from Berlin Spandau to Frankfurt is one ICE leg, not the route
via Kassel and Fulda. That is why the split follows the product class rather
than some threshold we picked: for long distance the edges genuinely <i>are</i>
leaps (490 pairs, median 31 km, up to 415 km), for regional they follow the
line closely enough to draw it (6,062 pairs, median 4.5 km, three of them over
60 km). Both layers warp with everything else, and that is the point — in the
time map the length of a line is a duration, so the main axes contract into a
knot while the branch lines out to Oberwiesenthal or Kennelgarten stay
long.</li>
<li><b>Zoom</b> with the wheel or two fingers, drag to pan, double-click to
return to the starting view. Zooming refines the raster instead of magnifying
it, because the field is only computed for what is on screen — so the detail
grows as you go in. During the gesture the raster is coarser on purpose, and
it sharpens again the moment you let go. What does <i>not</i> change is the
colour ramp: it is computed on its own grid over the undistorted geography, so
the same height keeps the same colour however close you go — and whatever the
time slider is doing.</li>
<li><b>Zoom out</b> to see what the crop left behind. The starting view sits at
1.15 and cuts about fifty minutes off the top and bottom — the tip of Sylt, the
corner around Constance — and that is unavoidable: Germany is tall (990
minutes) and the screen is wide, so the view is height-limited and the country
already fills the height at zoom 1. Going out to 0.69 puts the whole extent in
the picture, 1,322 × 1,350 minutes instead of the frame's 985 × 1,006, and the
ends that flew out of frame — the Rügen seaside railway, Sylt, the corner
around Singen, Mittenwald — are there with their floe and their name.</li>
<li><b>Stations</b> are shown from the start, and zooming in brings <b>new
names</b> with it, taken from a ranking by calls per day — so the largest
station in view is named first. How many is decided not by the zoom but by the
room: the total number of names stays about the same, and the station names
fill the gap left by the place marks that have dropped out of view. A
<b>red dot</b> means a name stands here — it is the label's anchor, so which
stations are red changes as you zoom; the other 4,781 are white.</li>
<li><b>Click a station</b> — the dot <i>or</i> its name — and its numbers stand
in the corner of the map: minutes until the share is within reach, how far that
is above the best station in the country, calls a day, catchment. The name is
the larger target, and on a phone it is the only one you can hit reliably, so
it counts as a click on the station. Press <b>▶</b> afterwards and the view
<b>travels with that station</b>: it stays dead centre while the country warps
around it, which is the only way to see what happens to one place rather than
to the whole picture. Take hold of the map yourself and the following stops.</li>
</ul>
<p>The <b>frame</b> is fixed and does not travel along as you slide —
otherwise the very deformation the map is about would no longer be visible. But
it comes entirely from the time map: the spring map spans 1,274 × 1,302
minutes, the geographic map only 715 × 956, and a few ends of branch lines run
so far out that Germany sat in the middle like a stamp on a sheet. So it is
<b>cropped</b>, as far as the geographic map allows: until that map fits inside
it with a margin of eight minutes. The factor is not set but measured — 1.29 —
and Germany is drawn a good twenty per cent larger than before. Nothing is lost
from the geographic map; in the pure time map <b>108 of the
${nz(P.bahnhoefe)} stations</b> fly out of frame: 2.3 % of the stations, but
only 0.9 % of all calls a day — the Lake Constance loop, the Rügen seaside
railway, the Erzgebirge and Zittau narrow gauge, Sylt and Dagebüll, the
Bavarian Forest, the Heidekrautbahn. Whatever lies outside is not drawn.</p>

<h3>Sources</h3>
<ul>
<li>Timetable: <a href="https://www.delfi.de/">DELFI e. V.</a>, open dataset
Germany, timetable day 13 May 2026 — via the prepared day extract of
<a href="https://github.com/Chillchamp1/github.io">A day on the rails</a>
(MIT).</li>
<li>Outline and state borders: the same dataset, in a Lambert conformal conic
projection with standard parallels 48.67° and 53.67° N.</li>
<li>Methods: Connection Scan (Dibbelt, Pajor, Strasser, Wagner 2013), stress
majorisation / SMACOF (de Leeuw 1977), Adam (Kingma and Ba 2015).</li>
</ul>
<p style="color:#7f7d77;font-size:12px">Everything needed to redo the
computation sits next to this page: <a href="README.md">README</a>,
<a href="METHODIK.md">Methodik</a>, <a href="QUELLEN.md">Quellen</a>,
<a href="STAND.md">Stand</a>. Those four are in German.</p>`;
}

/* ---------- Der Auftakt.

   Die Seite schlägt auf der **Landkarte** auf und fährt einmal von selbst in
   die Zeitkarte hinüber. Der Grund ist derselbe wie beim Abspielknopf, nur
   dass hier niemand erst darauf kommen muss: wer die Zeitkarte ohne die
   Landkarte daneben sieht, hält sie für eine schlechte Landkarte. Die
   Bewegung sagt in fünf Sekunden, was diese Karte ist, und sie endet dort,
   wo die Seite ruht — in der Zeitkarte. Zurück geht es über den Knopf; der
   Auftakt fährt nur einmal, denn eine Karte, die immer weiter wackelt, kann
   man nicht lesen.

   Vor dem ersten Schritt steht das Bild einen Moment still. Ohne diesen Halt
   fängt die Verformung an, bevor man den Ausgangszustand gesehen hat, und
   dann hat man nichts, womit man das Ergebnis vergleichen könnte.

   Wer die Karte anfasst, hat Vorrang: der erste Zeigerdruck, das erste Rad,
   die erste Taste brechen ab. Erkannt wird der Auftakt an `spiel.einmal` —
   das trägt nur er, und danach greifen die Abbrecher ins Leere.

   Bei `prefers-reduced-motion` bleibt es beim Standbild, und zwar beim
   **Endstand**: angesehen werden soll die Zeitkarte, nicht die Landkarte.
   Deshalb stehen der Regler im HTML und `Z.morph` auch auf der Zeitkarte —
   eine Voreinstellung, nicht zwei. */
const AUFTAKT = 5600, AUFTAKTHALT = 800;
function auftakt(){
  /* `build/film.mjs` fährt den Regler selbst und darf den Auftakt nicht
     gleichzeitig laufen haben. */
  if (window.KEINAUFTAKT) return;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const abbruch = () => { if (spiel && spiel.einmal) spielAus(); };
  cv.addEventListener('pointerdown', abbruch);
  addEventListener('wheel', abbruch, {passive:true});
  addEventListener('keydown', abbruch);
  const e = $('sMorph');
  e.value = e.min;
  /* Das Ereignis und nicht nur der Wert: `Z.morph` und die Beschriftung
     daneben hängen am Reglerereignis. */
  e.dispatchEvent(new Event('input'));
  /* Das Ereignis hat die Rasterstufe auf „wird gezogen" gestellt; hier wird
     aber ein Bild gehalten, und das soll scharf sein. `bald` malt je Bild
     nur einmal, also ist das erste Bild schon das feine. */
  FEINHEIT = FEIN_RUHE;
  spielAn('sMorph', AUFTAKT, {einmal:true, vor:AUFTAKTHALT});
}

los().then(start).then(auftakt).catch(e => {
  const l = $('laden');
  if (l) l.textContent = 'Could not load: ' + e.message;
  console.error(e);
});
</script>
</body>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutschland, gezeichnet von seinen Fahrplänen</title>
<meta name="description" content="Alle Bahnhöfe des deutschen Fern- und Regionalverkehrs, gezeichnet nach Reisezeit statt nach Kilometern — als Reliefkarte der Erreichbarkeit, mit Schnee über den abgehängten Regionen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M1 25h30' stroke='%232169a0' stroke-width='6'/%3E%3Cpath d='M3 22 12 7l7 8 5-7 5 14z' fill='%23c65c33'/%3E%3Cpath d='M12 7l3 3.4-6 0z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --plane:#000; --surface:#0c0c0c; --ink:#fff; --ink2:#bfbeb6; --muted:#7f7d77;
  --line:#232321; --axis:#33332f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--plane);color:var(--ink);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{overflow-x:hidden}

/* Karte links, Tafel rechts — wie in der Vorlage. Unter der Karte liegt der
   Reglerstreifen. Die Regler haben in der Seitenspalte gestanden, und das war
   falsch: man schaut beim Schieben auf die Karte und nicht auf den Regler, und
   wenn beide 900 Pixel auseinanderliegen, schiebt man blind. Jetzt liegt der
   Griff direkt unter dem, was er bewegt. */
#huelle{display:grid;grid-template-columns:1fr 344px;height:100svh;min-height:560px}
#links{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#buehne{position:relative;overflow:hidden;flex:1 1 auto;min-height:200px;
  padding:14px 0 0 14px}
#cv{position:absolute;inset:14px 0 0 14px;width:calc(100% - 14px);
  height:calc(100% - 14px);display:block;border-radius:10px;touch-action:pan-y}
/* Der Streifen ist **eine** Zeile hoch, und das ist keine Kosmetik: jede
   Zeile, die er sich nimmt, nimmt er der Karte weg, und die Karte sollte
   gerade größer werden. Darum liegen hier nur die drei Regler; die
   Anzeigeschalter bleiben in der Tafel, wo sie niemanden etwas kosten. */
#regler{flex:0 0 auto;padding:9px 16px 11px 14px;display:grid;
  grid-template-columns:repeat(3,1fr);gap:7px 24px;align-items:end}
#regler .reg{margin:0}
#tafel{overflow:auto;padding:20px 20px 40px;border-left:1px solid var(--line);
  background:#060605}
#tafel h1{margin:0 0 6px;font-size:21px;font-weight:650;letter-spacing:-.015em;
  line-height:1.2;text-wrap:balance}
#unterzeile{margin:0 0 16px;font-size:12.5px;color:var(--ink2)}
#unterzeile b{color:var(--ink);font-weight:600}

.gruppe{margin:0 0 15px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.gruppe:last-of-type{border-bottom:0}
.titel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 7px}
.reg{margin:0 0 10px}
.reg:last-child{margin-bottom:0}
.reg label{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;
  color:var(--muted);margin-bottom:3px}
.reg label i{font-style:normal;color:var(--ink2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:0;accent-color:#9aa07f;height:17px}
/* Regler und Abspielknopf in einer Zeile. Der Wasserstand hat keinen
   Abspieler und bekommt statt dessen eine Lücke in derselben Breite, damit
   die drei Reglerbahnen untereinander an derselben Stelle anfangen. */
.schub{display:flex;align-items:center;gap:9px}
.schub input[type=range]{flex:1 1 auto;min-width:0;width:auto}
.schub.ohne::before{content:'';flex:0 0 27px}
button.spiel{flex:0 0 auto;width:27px;height:20px;padding:0;font-size:9px;
  line-height:1;display:grid;place-items:center;border-style:solid;
  border-color:var(--line)}
button.spiel[aria-pressed=true]{color:#9aa07f;border-color:#9aa07f}
#knoepfe{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:11px;line-height:1.2;padding:4px 8px;border-radius:6px;
  color:var(--muted);background:transparent;border:1px solid var(--axis);
  border-style:dashed;cursor:pointer}
button[aria-pressed=true],button:hover{color:var(--ink);border-style:solid}
#band{height:10px;border-radius:2px;margin:0 0 4px;display:flex;overflow:hidden}
#band div{flex:1}
#bandtext{display:flex;justify-content:space-between;font-size:10.5px;
  color:var(--muted);font-variant-numeric:tabular-nums}
#schneezeile{margin:7px 0 0;font-size:11.5px;color:var(--ink2)}
#polzeile{margin:6px 0 0;font-size:11px;color:var(--muted);line-height:1.35}
#polzeile b{color:var(--ink2);font-weight:600}
#schneezeile b{color:#fff}
#mstrich{height:1px;background:var(--ink2);margin:5px 0 3px}
#mtext,#mkm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#isozeile{margin:7px 0 0;font-size:11.5px;color:var(--ink2);display:none}
.tip{position:fixed;pointer-events:none;background:#141412;border:1px solid var(--axis);
  border-radius:7px;padding:6px 9px;font-size:12px;z-index:6;max-width:250px;
  opacity:0;transition:opacity .09s;box-shadow:0 6px 22px rgba(0,0,0,.6)}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip span{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
#ueber{position:fixed;inset:0;z-index:8;background:rgba(4,4,4,.97);overflow:auto;
  padding:24px 20px 60px;display:none}
#ueber.auf{display:block}
#ueber .innen{max-width:660px;margin:0 auto}
#ueber h2{font-size:17px;margin:0 0 4px}
#ueber h3{font-size:13px;margin:22px 0 5px;color:var(--ink)}
#ueber p,#ueber li{font-size:13px;color:var(--ink2);margin:0 0 9px}
#ueber li{margin-bottom:4px}
#ueber table{border-collapse:collapse;font-size:12.5px;color:var(--ink2);
  margin:0 0 10px;width:100%}
#ueber td,#ueber th{border-bottom:1px solid var(--line);padding:4px 8px 4px 0;
  text-align:left}
#ueber th{color:var(--muted);font-weight:500;font-size:11px}
#ueber td.z{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#ueber a{color:#9aa07f}
#zu{position:sticky;top:0;float:right}
#laden{position:absolute;inset:14px;display:grid;place-items:center;
  color:var(--muted);font-size:13px;z-index:7;background:var(--plane)}
@media (max-width:900px){
  #huelle{grid-template-columns:1fr;height:auto;min-height:0}
  #links{overflow:visible}
  /* Hochkant ist die Karte breitenbegrenzt: der Rahmen ist fast quadratisch,
     das Telefon ist es nicht. 62 svh hoch stünde darum ein Drittel schwarz
     unter der Karte — also höchstens so hoch, wie die Karte breit ist. */
  #buehne{flex:0 0 auto;height:min(62svh, 104vw);min-height:280px;padding:8px 8px 0}
  #cv{inset:8px 8px 0;width:calc(100% - 16px);height:calc(100% - 8px)}
  #regler{padding:9px 12px 2px}
  #tafel{border-left:0;border-top:1px solid var(--line);padding:16px 14px 34px;
    overflow:visible}
  #tafel h1{font-size:18px}
  #laden{inset:8px}
}
@media (max-width:640px){
  #regler{grid-template-columns:1fr 1fr}
}
@media (max-width:440px){
  #regler{grid-template-columns:1fr;gap:8px}
}
</style>
</head>
<body>
<div id="huelle">
  <div id="links">
    <div id="buehne">
      <canvas id="cv"></canvas>
      <div id="laden">Fahrplan wird geladen …</div>
    </div>
    <div id="regler">
      <div class="reg">
        <label>Landkarte → Zeitkarte <i id="wMorph">Zeitkarte</i></label>
        <div class="schub">
          <button class="spiel" id="pMorph" aria-pressed="false"
            aria-label="Zwischen Landkarte und Zeitkarte hin- und herfahren"
            title="Zwischen Landkarte und Zeitkarte hin- und herfahren">▶</button>
          <input id="sMorph" type="range" min="0" max="1000" value="1000">
        </div>
      </div>
      <div class="reg">
        <label>Anteil Deutschlands in Reichweite <i id="wAnteil">…</i></label>
        <div class="schub">
          <button class="spiel" id="pAnteil" aria-pressed="false"
            aria-label="Vom Ballungsraum bis zur Geografie durchfahren"
            title="Vom Ballungsraum bis zur Geografie durchfahren">▶</button>
          <input id="sAnteil" type="range" min="0" max="1000" value="663">
        </div>
      </div>
      <div class="reg">
        <label>Wasserstand <i id="wWasser">…</i></label>
        <div class="schub ohne">
          <input id="sWasser" type="range" min="0" max="400" value="90">
        </div>
      </div>
    </div>
  </div>
  <div id="tafel">
    <h1>Deutschland, gezeichnet von seinen Fahrplänen</h1>
    <p id="unterzeile">…</p>

    <div class="gruppe">
      <p class="titel" id="hoehetitel">Höhe</p>
      <div id="band"></div>
      <div id="bandtext"><span id="bandmin">+0</span><span id="bandmax">…</span></div>
      <p id="schneezeile">…</p>
      <div id="mstrich"></div>
      <span id="mtext">…</span><br><span id="mkm">…</span>
      <p id="isozeile">…</p>
    </div>

    <div class="gruppe">
      <p class="titel">Wo der Anteilsregler gerade steht</p>
      <p id="polzeile">…</p>
    </div>

    <div class="gruppe">
      <p class="titel">Anzeigen</p>
      <div id="knoepfe">
        <button id="kNamen" aria-pressed="true">Namen</button>
        <button id="kLinien" aria-pressed="true">Höhenlinien</button>
        <button id="kPunkte" aria-pressed="false">Bahnhöfe</button>
        <button id="kIso" aria-pressed="false">Isochronen</button>
        <button id="kUeber">Über diese Karte</button>
      </div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div id="ueber"><div class="innen"><button id="zu">schließen</button>
  <div id="ueberinhalt"></div></div></div>
<script>
"use strict";
/* ===========================================================================
   Eine Karte, auf der der Maßstab nicht der Kilometer ist, sondern die Minute.

   Zwei Zahlen stecken in jedem Bild. Die **Lage** kommt aus einem
   Federmodell: zwischen je zwei Bahnhöfen hängt eine Feder, deren Ruhelänge
   die Reisezeit mit dem Zug ist, und die Karte ist die Lage, in der alle
   Federn zusammen am wenigsten ziehen.

   Die **Höhe** ist, wie lange es dauert, bis von hier ein bestimmter Anteil
   der Bevölkerung mit dem Zug in Reichweite ist — und dieser Anteil ist ein
   Regler, weil er zwischen den beiden Polen jeder Erreichbarkeitskarte
   schiebt. Bei einem kleinen Anteil zählt nur, wer in der Nähe wohnt, und die
   Karte wird eine Dichtekarte: das Ruhrgebiet gewinnt, weil es sich selbst
   genügt. Bei einem großen muss man bis in die Ecken des Landes, und die
   Karte wird eine Geografiekarte: Fulda und Kassel gewinnen, weil sie in der
   Mitte liegen. Dazwischen liegt, was sich als angebunden anfühlt.

   Gezeichnet wird das, wie ein Atlas ein Gebirge zeichnet: ein Höhenfeld,
   fünfunddreißig Farbbänder darüber, auf jeder Bandgrenze eine Höhenlinie,
   und ein Licht aus Nordwesten, das in die Farbe hineingerechnet wird statt
   als graue Ebene darüberzuliegen.
   =========================================================================== */

const cv = document.getElementById('cv'), ctx = cv.getContext('2d', {alpha:false});
const $ = id => document.getElementById(id);

/* ---------- Die Farbleiter: fünf Blaustufen unter Wasser, vierundzwanzig
   Höhenstufen eines physischen Atlas darüber — Tiefland satt grün, Gelbgrün,
   Gelb, Ocker, Orange, Rot, Braun —, und zuoberst sechs Bänder Schnee.
   Fünfunddreißig Bänder, damit jede Grenze eine Höhenlinie tragen kann und
   die Karte die gestochene Dichte einer Reliefkarte bekommt. ---------- */
const WASSER = ['#04182d','#072843','#0b3a5e','#11507c','#186699'];
const LAND = ['#17682b','#20742c','#2b812e','#388e31','#479a36','#589f3b',
  '#6cab41','#82b649','#98c052','#aec95b','#c2ce62','#d2cb60','#dcc05a',
  '#e3b154','#e39f4b','#df8c43','#d7793c','#cc6737','#bf5734','#ae4931',
  '#9b3d2e','#8d3b2d','#7f3f33','#77483f'];
const SCHNEE = ['#9c918d','#b4aca9','#c9c2bf','#dcd8d6','#efedec','#ffffff'];
const RAMPE = WASSER.concat(LAND, SCHNEE);
const NW = WASSER.length, NL = LAND.length, NS = SCHNEE.length;
/* Wo im Land-und-Schnee-Teil die Schneegrenze liegt. */
const SCHNEEANTEIL = NL / (NL + NS);

let P = null, ISO = null;
let n = 0, nm = [], halte = null;
let gxx, gyy, fxx, fyy, hh, roh, REICH, einzug, hmax = 1, rmin = 0;
let wx, wy;
let umriss = [], laender = [], umrissW = [], laenderW = [];
let RAHMEN = null, ZUSCHNITT = 1;

const Z = {morph:1, wasser:90, anteil:0.25, namen:true, linien:true,
           punkte:false, iso:false, isoKnoten:-1};

/* ------------------------------------------------------------------ Laden */
function entpacke(b64, teiler){
  const s = atob(b64), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  const q = new Int16Array(u.buffer), f = new Float32Array(q.length);
  for (let i = 0; i < q.length; i++) f[i] = q[i] / teiler;
  return f;
}

async function los(){
  P = await (await fetch('data/karte.json')).json();
  n = P.namen.length; nm = P.namen; halte = P.halte;
  const mk = P.minprokm;
  gxx = entpacke(P.geox, 10); gyy = entpacke(P.geoy, 10);
  for (let i = 0; i < n; i++){ gxx[i] *= mk; gyy[i] *= mk; }
  fxx = entpacke(P.flachx, 10); fyy = entpacke(P.flachy, 10);
  REICH = entpacke(P.reichweite, 1);          /* STUFEN x n, ganze Minuten */
  hh = new Float32Array(n); roh = new Float32Array(n);
  einzug = entpacke(P.einzug, 0.01);
  Z.anteil = P.stufen[P.stufe_vor];
  stufeSetzen();
  const ring = r => {
    const X = entpacke(r[0],10), Y = entpacke(r[1],10), o = new Float32Array(X.length*2);
    for (let i=0;i<X.length;i++){ o[2*i]=X[i]*mk; o[2*i+1]=Y[i]*mk; }
    return o;
  };
  umriss = P.umriss.map(ring); laender = P.laender.map(ring);
  wx = new Float32Array(n); wy = new Float32Array(n);
  geoGitterBauen();
  dreieckeBauen();
  rahmenBestimmen();
  bauLegende(); bauText(); text();
  $('laden').remove();
  addEventListener('resize', () => { messen(); bald(); });
  messen();
}

/* Der Anteil ist stufenlos, die Rechnung nicht: in der Nutzlast liegen
   achtzehn Stufen von 2 bis 90 Prozent, logarithmisch gelegt, weil sich das
   Bild unten schnell und oben langsam ändert. Zwischen den beiden
   benachbarten Stufen wird linear in log q gemischt — der Unterschied
   zwischen zwei Nachbarstufen ist klein gegen die Glättung des Höhenfeldes,
   also ist die Mischung nicht zu sehen. */
function stufeSetzen(){
  const Q = P.stufen, lq = Math.log(Z.anteil);
  let a = 0;
  while (a < Q.length - 2 && Math.log(Q[a+1]) < lq) a++;
  const f = Math.max(0, Math.min(1,
    (lq - Math.log(Q[a])) / (Math.log(Q[a+1]) - Math.log(Q[a]))));
  const o0 = a*n, o1 = (a+1)*n;
  rmin = Infinity;
  for (let i=0;i<n;i++){
    const v = REICH[o0+i] + (REICH[o1+i] - REICH[o0+i]) * f;
    roh[i] = v;
    if (v < rmin) rmin = v;
  }
  hmax = 1;
  for (let i=0;i<n;i++){
    hh[i] = roh[i] - rmin;
    if (hh[i] > hmax) hmax = hh[i];
  }
  abgelegen = null;        /* die abgelegensten Orte sind jetzt andere */
}

/* Der Rahmen wird **einmal** bestimmt und gilt für jede Reglerstellung:
   über die Bahnhöfe in beiden Lagen *und* über den Umriss in beiden Lagen.
   Nur die Bahnhöfe zu nehmen war zu wenig — das Verschiebungsfeld verzieht
   die Küste über sie hinaus, und dann stand Sylt vor dem Bildrand. Und einen
   Rahmen je Reglerstellung zu rechnen wäre falsch: dann wandert der Maßstab
   beim Schieben, und die Verformung wäre nicht mehr zu sehen.

   Dieser Rahmen war aber zu weit, und zwar **ganz** durch die Zeitkarte:
   die Lage nach Reisezeit spannt 1.274 × 1.302 Minuten, die Landkarte nur
   715 × 956. Ein paar Enden von Nebenbahnen — Oberwiesenthal, Rügen,
   Westerland — fahren in der Zeitkarte so weit hinaus, dass Deutschland in
   der Mitte des Bildes auf drei Viertel der Bildhöhe schrumpft und dort
   sitzt wie eine Briefmarke auf einem Bogen.

   Also wird der Rahmen zugeschnitten, und zwar **so weit, wie die Landkarte
   es zulässt**: bis sie in der engeren Achse mit einem Saum von ZOOMSAUM
   Minuten genau hineinpasst. Der Faktor ist damit nicht gesetzt, sondern
   gemessen — bei diesen Daten 1,29. Der Reglerstreifen unter der Karte
   kostet auch noch Höhe, und nachgemessen gegen die Fassung davor bleibt:
   +23 % auf 1440 × 900 (Maßstab 0,809 gegen 0,660 Pixel je Minute), +21 %
   auf 1280 × 720, +24 % auf 1920 × 1080, +29 % hochkant auf dem Telefon, wo
   die Breite begrenzt und der Zuschnitt voll durchkommt. Verschoben wird
   danach nur noch, nie gedehnt, sonst wäre der Gewinn wieder weg.

   Bei morph = 0 geht damit garantiert nichts verloren. In der Zeitkarte
   fliegen die weit hinausgefahrenen Enden aus dem Bild: 108 von 4.781
   Bahnhöfen, 2,3 % — aber nur 0,9 % aller Halte, Median 20 Halte am Tag
   gegen 42 im ganzen Netz. Das ist der Handel, und er ist billig: die
   Bodenseerunde, die Rügener Kleinbahn, die Erzgebirgs- und
   Zittauer Schmalspur, Sylt und Dagebüll, der Bayerische Wald, die
   Heidekrautbahn. Halte mit acht Zügen am Tag haben kaum Federn, die sie
   halten — ihre Lage ist die unsicherste der ganzen Rechnung. */
const ZOOMSAUM = 8;
function rahmenBestimmen(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;          /* alles, beide Lagen */
  let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;          /* nur die Landkarte */
  const nimm = (x,y) => { if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; };
  const heim = (x,y) => { if(x<a0)a0=x; if(x>a1)a1=x; if(y<b0)b0=y; if(y>b1)b1=y; };
  for (let i=0;i<n;i++){ nimm(gxx[i],gyy[i]); nimm(fxx[i],fyy[i]); heim(gxx[i],gyy[i]); }
  const merk = Z.morph;
  for (const m of [0, 1]){
    Z.morph = m; lage(); umrissVerziehen();
    for (const rs of [umrissW, laenderW]) for (const r of rs)
      for (let i=0;i<r.length;i+=2){
        nimm(r[i], r[i+1]);
        if (m === 0) heim(r[i], r[i+1]);
      }
  }
  Z.morph = merk; lage();

  /* Der größte Zuschnitt, bei dem die Landkarte noch ganz hineinpasst. */
  const zoom = Math.max(1, Math.min((x1-x0) / (a1-a0 + 2*ZOOMSAUM),
                                    (y1-y0) / (b1-b0 + 2*ZOOMSAUM)));
  /* Zugeschnitten wird um die Mitte der Landkarte — dort soll der Gewinn an. */
  const cx = (a0+a1)/2, cy = (b0+b1)/2, f = 1/zoom;
  /* Schieben, bis [c0,c1] drin liegt; die Länge bleibt, was sie ist. */
  const passe = (u0, u1, c0, c1) => {
    const L = u1 - u0;
    if (c1 - c0 >= L){ const m = (c0+c1)/2; return [m - L/2, m + L/2]; }
    const d = c0 < u0 ? c0 - u0 : c1 > u1 ? c1 - u1 : 0;
    return [u0 + d, u1 + d];
  };
  const X = passe(cx + (x0-cx)*f, cx + (x1-cx)*f, a0 - ZOOMSAUM, a1 + ZOOMSAUM);
  const Y = passe(cy + (y0-cy)*f, cy + (y1-cy)*f, b0 - ZOOMSAUM, b1 + ZOOMSAUM);
  RAHMEN = [X[0], X[1], Y[0], Y[1]];
  ZUSCHNITT = zoom;
}

/* ----------------------------------------------------- Maße und Projektion */
let W = 0, H = 0, DPR = 1;
let FW = 0, FH = 0, ZELLE = 3.0, X0 = 0, Y0 = 0;
let mitteX = 0, mitteY = 0, skala = 1, zx = 0, zy = 0;
/* Wie grob das Höhenfeld gerastert wird — in **Pixeln je Zelle**, nicht in
   Minuten (siehe feldMasseSetzen): in Ruhe eine Zelle je Pixel, beim Ziehen
   gröber, in der Fahrt noch gröber. Ein Bild, das ruckelt, zeigt weniger als
   ein Bild, das eine Rasterstufe verliert; ein Bild, das steht, soll die
   feinste haben. */
const FEIN_RUHE = 1.0, FEIN_HALT = 1.5, FEIN_ZIEH = 3.0;
/* In der Fahrt soll die Karte **nicht** weich werden. Also wird nicht
   vorsorglich gröber gerastert, sondern gemessen: die Fahrt läuft auf der
   Ruhestufe, und nur wenn ein Bild länger braucht als SPIELBUDGET, geht sie
   schrittweise gröber — nie gröber als FEIN_GROB, was einer sehr milden
   Weichheit entspricht und weit von den 3,8 Pixeln je Zelle entfernt ist,
   die hier einmal fest eingestellt waren. Wird es wieder schnell, kommt die
   Schärfe zurück. Auf einem gewöhnlichen Rechner kommt die Stufe gar nicht
   zum Tragen. */
const SPIELBUDGET = 110, FEIN_GROB = 1.35;
let spielFein = FEIN_RUHE;
let FEINHEIT = FEIN_RUHE;
let spiel = null;

function messen(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(280, Math.round(r.width)); H = Math.max(280, Math.round(r.height));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bald();
}

function lage(){
  const m = Z.morph;
  for (let i=0;i<n;i++){
    wx[i] = gxx[i] + (fxx[i]-gxx[i])*m;
    wy[i] = gyy[i] + (fyy[i]-gyy[i])*m;
  }
}
const schirmX = v => mitteX + (v - zx) * skala;
const schirmY = v => mitteY - (v - zy) * skala;

/* ------------------------------------------------- Der Umriss, verzogen
   Die Grenzen liegen in der Geografie, die Karte liegt irgendwo zwischen
   Geografie und Zeit. Verschoben wird jeder Grenzpunkt mit dem
   Verschiebungsfeld der Bahnhöfe selbst — gewichtet mit dem Kehrwert des
   Quadrats des Abstands. So bleibt die Kieler Förde die Kieler Förde, auch
   wenn Kiel wegläuft. */
let gZ=0, gW=0, gH_=0, gX0=0, gY0=0, gKopf=null, gListe=null;
function geoGitterBauen(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for (let i=0;i<n;i++){
    if(gxx[i]<x0)x0=gxx[i]; if(gxx[i]>x1)x1=gxx[i];
    if(gyy[i]<y0)y0=gyy[i]; if(gyy[i]>y1)y1=gyy[i];
  }
  gZ = 45; gX0 = x0-90; gY0 = y0-90;
  gW = Math.ceil((x1-x0+180)/gZ); gH_ = Math.ceil((y1-y0+180)/gZ);
  const anz = new Int32Array(gW*gH_+1), zelle = new Int32Array(n);
  for (let i=0;i<n;i++){
    const cx = Math.min(gW-1, Math.max(0, ((gxx[i]-gX0)/gZ)|0));
    const cy = Math.min(gH_-1, Math.max(0, ((gyy[i]-gY0)/gZ)|0));
    zelle[i] = cy*gW+cx; anz[zelle[i]+1]++;
  }
  for (let k=0;k<gW*gH_;k++) anz[k+1]+=anz[k];
  gKopf = anz; gListe = new Int32Array(n);
  const lauf = anz.slice();
  for (let i=0;i<n;i++) gListe[lauf[zelle[i]]++] = i;
}
const WARPEPS = 35*35, WARPMIN = 26;
function verziehe(px, py, aus){
  const cx0 = ((px-gX0)/gZ)|0, cy0 = ((py-gY0)/gZ)|0;
  let sw=0, sx=0, sy=0, gef=0;
  for (let r=1; r<=9 && gef<WARPMIN; r++){
    sw=0;sx=0;sy=0;gef=0;
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
      const jx=cx0+dx, jy=cy0+dy;
      if (jx<0||jy<0||jx>=gW||jy>=gH_) continue;
      for (let q=gKopf[jy*gW+jx]; q<gKopf[jy*gW+jx+1]; q++){
        const i = gListe[q], ex = gxx[i]-px, ey = gyy[i]-py;
        const w = 1/(ex*ex+ey*ey+WARPEPS);
        sw += w; sx += w*(wx[i]-gxx[i]); sy += w*(wy[i]-gyy[i]); gef++;
      }
    }
  }
  aus[0] = px + (sw>0?sx/sw:0); aus[1] = py + (sw>0?sy/sw:0);
}
function umrissVerziehen(){
  const t = [0,0];
  const eine = rs => rs.map(r => {
    const o = new Float32Array(r.length);
    for (let i=0;i<r.length;i+=2){ verziehe(r[i], r[i+1], t); o[i]=t[0]; o[i+1]=t[1]; }
    return o;
  });
  umrissW = eine(umriss); laenderW = eine(laender);
}

/* ------------------------------------------------- Der Umriss in Dreiecken
   Ein verzogener Ring lässt sich nicht einfach füllen. Das
   Verschiebungsfeld schert ihn, und wo er sich dabei selbst überschlägt,
   heben sich die Umlaufzahlen auf: mit der Nonzero-Regel wird aus der Falte
   ein **Loch**, und auf der Karte standen kleine schwarze Dreiecke mitten im
   Land. Mit Evenodd wird es nicht besser, nur anders.

   Darum wird jeder Ring **einmal** in Dreiecke zerlegt — Ohrenschneiden,
   O(n²) bei 2.528 Punkten, also einmalig nichts — und je Bild werden die
   Dreiecke gefüllt. Sie überdecken einander in der Falte, statt sich
   wegzurechnen. Damit das auch bei umgeklappten Dreiecken gilt, wird die
   Umlaufrichtung nach dem Verziehen geprüft und notfalls gedreht: dann
   zählen alle positiv, und eine Überlappung ist nie ein Loch. */
function ohren(r){
  const m = r.length/2;
  const idx = []; for (let i=0;i<m;i++) idx.push(i);
  let flaeche = 0;
  for (let i=0;i<m;i++){
    const j=(i+1)%m;
    flaeche += r[2*i]*r[2*j+1] - r[2*j]*r[2*i+1];
  }
  if (flaeche < 0) idx.reverse();
  const X = i => r[2*idx[i]], Y = i => r[2*idx[i]+1];
  const kreuz = (a,b,c) => (X(b)-X(a))*(Y(c)-Y(a)) - (Y(b)-Y(a))*(X(c)-X(a));
  const drin = (a,b,c,p) => {
    const d1 = kreuz(a,b,p), d2 = kreuz(b,c,p), d3 = kreuz(c,a,p);
    return (d1>=0 && d2>=0 && d3>=0) || (d1<=0 && d2<=0 && d3<=0);
  };
  const tri = [];
  const lebt = new Uint8Array(m).fill(1);
  let uebrig = m, wache = 0;
  let a = 0;
  const naechst = i => { let j=(i+1)%m; while(!lebt[j]) j=(j+1)%m; return j; };
  while (uebrig > 3 && wache < 8*m){
    wache++;
    const b = naechst(a), c = naechst(b);
    let ok = kreuz(a,b,c) > 0;
    if (ok) for (let q=0;q<m;q++){
      if (!lebt[q] || q===a || q===b || q===c) continue;
      if (drin(a,b,c,q)){ ok = false; break; }
    }
    if (ok){
      tri.push(idx[a], idx[b], idx[c]);
      lebt[b] = 0; uebrig--; wache = 0;
    } else a = b;
  }
  {   // der Rest als Fächer — bei einem entarteten Ring besser als nichts
      const rest = [];
      for (let q=0;q<m;q++) if (lebt[q]) rest.push(idx[q]);
      for (let q=1;q+1<rest.length;q++) tri.push(rest[0], rest[q], rest[q+1]);
  }
  return tri;
}
let dreiecke = null;
function dreieckeBauen(){
  dreiecke = [...umriss, ...laender].map(ohren);
}

/* --------------------------------------------------------- Maske und Feld */
let maskeC = null, maskeA = null, inseln = 0, maskeTakt = 0;
const inselIdx = [];
let fH = null;

/* Die Rasterweite wird nicht in Minuten gesetzt, sondern in
   **Bildschirmpixeln**: eine Zelle soll etwa so groß sein wie ein Pixel.
   Eine feste Minutenzahl war beides falsch — auf dem großen Schirm zu grob
   (drei Minuten waren dort zweieinhalb Pixel, und alles, was ins Raster
   gezeichnet wird, also Farbbänder, Höhenlinien und Licht, war um diesen
   Faktor verwaschen) und auf dem Telefon Verschwendung, weil dieselbe Minute
   dort ein Drittel so breit ist. So bleibt die Schärfe auf jedem Gerät
   dieselbe und die Rechenlast auch. Nach oben deckelt ZELLMAX die Zellzahl,
   damit ein sehr großes Fenster die Rechnung nicht sprengt. */
const ZELLMAX = 700000;
function feldMasseSetzen(){
  const [x0,x1,y0,y1] = RAHMEN;
  const rand = 18;
  const bx = x1 - x0 + 2*rand, by = y1 - y0 + 2*rand;
  ZELLE = Math.max(0.8, FEINHEIT / skala);
  const zellen = (bx/ZELLE) * (by/ZELLE);
  if (zellen > ZELLMAX) ZELLE *= Math.sqrt(zellen / ZELLMAX);
  X0 = x0 - rand; Y0 = y0 - rand;
  FW = Math.ceil(bx / ZELLE);
  FH = Math.ceil(by / ZELLE);
}
const feldX = x => (x - X0)/ZELLE;
const feldY = y => (Y0 + FH*ZELLE - y)/ZELLE;

/* Wo ist Land?
   Zuerst sagt es der **verzogene Umriss**: Deutschland, mit dem
   Verschiebungsfeld in die Zeit gezogen. Der reicht aber nicht, denn der
   Umriss ist ein geglättetes Mittel, und die Federkarte schleudert einzelne
   Bahnhöfe weit darüber hinaus — die Rügener Bäderbahn liegt in der Zeit
   zwölf Stunden von allem entfernt und stünde in der reinen Zeitkarte
   draußen im Schwarzen. Ein Bahnhof gehört immer auf Land.
   Dazu kommt darum eine zweite Schicht, aber **nur für die Ausgewanderten**:
   für jeden Bahnhof, der außerhalb des Umrisses liegt, eine weiche Scholle.
   Das stellt sich von selbst richtig ein — in der Landkarte liegt kein
   Bahnhof draußen und es kommt nichts hinzu, und je weiter der Regler in die
   Zeit läuft, desto mehr Inseln lösen sich vom Land. Eine frühere Fassung nahm
   dafür die Abdeckung *aller* Bahnhöfe und blies damit auch die Landkarte auf
   eine Wolke auf, zwanzig Kilometer über jede Küste hinaus.

   Die Scholle war eine Glockenkurve mit einem weichen Saum, und aus ihr wurde
   auf dem Bildschirm ein ausgefranster Nebelfleck von gut zwanzig Minuten
   Radius. Jetzt ist sie eine **Kreisscheibe** mit hartem Rand und halbem
   Radius. Das ist zweimal besser: der Rand ist eine Kante statt eines
   Verlaufs, und die Scheibe hat eine Zahl, an der man sie fassen kann. Wo
   mehrere Ausgewanderte dicht liegen, laufen die Scheiben zu einer Gruppe
   zusammen — ein Archipel statt einer Wolke. */
const INSELR = 11.5;
function maskeBauen(){
  if (!maskeC){ maskeC = document.createElement('canvas'); }
  if (maskeC.width !== FW || maskeC.height !== FH){
    maskeC.width = FW; maskeC.height = FH;
  }
  const mk = maskeC.getContext('2d', {willReadFrequently:true});
  mk.clearRect(0,0,FW,FH);
  mk.fillStyle = '#fff';
  mk.beginPath();
  const alle = [...umrissW, ...laenderW];
  for (let ri=0; ri<alle.length; ri++){
    const r = alle[ri], tri = dreiecke[ri];
    for (let q=0;q<tri.length;q+=3){
      const a=tri[q], b=tri[q+1], c=tri[q+2];
      let ax=feldX(r[2*a]), ay=feldY(r[2*a+1]);
      let bx=feldX(r[2*b]), by=feldY(r[2*b+1]);
      let cx=feldX(r[2*c]), cy=feldY(r[2*c+1]);
      if ((bx-ax)*(cy-ay) - (by-ay)*(cx-ax) < 0){
        const tx=bx, ty=by; bx=cx; by=cy; cx=tx; cy=ty;
      }
      mk.moveTo(ax, ay); mk.lineTo(bx, by); mk.lineTo(cx, cy); mk.closePath();
    }
  }
  mk.fill();

  const d = mk.getImageData(0,0,FW,FH).data;
  maskeA = new Uint8Array(FW*FH);
  for (let k=0;k<FW*FH;k++) maskeA[k] = d[(k<<2)+3];
  /* Wer liegt draußen? Mit einer Zelle Nachsicht, weil der Umriss auf
     Zellenkanten gerastert ist und die Bahnhöfe im Grenzsaum sonst alle als
     ausgewandert gälten. */
  inselIdx.length = 0;
  for (let i=0;i<n;i++){
    const cx = feldX(wx[i]), cy = feldY(wy[i]);
    const ix = cx|0, iy = cy|0;
    let drin = false;
    for (let dy=-1;dy<=1 && !drin;dy++) for (let dx=-1;dx<=1;dx++){
      const jx=ix+dx, jy=iy+dy;
      if (jx<0||jy<0||jx>=FW||jy>=FH) continue;
      if (maskeA[jy*FW+jx] > 120){ drin = true; break; }
    }
    if (!drin) inselIdx.push(i);
  }
  inseln = inselIdx.length;
  /* Die Scheiben kommen ins Raster, damit die Statistik unten dasselbe Land
     sieht wie das Bild — gezeichnet werden sie aber als Pfad in
     Bildschirmauflösung (landPfad), nicht aus diesem Raster. */
  const rz = INSELR / ZELLE, rad = Math.ceil(rz + 1);
  for (const i of inselIdx){
    const cx = feldX(wx[i]), cy = feldY(wy[i]);
    const ix0 = Math.max(0,(cx-rad)|0), ix1 = Math.min(FW-1,(cx+rad)|0);
    const iy0 = Math.max(0,(cy-rad)|0), iy1 = Math.min(FH-1,(cy+rad)|0);
    for (let jy=iy0;jy<=iy1;jy++){
      const dy = jy+0.5-cy, dy2 = dy*dy, row = jy*FW;
      for (let jx=ix0;jx<=ix1;jx++){
        const dx = jx+0.5-cx;
        const t = rz + 0.5 - Math.sqrt(dx*dx+dy2);   /* eine Zelle Saum */
        if (t <= 0) continue;
        const b = t >= 1 ? 255 : t * 255;
        if (b > maskeA[row+jx]) maskeA[row+jx] = b;
      }
    }
  }
}

/* Dieselbe Geometrie — Dreiecke und Inselscheiben —, aber in
   Bildschirmkoordinaten und als Pfad. Damit wird die Küste **beschnitten**
   statt ausmaskiert, und das ist der ganze Unterschied zwischen einer Kante
   und einem Verlauf: die Maske lag im Feldraster und wurde beim Hochskalieren
   bilinear über zwei, drei Bildschirmpixel verschmiert. Ein Pfad hat keine
   Auflösung. Nonzero-Umlauf trägt, weil die Dreiecke nach dem Verziehen auf
   positive Umlaufrichtung gedreht werden und ein arc() mit wachsendem Winkel
   dieselbe hat — eine Überlappung addiert also, sie hebt sich nicht auf. */
function landPfad(){
  ctx.beginPath();
  const alle = [...umrissW, ...laenderW];
  for (let ri=0; ri<alle.length; ri++){
    const r = alle[ri], tri = dreiecke[ri];
    for (let q=0;q<tri.length;q+=3){
      const a=tri[q], b=tri[q+1], c=tri[q+2];
      let ax=schirmX(r[2*a]), ay=schirmY(r[2*a+1]);
      let bx=schirmX(r[2*b]), by=schirmY(r[2*b+1]);
      let cx=schirmX(r[2*c]), cy=schirmY(r[2*c+1]);
      if ((bx-ax)*(cy-ay) - (by-ay)*(cx-ax) < 0){
        const tx=bx, ty=by; bx=cx; by=cy; cx=tx; cy=ty;
      }
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.closePath();
    }
  }
  const rs = INSELR * skala;
  for (const i of inselIdx){
    const x = schirmX(wx[i]), y = schirmY(wy[i]);
    ctx.moveTo(x + rs, y);
    ctx.arc(x, y, rs, 0, 6.28318530718);
    ctx.closePath();
  }
}

/* Ein Kastenfilter mit laufender Summe: zwei Additionen je Zelle, ganz
   gleich wie breit der Kasten ist. Außerhalb wird mit Null gerechnet, und
   das darf man hier, weil Zähler und Nenner denselben Filter sehen und sich
   der Rand im Quotienten wieder herauskürzt. */
function kastenX(a, b, w, h, r){
  const inv = 1/(2*r+1);
  for (let y=0;y<h;y++){
    const o = y*w;
    let s = 0;
    for (let x=0;x<=r && x<w;x++) s += a[o+x];
    for (let x=0;x<w;x++){
      b[o+x] = s * inv;
      const zu = x+r+1, ab = x-r;
      if (zu < w) s += a[o+zu];
      if (ab >= 0) s -= a[o+ab];
    }
  }
}
/* Blockweise transponieren. Der senkrechte Kastenfilter lief einmal je
   Spalte durch den ganzen Speicher — bei siebenhunderttausend Zellen sind das
   siebenhunderttausend Sprünge über 2,8 MB, und kein Cache hält das aus.
   Transponieren und waagerecht filtern liest dagegen der Reihe nach. Die
   32er-Blöcke sind dafür da, dass auch das Transponieren selbst nicht
   springt. */
function umlegen(a, b, w, h){
  const B = 32;
  for (let y0=0;y0<h;y0+=B){
    const y1 = Math.min(h, y0+B);
    for (let x0=0;x0<w;x0+=B){
      const x1 = Math.min(w, x0+B);
      for (let y=y0;y<y1;y++){
        const o = y*w;
        for (let x=x0;x<x1;x++) b[x*h+y] = a[o+x];
      }
    }
  }
}
/* Drei Kastenfilter hintereinander sind eine Glocke auf drei Prozent genau
   (Kovesi). Ein Kasten mit Radius r hat die Varianz (r²+r)/3, drei
   gleiche also r²+r — aber r ist ganzzahlig, und damit ist auch σ
   gerastert. Auf dem feinen Gitter fällt das nicht auf; auf dem gröberen
   Rechengitter (FELDGROB) liegen zwischen r = 2 und r = 3 volle vier
   Minuten, und die Karte wäre entweder zu scharf oder um ein Sechstel zu
   weich gewaschen.

   Darum **gemischte** Radien: ein Teil der Durchgänge einen Schritt breiter.
   Gesucht wird das Tripel, dessen Varianzsumme der Zielvarianz am nächsten
   kommt — ein Dutzend Vergleiche, einmal je Bild. Damit sitzt σ auf jedem
   Raster auf ein Prozent. */
function kastenRadien(sig){
  const ziel = sig*sig;
  let best = null;
  for (let r=1; r<=96; r++) for (let m=0; m<=3; m++){
    const v = (m*(r*r+r) + (3-m)*((r+1)*(r+1)+(r+1))) / 3;
    const d = Math.abs(v - ziel);
    if (!best || d < best.d) best = {d, radien: [0,1,2].map(i => i < m ? r : r+1)};
  }
  return best.radien;
}
function verwischen(a, hilf, w, h, rr){
  kastenX(a, hilf, w, h, rr[0]); kastenX(hilf, a, w, h, rr[1]);
  kastenX(a, hilf, w, h, rr[2]);
  umlegen(hilf, a, w, h);                     /* a ist jetzt h × w */
  kastenX(a, hilf, h, w, rr[0]); kastenX(hilf, a, h, w, rr[1]);
  kastenX(a, hilf, h, w, rr[2]);
  umlegen(hilf, a, h, w);                     /* und wieder w × h */
}

/* Das Höhenfeld: ein mit einer Glocke gewichteter Mittelwert der
   Bahnhofshöhen, σ = FELDSIG Minuten.

   Gerechnet wurde das lange Glocke für Glocke — jeder Bahnhof legte seine
   Kurve ins Raster. Das kostet n mal Glockenfläche Schritte mit je einem
   exp() darin, und die Glockenfläche wächst mit dem Quadrat der Feinheit:
   bei 3 Minuten je Zelle waren es zweieinhalb Millionen exp(), bei 1,5 schon
   zehn Millionen, und ein Bild dauerte 650 ms. Damit war das Raster nicht
   feiner zu machen, und genau das sollte es werden.

   Jetzt kommt jeder Bahnhof als **Impuls** ins Raster — bilinear auf vier
   Zellen verteilt, damit seine Lage im Bruchteil einer Zelle nicht verloren
   geht —, und dann werden Zähler und Nenner **getrennt verwischt**. Der
   Quotient ist derselbe gewichtete Mittelwert wie vorher, nur kostet er
   O(Zellen) statt O(n · r²): das Raster darf jetzt dreimal feiner sein und
   ist dabei schneller als vorher das grobe. */
const FELDSIG = 11.0, LOCHRUNDEN = 8, FELDGROB = 3.6;
let fT = null, fL = null, gH = null, gD = null, gT = null;function feldBauen(){
  /* Wie grob wird gerechnet? So grob, wie das Feld es zulässt. s ist der
     ganzzahlige Faktor zwischen Rechen- und Bildgitter; bei einem Telefon,
     wo eine Zelle ohnehin 2,6 Minuten groß ist, ist er 1 und es passiert
     nichts Besonderes. */
  const s = Math.max(1, Math.ceil(FELDGROB / ZELLE));
  const GW = s === 1 ? FW : Math.ceil(FW / s) + 1;
  const GH = s === 1 ? FH : Math.ceil(FH / s) + 1;
  const ganz = GW*GH, anz = FW*FH;
  if (!gH || gH.length !== ganz){
    gH = new Float32Array(ganz); gD = new Float32Array(ganz); gT = new Float32Array(ganz);
  } else { gH.fill(0); gD.fill(0); }
  if (!fH || fH.length !== anz){ fH = new Float32Array(anz); fT = new Float32Array(anz); }
  /* Impulse ins Rechengitter, bilinear auf vier Zellen. */
  const inv = 1/s;
  for (let i=0;i<n;i++){
    const cx = (feldX(wx[i]) + 0.5) * inv - 0.5, cy = (feldY(wy[i]) + 0.5) * inv - 0.5;
    const ix = Math.floor(cx), iy = Math.floor(cy);
    const gx = cx - ix, gy = cy - iy, h = hh[i];
    for (let dy=0;dy<2;dy++){
      const jy = iy+dy;
      if (jy<0 || jy>=GH) continue;
      const wv = dy ? gy : 1-gy, row = jy*GW;
      for (let dx=0;dx<2;dx++){
        const jx = ix+dx;
        if (jx<0 || jx>=GW) continue;
        const w = wv * (dx ? gx : 1-gx);
        gD[row+jx] += w; gH[row+jx] += w*h;
      }
    }
  }
  /* σ soll am Ende FELDSIG Minuten sein — und am Ende heißt: nach dem
     Verwischen **und** nach dem bilinearen Hochsetzen **und** nach der
     Nachglättung. Die beiden letzten verwischen mit, also wird ihre Varianz
     vom Ziel abgezogen, statt sie oben draufzulegen. Eine bilineare
     Vergrößerung um s wirkt wie ein Kasten der Breite s (Varianz
     (s²−1)/12), die Binomialglättung wie 0,5 Zellen² je Aufruf. */
  const dazu = ZELLE*ZELLE * ((s*s - 1)/12 + (s > 1 ? 1.0 : 0.5));
  const zielMin = Math.sqrt(Math.max(1, FELDSIG*FELDSIG - dazu));
  const rr = kastenRadien(zielMin / (ZELLE*s));
  verwischen(gD, gT, GW, GH, rr);
  verwischen(gH, gT, GW, GH, rr);
  let summe = 0, gedeckt = 0;
  for (let k=0;k<ganz;k++){
    if (gD[k] > 1e-12){ const v = gH[k]/gD[k]; gH[k] = v; summe += v; gedeckt++; }
    else gH[k] = NaN;
  }
  /* Löcher: Zellen, die keine Glocke mehr erreicht. Sie liegen immer
     **außerhalb** des Landes — ein Bahnhof ist selbst ein Impuls und hat
     damit Abdeckung —, und das Land wird ohnehin beschnitten. Gebraucht
     wird ihr Wert nur für den Saum, über den beim Hochskalieren interpoliert
     wird, und dafür genügen ein paar Runden.

     Vierzig Runden über das ganze Raster, jede mit einer Kopie des Feldes,
     waren einmal der teuerste Posten der ganzen Rechnung — und zwar genau
     bei der Landkarte, wo die halbe Bildfläche leer ist und nie ein Loch
     zuging. Eine Liste der Löcher war der nächste Fehler: ein
     JavaScript-Array verpackt jede Zahl einzeln, und das allein kostete mehr
     als das ganze Verwischen. Jetzt ist die Liste ein Int32Array, wird
     einmal angelegt und in jeder Runde an derselben Stelle
     zusammengeschoben. */
  if (!fL || fL.length !== ganz) fL = new Int32Array(ganz);
  let nl = 0;
  for (let k=0;k<ganz;k++) if (Number.isNaN(gH[k])) fL[nl++] = k;
  for (let runde=0; runde<LOCHRUNDEN && nl; runde++){
    let m = 0;
    for (let q=0;q<nl;q++){
      const k = fL[q];
      const ix = k % GW, iy = (k - ix) / GW;
      let sm=0,c=0;
      for (let dy=-1;dy<=1;dy++){
        const jy = iy+dy;
        if (jy<0 || jy>=GH) continue;
        const row = jy*GW;
        for (let dx=-1;dx<=1;dx++){
          const jx = ix+dx;
          if (jx<0 || jx>=GW) continue;
          const v = gH[row+jx];
          if (!Number.isNaN(v)){ sm+=v; c++; }
        }
      }
      if (c) gH[k] = sm/c; else fL[m++] = k;
    }
    nl = m;
  }
  /* Was dann noch offen ist, liegt weit draußen im Schwarzen und wird nie
     gezeigt. Eine Zahl braucht es trotzdem, weil NaN sich durch die Glättung
     frisst; das Mittel der gedeckten Zellen ist oben schon mitgezählt. */
  if (nl){
    const ersatz = gedeckt ? summe/gedeckt : 0;
    for (let q=0;q<nl;q++) gH[fL[q]] = ersatz;
  }

  if (s === 1){
    fH.set(gH);
  } else {
    /* Bilinear aufs Bildgitter setzen. */
    for (let iy=0; iy<FH; iy++){
      const cy = (iy + 0.5) * inv - 0.5;
      let jy = Math.floor(cy);
      const gy = cy - jy;
      if (jy < 0) jy = 0; else if (jy > GH-2) jy = GH-2;
      const r0 = jy*GW, r1 = r0+GW, w0 = 1-gy, w1 = gy, ziel = iy*FW;
      for (let ix=0; ix<FW; ix++){
        const cx = (ix + 0.5) * inv - 0.5;
        let jx = Math.floor(cx);
        const gx = cx - jx;
        if (jx < 0) jx = 0; else if (jx > GW-2) jx = GW-2;
        const a = gH[r0+jx], b = gH[r0+jx+1], c = gH[r1+jx], e = gH[r1+jx+1];
        fH[ziel+ix] = (a + (b-a)*gx) * w0 + (c + (e-c)*gx) * w1;
      }
    }
  }
  /* Einmal mit Radius 1 nachwischen. Eine bilineare Vergrößerung hat
     knickige Ableitungen, und die Ableitung ist hier das Licht — ohne diesen
     Durchgang bekäme der Hang kleine Facetten auf den Zellgrenzen des
     Rechengitters. Bei s = 1 ist es die Binomialglättung, die hier immer
     stand. */
  glaetten(fH, FW, FH);
  if (s > 1) glaetten(fH, FW, FH);
}

function glaetten(a, w, h, hilf){
  const t = hilf || ((fT && fT.length === a.length) ? fT : new Float32Array(a.length));
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const l = x>0?a[y*w+x-1]:a[y*w+x], r = x<w-1?a[y*w+x+1]:a[y*w+x];
    t[y*w+x] = (l + 2*a[y*w+x] + r) * .25;
  }
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const u = y>0?t[(y-1)*w+x]:t[y*w+x], d = y<h-1?t[(y+1)*w+x]:t[y*w+x];
    a[y*w+x] = (u + 2*t[y*w+x] + d) * .25;
  }
}

/* --------------------------------------------------------------- Das Bild */
let bildC = null, bildX = null, bild = null;
const R8=[], G8=[], B8=[];
for (const s of RAMPE){
  R8.push(parseInt(s.slice(1,3),16));
  G8.push(parseInt(s.slice(3,5),16));
  B8.push(parseInt(s.slice(5,7),16));
}
let landMax = 1, schneeLinie = 0;

function bildBauen(){
  if (!bildC || bildC.width !== FW || bildC.height !== FH){
    bildC = document.createElement('canvas'); bildC.width = FW; bildC.height = FH;
    bildX = bildC.getContext('2d', {willReadFrequently:true});
    bild = bildX.createImageData(FW, FH);
  }
  const d = bild.data;
  const see = Z.wasser;
  landMax = see + 1;
  {
    /* Das 99,5-Perzentil des Landes braucht keine siebenhunderttausend
       Stichproben; jede vierte Zelle gibt dieselbe Zahl auf eine Minute
       genau und kostet ein Viertel. Der Höchstwert wird dabei voll gezählt,
       denn er ist ein einzelner Punkt und würde beim Überspringen gerade
       verloren gehen. */
    const N = 512, hist = new Int32Array(N + 1), anz2 = FW*FH;
    let roh = see + 1, zahl = 0;
    for (let k=0;k<anz2;k++) if (maskeA[k] > 120 && fH[k] > roh) roh = fH[k];
    const inv = N / roh;
    for (let k=0;k<anz2;k+=4) if (maskeA[k] > 120){
      let b2 = (fH[k] * inv + 0.5) | 0;
      hist[b2 < 0 ? 0 : b2 > N ? N : b2]++;
      zahl++;
    }
    let bis = Math.floor(zahl * 0.995), s2 = 0, b = N;
    for (let i=0;i<=N;i++){ s2 += hist[i]; if (s2 >= bis){ b = i; break; } }
    landMax = Math.max(see + 1, b / N * roh);
  }
  const bandL = (landMax - see) / (NL + NS);
  const bandW = Math.max(1, see) / NW;
  schneeLinie = see + bandL * NL;
  /* Licht aus Nordwesten, 45 Grad über dem Horizont. Der Gradient wird im
     Feldgitter genommen und mit einem festen Faktor überhöht — ohne ihn wäre
     ein Gelände, dessen Spanne ein Zehntel seiner Breite ist, glatt wie
     Glas. Das Licht geht in die Farbe hinein und liegt nicht als graue
     Ebene darüber: soft-light enthält den Faktor C·(1−C) und kann Weiß nicht
     dunkler machen, käme also genau auf den Gipfeln nicht an. */
  const vz = 2.7;
  const lx = -0.5774, ly = -0.5774, lz = 0.5774;
  const linien = Z.linien;
  /* Gerechnet wird nur, was auch gezeichnet wird. Das Bild deckt den ganzen
     Rahmen ab, gezeigt wird davon aber nur das Land (der Beschnitt in 4.5),
     und das ist bei der Landkarte nicht einmal die Hälfte. Eine Zelle
     Nachsicht in alle vier Richtungen, weil beim Hochskalieren über die
     Schnittkante interpoliert wird und dafür der Nachbar außerhalb mitgelesen
     werden muss. Übersprungene Zellen behalten, was im Puffer stand; sie
     liegen außerhalb des Beschnitts und sind nie zu sehen. */
  for (let iy=0; iy<FH; iy++){
    const oben = Math.max(0,iy-1)*FW, unten = Math.min(FH-1,iy+1)*FW, hier = iy*FW;
    for (let ix=0; ix<FW; ix++){
      const k = hier+ix, j = k<<2;
      if (!maskeA[k] && !maskeA[oben+ix] && !maskeA[unten+ix]
          && !(ix > 0 && maskeA[k-1]) && !(ix < FW-1 && maskeA[k+1])) continue;
      const h = fH[k];
      const hx = (fH[hier + Math.min(FW-1,ix+1)] - fH[hier + Math.max(0,ix-1)]) * vz / (2*ZELLE);
      const hy = (fH[unten + ix] - fH[oben + ix]) * vz / (2*ZELLE);
      let nx = -hx, ny = hy;
      const nl = Math.sqrt(nx*nx + ny*ny + 1);
      let licht = (nx*lx + ny*ly + lz) / nl;
      licht = (licht - 0.577) * 1.45;
      const unterWasser = h < see;
      let bi, stufe, band;
      if (unterWasser){
        band = bandW; stufe = h / bandW;
        bi = Math.min(NW-1, Math.max(0, Math.floor(stufe)));
        licht *= 0.30;
      } else {
        band = bandL; stufe = (h - see) / bandL;
        bi = NW + Math.min(NL+NS-1, Math.max(0, Math.floor(stufe)));
      }
      let r = R8[bi], g = G8[bi], b = B8[bi];
      if (licht > 0){ r += (255-r)*licht*.52; g += (255-g)*licht*.52; b += (255-b)*licht*.52; }
      else { const f = Math.max(.47, 1 + licht*.42); r*=f; g*=f; b*=f; }
      /* Die Höhenlinie liegt auf der Bandgrenze. Gemessen wird der Abstand
         dorthin **in Zellen**, also durch den Betrag des Gradienten geteilt:
         damit ist die Linie im Steilen so dünn wie im Flachen. */
      if (linien){
        const fr = stufe - Math.floor(stufe);
        const grad = Math.sqrt(hx*hx + hy*hy) / vz / band * ZELLE;
        const ab = Math.min(fr, 1-fr) / Math.max(grad, 1e-4);
        if (ab < 0.85){
          const s = 1 - 0.34*(1 - ab/0.85);
          r*=s; g*=s; b*=s;
        }
      }
      d[j] = r<0?0:r>255?255:r; d[j+1] = g<0?0:g>255?255:g;
      /* Deckend. Die Küste schneidet der Pfad (landPfad); stünde die Maske
         hier im Alphakanal, würde sie beim Hochskalieren mitinterpoliert und
         genau die weiche Kante erzeugen, die weg soll. Außerhalb des Landes
         steht trotzdem eine sinnvolle Farbe — das Höhenfeld ist überall
         gefüllt —, und darum blutet an der Schnittkante kein Schwarz ein. */
      d[j+2] = b<0?0:b>255?255:b; d[j+3] = 255;
    }
  }
  bildX.putImageData(bild, 0, 0);
}

/* ------------------------------------------------------------- Zeichnen */
function zeichne(){
  const angefangen = performance.now();
  /* Der Maßstab zuerst: das Raster hängt an ihm (feldMasseSetzen). */
  const [x0,x1,y0,y1] = RAHMEN;
  zx = (x0+x1)/2; zy = (y0+y1)/2;
  skala = Math.min(W / (x1-x0), H / (y1-y0)) * 0.985;
  mitteX = W/2; mitteY = H/2;

  lage();
  umrissVerziehen();
  feldMasseSetzen();
  feldBauen();
  /* Die Rastermaske wird nur noch als Statistik gebraucht — für das
     Perzentil der Farbleiter und für die Liste der Ausgewanderten; gezeichnet
     wird die Küste als Pfad (4.5). Beides ändert sich von Bild zu Bild so
     wenig, dass es in der Fahrt jedes zweite Bild reicht: ein Bahnhof, der
     gerade die Küste überquert, hätte seine Scholle einen Wimpernschlag zu
     früh oder zu spät. Das kostet dreißig Millisekunden je Bild, und die
     fehlen der Schärfe. */
  if (!maskeA || maskeA.length !== FW*FH || !(spiel && !spiel.halt)
      || (maskeTakt++ & 1) === 0) maskeBauen();
  bildBauen();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled = true;
  ctx.save();
  /* erst der Rahmen — das Feld reicht 18 Minuten darüber hinaus, und das
     soll nicht in den schwarzen Rand lappen —, dann das Land selbst */
  ctx.beginPath();
  ctx.rect(schirmX(x0), schirmY(y1), (x1-x0)*skala, (y1-y0)*skala);
  ctx.clip();
  landPfad();
  ctx.clip();
  ctx.drawImage(bildC, schirmX(X0), schirmY(Y0 + FH*ZELLE),
                FW*ZELLE*skala, FH*ZELLE*skala);
  ctx.restore();
  grenzenMalen();
  if (Z.iso && ISO && Z.isoKnoten >= 0) isoMalen();
  if (Z.punkte) punkteMalen();
  if (Z.namen) namenMalen();
  tafelSetzen();

  /* Der Regelkreis für die Fahrt: nachsehen, wie lange dieses Bild
     gebraucht hat, und die Rasterstufe entsprechend nachziehen. Gemessen
     wird nur in der Bewegung — im Halt und in Ruhe soll ohnehin die feinste
     Stufe stehen. */
  if (spiel && !spiel.halt){
    const ms = performance.now() - angefangen;
    if (ms > SPIELBUDGET) spielFein = Math.min(FEIN_GROB, spielFein * 1.18);
    else if (ms < SPIELBUDGET * 0.6) spielFein = Math.max(FEIN_RUHE, spielFein / 1.10);
  }
}

function grenzenMalen(){
  const f = 1 - 0.62 * Z.morph;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const r of laenderW) pfad(r);
  ctx.strokeStyle = 'rgba(255,255,255,' + (.11*f).toFixed(3) + ')';
  ctx.lineWidth = .8; ctx.stroke();
  ctx.beginPath();
  for (const r of umrissW) pfad(r);
  ctx.strokeStyle = 'rgba(255,255,255,' + (.34*f).toFixed(3) + ')';
  ctx.lineWidth = 1.1; ctx.stroke();
}
function pfad(r){
  ctx.moveTo(schirmX(r[0]), schirmY(r[1]));
  for (let i=2;i<r.length;i+=2) ctx.lineTo(schirmX(r[i]), schirmY(r[i+1]));
}

/* Seit der Rahmen zugeschnitten ist, fahren in der Zeitkarte gut hundert
   Halte darüber hinaus. Gezeichnet werden sie dort nicht mehr: ein roter
   Punkt mit Namen, der allein im schwarzen Rand steht, sieht nicht nach „aus
   der Karte gefallen" aus, sondern nach einem Fehler. Wer draußen ist, ist
   draußen. */
const imRahmen = (x, y) =>
  x >= RAHMEN[0] && x <= RAHMEN[1] && y >= RAHMEN[2] && y <= RAHMEN[3];

function punkteMalen(){
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (let i=0;i<n;i++) if (imRahmen(wx[i], wy[i]))
    ctx.fillRect(schirmX(wx[i])-.6, schirmY(wy[i])-.6, 1.3, 1.3);
}

/* Beschriftet werden Orte, nicht Bahnhofsnamen, und zwar so viele, wie ohne
   Überdeckung hineinpassen: jeder versucht acht Plätze um seinen Punkt, wer
   keinen findet, wird nicht gezeichnet. Zwei Namen übereinander sind
   schlechter als ein Name weniger. */
const FERNVORRAT = 22;
let abgelegen = null;
/* Die Schrift war 11,5 Pixel groß und damit für eine Karte zu laut: sie hat
   die Karte gelesen statt sie zu beschriften. Jetzt sind es 8 — dreißig
   Prozent kleiner, das schonende Ende der gewünschten Spanne, weil eine
   Beschriftung, die man nicht mehr liest, keine ist. Was sie an Größe
   verliert, bekommt sie an Kontrast zurück: der schwarze Saum bleibt
   anteilig dicker als vorher. Alle Abstände hängen an SCHRIFT, damit ein
   anderer Wert nicht die Halterei durcheinanderbringt. */
const SCHRIFT = 8, SCHRIFT_ENG = 9, SAUMSTRICH = 2.2, PUNKTR = 1.7;

function namenMalen(){
  /* Auf dem Telefon einen Punkt größer: dort stehen ohnehin nur zwei Dutzend
     Namen, Platz ist also da, und acht Pixel auf einem kleinen Schirm sind
     die Grenze des Lesbaren. */
  const sr = W < 520 ? SCHRIFT_ENG : SCHRIFT;
  const NAHX = Math.round(sr * 0.55);           /* seitlicher Abstand zum Punkt */
  const NAHY = Math.round(sr * 1.1);            /* Zeilensprung nach oben/unten */
  const KASTH = Math.round(sr * 1.3);           /* Höhe des Belegtkastens */
  const belegt = [];
  const frei = (x,y,w,h2) => {
    if (x < 5 || x+w > W-5 || y < 5 || y+h2 > H-5) return false;
    for (const b of belegt)
      if (x < b[2] && b[0] < x+w && y < b[3] && b[1] < y+h2) return false;
    return true;
  };
  ctx.font = '600 ' + sr + 'px ui-sans-serif,system-ui,sans-serif';
  ctx.textBaseline = 'middle';
  const wieviele = W < 520 ? 24 : W < 820 ? 42 : 62;
  /* Und dann die abgelegensten Orte, dazu die abgelegensten *Bahnhöfe* mit
     ihrem eigenen Namen. In der Zeitkarte lösen sich deren Inseln vom Land,
     und eine weiße Scholle ohne Namen ist ein Fleck: die Bäderbahn auf
     Rügen, die Stichbahnen um Konstanz und Freiburg, die Fichtelbergbahn,
     die Heidekrautbahn. Ortsmarken helfen da nicht, denn Konstanz Hbf liegt
     gut angebunden am Land und Konstanz-Wollmatingen draußen im Meer. */
  const fern = W < 520 ? 4 : W < 820 ? 8 : 12;
  if (!abgelegen){
    abgelegen = P.marken.slice().sort((a,b) => hh[b[0]] - hh[a[0]]).slice(0, FERNVORRAT);
    const ord = Array.from({length:n}, (_,i)=>i).sort((a,b) => hh[b] - hh[a]);
    const weit = [];
    for (const i of ord){
      if (weit.length >= FERNVORRAT) break;
      if (weit.every(j => (wx[i]-wx[j])**2 + (wy[i]-wy[j])**2 > 55*55))
        weit.push(i);
    }
    abgelegen = abgelegen.concat(weit.map(i => [i, nm[i]]));
  }
  /* Aus dem Vorrat kommen mehr Kandidaten als Plätze: in der Zeitkarte sind
     die abgelegensten oft genau die, die über den Rand hinausgefahren sind,
     und ohne Nachrücker bliebe dann keine Scholle beschriftet. Gezählt wird
     darum, was **gemalt** wurde, nicht was angeboten war — sonst rücken mit
     jedem Ausfall zwei neue Namen nach und die Karte wird ein Register. */
  const reihe = P.marken.slice(0, wieviele).map(m => [m[0], m[1], 0])
    .concat(abgelegen.slice(0, fern + 10).map(m => [m[0], m[1], 1]),
            abgelegen.slice(FERNVORRAT, FERNVORRAT + fern + 10)
              .map(m => [m[0], m[1], 2]));
  const platz = [wieviele, fern, fern];
  const schon = new Set();
  for (const [i, t, g] of reihe){
    if (schon.has(i) || platz[g] <= 0) continue;
    schon.add(i);
    if (!imRahmen(wx[i], wy[i])) continue;
    const X = schirmX(wx[i]), Y = schirmY(wy[i]);
    const b = ctx.measureText(t).width;
    let hin = null;
    for (const [dx,dy] of [[NAHX,0],[-NAHX-b,0],[NAHX,-NAHY],[-NAHX-b,-NAHY],
                           [NAHX,NAHY],[-NAHX-b,NAHY],
                           [-b/2,-NAHY-1],[-b/2,NAHY+1]]){
      const x = X+dx, y = Y+dy-KASTH/2;
      if (frei(x-2, y-1, b+4, KASTH)){
        hin = [x, y + KASTH/2]; belegt.push([x-2,y-1,x+b+2,y+KASTH-1]); break;
      }
    }
    if (!hin) continue;
    ctx.lineWidth = SAUMSTRICH; ctx.strokeStyle = 'rgba(0,0,0,.68)';
    ctx.strokeText(t, hin[0], hin[1]);
    ctx.fillStyle = '#fff'; ctx.fillText(t, hin[0], hin[1]);
    ctx.beginPath(); ctx.arc(X, Y, PUNKTR, 0, 6.2832);
    ctx.fillStyle = '#e8291c'; ctx.fill();
    ctx.lineWidth = .7; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
    platz[g]--;
  }
}

/* ------------------------------------------------------------ Isochronen */
let isoF = null, isoD = null, isoT = null;
function isoMalen(){
  const r0 = Z.isoKnoten * n;
  /* Dasselbe Verfahren wie beim Höhenfeld: Impulse ins Raster, dann Zähler
     und Nenner getrennt verwischen. σ ist hier 22 Minuten — die Isochrone
     soll eine Linie sein und kein Zickzack. */
  const anz = FW*FH;
  if (!isoF || isoF.length !== anz){
    isoF = new Float32Array(anz); isoD = new Float32Array(anz);
    isoT = new Float32Array(anz);
  } else { isoF.fill(0); isoD.fill(0); }
  const feld = isoF, dich = isoD, hilf = isoT;
  for (let i=0;i<n;i++){
    const v = ISO[r0+i];
    if (v === 255) continue;
    const t = v * P.isoschritt;
    const cx = feldX(wx[i]) - 0.5, cy = feldY(wy[i]) - 0.5;
    const ix = Math.floor(cx), iy = Math.floor(cy);
    const gx = cx-ix, gy = cy-iy;
    for (let dy=0;dy<2;dy++){
      const jy = iy+dy;
      if (jy<0 || jy>=FH) continue;
      const wv = dy?gy:1-gy, row = jy*FW;
      for (let dx=0;dx<2;dx++){
        const jx = ix+dx;
        if (jx<0 || jx>=FW) continue;
        const w = wv*(dx?gx:1-gx);
        dich[row+jx]+=w; feld[row+jx]+=w*t;
      }
    }
  }
  const rk = kastenRadien(Math.sqrt(Math.max(1, 22*22 - 0.5*ZELLE*ZELLE)) / ZELLE);
  verwischen(dich, hilf, FW, FH, rk);
  verwischen(feld, hilf, FW, FH, rk);
  for (let k=0;k<anz;k++) feld[k] = dich[k]>1e-12 ? feld[k]/dich[k] : NaN;
  glaetten(feld, FW, FH, hilf);
  /* Marschierende Quadrate: je Zelle die vier Ecken gegen die Stufe, die
     Schnittpunkte auf den Kanten linear interpoliert und verbunden. Eine
     Linie, nicht eine Punktreihe — einer Isochrone, der man nicht folgen
     kann, ist keine. */
  const w = (a,b,L) => (L-a)/(b-a);
  const STUFEN2 = [60,120,180,240,300,360,420,480];
  /* Ein Durchgang über die Zellen für **alle** Stufen, nicht acht. Bei
     einer Zelle je Pixel sind das siebenhunderttausend Zellen, und sie
     achtmal zu lesen, um jedes Mal festzustellen, dass keine Stufe durch
     sie läuft, war die Hälfte der Rechenzeit. Jetzt sagen Kleinst- und
     Größtwert der vier Ecken sofort, welche Stufen überhaupt in Frage
     kommen — bei den meisten Zellen keine. */
  const segs = STUFEN2.map(() => []);
  for (let iy=0; iy<FH-1; iy++) for (let ix=0; ix<FW-1; ix++){
    if (maskeA[iy*FW+ix] < 120) continue;
    const a = feld[iy*FW+ix], b = feld[iy*FW+ix+1],
          c = feld[(iy+1)*FW+ix+1], e = feld[(iy+1)*FW+ix];
    if (Number.isNaN(a)||Number.isNaN(b)||Number.isNaN(c)||Number.isNaN(e)) continue;
    let lo = a, hi = a;
    if (b<lo) lo=b; else if (b>hi) hi=b;
    if (c<lo) lo=c; else if (c>hi) hi=c;
    if (e<lo) lo=e; else if (e>hi) hi=e;
    for (let si=0; si<STUFEN2.length; si++){
      const stufe = STUFEN2[si];
      if (stufe <= lo || stufe >= hi) continue;
      const kn = [];
      if ((a-stufe)*(b-stufe) < 0) kn.push([ix + w(a,b,stufe), iy]);
      if ((b-stufe)*(c-stufe) < 0) kn.push([ix+1, iy + w(b,c,stufe)]);
      if ((e-stufe)*(c-stufe) < 0) kn.push([ix + w(e,c,stufe), iy+1]);
      if ((a-stufe)*(e-stufe) < 0) kn.push([ix, iy + w(a,e,stufe)]);
      if (kn.length === 2) segs[si].push(kn);
      else if (kn.length === 4){ segs[si].push([kn[0],kn[1]]); segs[si].push([kn[2],kn[3]]); }
    }
  }
  for (let si=0; si<STUFEN2.length; si++){
    const stufe = STUFEN2[si], seg = segs[si];
    if (!seg.length) continue;
    const zug = (farbe, breite) => {
      ctx.beginPath();
      for (const [u,v] of seg){
        ctx.moveTo(schirmX(X0+u[0]*ZELLE), schirmY(Y0+(FH-u[1])*ZELLE));
        ctx.lineTo(schirmX(X0+v[0]*ZELLE), schirmY(Y0+(FH-v[1])*ZELLE));
      }
      ctx.strokeStyle = farbe; ctx.lineWidth = breite;
      ctx.lineCap = 'round'; ctx.stroke();
    };
    zug('rgba(0,0,0,.6)', 3.2);
    zug(stufe % 120 === 0 ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.5)',
        stufe % 120 === 0 ? 1.6 : 1.0);
  }
  const i0 = P.isoknoten[Z.isoKnoten];
  ctx.beginPath(); ctx.arc(schirmX(wx[i0]), schirmY(wy[i0]), 5.5, 0, 6.2832);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
}

let geplant = false;
function bald(){
  if (geplant) return;
  geplant = true;
  requestAnimationFrame(() => { geplant = false; zeichne(); });
}
function regler(id, feld, faktor, zeige){
  const e = $(id);
  const auf = () => { Z[feld] = e.value / faktor; zeige(); bald(); };
  e.addEventListener('input', () => { FEINHEIT = ziehFein(); auf(); });
  e.addEventListener('change', () => { FEINHEIT = spiel ? ziehFein() : FEIN_RUHE; auf(); });
  haendeDran(e);
  zeige();
}

/* Wie fein das nächste Bild wird: in Ruhe am feinsten, beim Ziehen gröber,
   in der Fahrt am gröbsten — und im Halt an den Endpunkten wieder fein, weil
   das Bild dort steht und genau dann angesehen wird. Im Halt nicht ganz das
   Feinste: ein Bild, das eine halbe Sekunde zum Rechnen braucht, sieht
   mitten in einer Fahrt nicht nach einer Pause aus, sondern nach einem
   Hänger. Bleibt die Fahrt stehen, kommt über den Reglerwechsel ohnehin
   FEIN_RUHE nach. */
function ziehFein(){
  return !spiel ? FEIN_ZIEH : spiel.halt > 0 ? FEIN_HALT : spielFein;
}

/* ---------- Der Abspielknopf. Ein Regler, den man nicht anfasst, sieht wie
   eine Behauptung aus; ein Regler, der von selbst durchfährt, ist ein
   Beweis — man sieht die Verformung als Bewegung statt sie aus zwei
   Standbildern zusammenzudenken. Am Ende des Wegs kehrt die Fahrt um, statt
   zu springen, weil ein Sprung wie ein Schnitt aussieht und alles, was man
   gerade verfolgt hat, verliert. Es läuft immer nur einer: zwei gleichzeitige
   Bewegungen würden dieselbe Verformung erklären, und dann ordnet man keine
   von beiden mehr zu. Wer selbst an einen Regler greift, hat Vorrang. */
function haendeDran(e){
  e.addEventListener('pointerdown', spielAus);
  e.addEventListener('keydown', spielAus);
}
function spielAus(){
  if (!spiel) return;
  const k = $(spiel.knopf);
  k.setAttribute('aria-pressed','false'); k.textContent = '▶';
  spiel = null;
  FEINHEIT = FEIN_RUHE;
  bald();
}
function spielAn(sid, dauer){
  spielAus();
  const e = $(sid), knopf = 'p' + sid.slice(1);
  const lo = +e.min, hi = +e.max;
  /* zuerst in die weitere Richtung — dort ist mehr zu sehen */
  spiel = {sid, knopf, dauer, hin: (+e.value - lo) < (hi - +e.value),
           halt: 0, t: performance.now()};
  const k = $(knopf);
  k.setAttribute('aria-pressed','true'); k.textContent = '■';
  requestAnimationFrame(spielSchritt);
}
/* An beiden Enden hält die Fahrt kurz an. Ohne den Halt kehrt sie im
   Endzustand um, ohne ihn gezeigt zu haben — und die beiden Endzustände sind
   gerade das, was die Karte behauptet: hier die Geografie, dort die Zeit.
   Eine Dreiviertelsekunde reicht, um das Bild stehen zu sehen, und ist kurz
   genug, dass es nicht nach einem Hänger aussieht. Während des Halts wird
   einmal fein gerastert, weil das Bild ja steht. */
const HALT = 750;
function spielSchritt(t){
  if (!spiel) return;
  const e = $(spiel.sid), lo = +e.min, hi = +e.max;
  const dt = Math.min(100, t - spiel.t);      /* nach einem Aussetzer nicht springen */
  spiel.t = t;
  if (spiel.halt > 0){                        /* stehen bleiben, nichts neu malen */
    spiel.halt = Math.max(0, spiel.halt - dt);
    requestAnimationFrame(spielSchritt);
    return;
  }
  let v = +e.value + (spiel.hin ? 1 : -1) * (hi - lo) * dt / spiel.dauer;
  if (v >= hi){ v = hi; spiel.hin = false; spiel.halt = HALT; }
  else if (v <= lo){ v = lo; spiel.hin = true; spiel.halt = HALT; }
  e.value = v;
  /* Der Halt wird **vor** dem Ereignis gesetzt, damit das Bild des
     Endzustands schon das feine ist. */
  e.dispatchEvent(new Event('input'));
  requestAnimationFrame(spielSchritt);
}

function naechster(mx, my){
  let best = -1, bd = 26*26;
  for (let i=0;i<n;i++){
    if (!imRahmen(wx[i], wy[i])) continue;      /* draußen ist nicht anklickbar */
    const dx = schirmX(wx[i])-mx, dy = schirmY(wy[i])-my, d = dx*dx+dy*dy;
    if (d < bd){ bd = d; best = i; }
  }
  return best;
}
function zeigen(ev){
  const r = cv.getBoundingClientRect();
  const i = naechster(ev.clientX - r.left, ev.clientY - r.top);
  const t = $('tip');

  t.innerHTML = '<b>' + nm[i] + '</b><span>'

                          Math.max(8, ev.clientY - t.offsetHeight - 10)) + 'px';
}
function klick(ev){

}

<h2>Über diese Karte</h2>
<p>Auf einer Landkarte ist der Maßstab der Kilometer. Hier ist er die Minute:

<h3>Wie die Reisezeit gerechnet wird</h3>
<p><b>Von Tür zu Tür, ab der Anfragezeit.</b> Die Wartezeit auf den ersten Zug

<tr><td>die flache Federkarte</td><td class="z">${p(S.flach)}</td></tr>
<tr><td>dieselbe Ebene, dazu ein Höhenfeld</td><td class="z">${p(S.nurhoehe)}</td></tr>
<tr><td>Ebene und Höhe zusammen gesucht</td><td class="z">${p(S.gelaende)}</td></tr>
</table>

<h3>Warum ein Relief</h3>
<p>Die Reisezeit ist keine Geometrie der Ebene. Von einem abgelegenen Ort sind
es zu allem zwei Stunden, und in der Ebene gibt es keinen Punkt, der von allem
gleich weit weg ist und trotzdem in der Nähe liegt. Darum bleibt selbst die
beste flache Federkarte ${p(S.flach)} daneben.</p>
<p>Eine dritte Zahl je Bahnhof hilft, und zwar messbar. Wird die Modelldistanz
nicht mehr als Luftlinie, sondern als <b>Weg über ein Gelände</b> gerechnet —
die kürzeste Kette von Kanten im Nachbarschaftsgraphen, jede so lang wie
<span style="white-space:nowrap">√(Δx² + Δy² + Δh²)</span> —, dann fällt der
Stress von ${p(S.flach)} auf ${p(S.gelaende)}, ein Drittel des Weges von der
Landkarte zur perfekten Karte. Und der Grundriss wird dabei <i>nicht</i>
krummer: er liegt mit ${V.gelaende.toFixed(0)} km im Mittel genauso weit von
der Geografie wie der der flachen Karte mit ${V.flach.toFixed(0)} km.</p>
<p>Nur: die Höhe, die das Modell sich dafür wünscht, taugt nicht als Aussage.
Sie kann es nicht. Dass Hamburg weiter von allem entfernt liegt als Fulda,
steht schon im Grundriss — Hamburg liegt am Rand. Übrig bleibt für die Höhe
nur, was der Grundriss <i>nicht</i> sagen kann, und das ist etwas
Kleinräumiges; mit der gemessenen Erreichbarkeit korreliert sie mit r = −0,06,
also gar nicht. In einer Fassung lag Frankfurt Hauptbahnhof darin höher als
Westerland auf Sylt. Mathematisch richtig, erzählerisch falsch. Gezeichnet
wird deshalb eine <b>gemessene</b> Größe.</p>

<h3>Und welche Höhe — ein Regler statt einer Zahl</h3>
<p>Die Frage dahinter ist: was fühlt sich als <i>angebunden</i> an? Zwei
naheliegende Antworten sind beide schief, und zwar in entgegengesetzte
Richtungen.</p>
<table><tr><th></th><th>Spanne</th><th>Median</th></tr>
<tr><td><b>A</b> mittlere Reisezeit zu allen Bahnhöfen</td><td class="z">${Math.round(K.a_min)}–${Math.round(K.a_max)}</td><td class="z">${Math.round(K.a_median)}</td></tr>
<tr><td><b>B</b> dasselbe, nach Menschen gewichtet</td><td class="z">${Math.round(K.b_min)}–${Math.round(K.b_max)}</td><td class="z">${Math.round(K.b_median)}</td></tr>
</table>
<p><b>A ist falsch gewichtet:</b> ein Haltepunkt mit dreißig Einwohnern zählt
darin wie Köln. <b>B behebt das — und ändert die Karte fast nicht.</b> A und B
korrelieren mit <b>r = ${K.r_ab.toFixed(3).replace('.',',')}</b>. Der Grund
ist einfach, sobald man ihn sieht: ein Mittelwert über ein großes Land wird
von der <i>fernen Hälfte</i> bestimmt. Er misst, wie weit es bis zum anderen
Ende ist — also Geografie. München steht in beiden so schlecht wie Ulm, und
München fühlt sich nicht so an.</p>
<p>Der umgekehrte Fehler ist genauso leicht zu machen. Fragt man „wie lange,
bis eine Million Menschen erreichbar sind", misst man im Grunde, wie lange man
braucht, um die eigene Stadt zu durchqueren — Berlin 18 Minuten, München 24 —,
und die Karte wird eine Karte der Ballungsräume.</p>
<p><b>Beides ist dieselbe Größe mit zwei verschiedenen Parametern.</b> Sortiert
man von einem Bahnhof aus alle anderen nach Reisezeit und summiert ihre
Einzugsgebiete auf, entsteht eine Verteilung: welcher Anteil Deutschlands nach
wie vielen Minuten in Reichweite ist. „Minuten bis zum Anteil q" ist ihr
q-Quantil, und die beiden Pole sind seine beiden Enden — kleines q ist der
Ballungsraum, großes q die Geografie. Darum ist der Anteil hier ein
<b>Regler</b> und keine gesetzte Zahl. Was er tut, steht in den Zahlen:</p>
<table><tr><th>Anteil</th><th>Minuten</th><th>Median</th><th>die drei tiefsten</th><th>r&nbsp;zu&nbsp;A</th></tr>
${P.stufe_kennzahlen.filter((_,i)=>i%2===0 || P.stufen[i]===0.25).map(k =>
  '<tr' + (Math.abs(k.q-0.25)<1e-9 ? ' style="color:#fff"' : '') + '>'
  + '<td class="z">' + (k.q*100).toFixed(k.q<0.1?1:0).replace('.',',') + ' %</td>'
  + '<td class="z">' + Math.round(k.min) + '–' + Math.round(k.max) + '</td>'
  + '<td class="z">' + Math.round(k.median) + '</td>'
  + '<td>' + k.tief.map(kurzname).join(', ') + '</td>'
  + '<td class="z">' + k.r_a.toFixed(2).replace('.',',') + '</td></tr>').join('')}
</table>
<p>Von unten nach oben gelesen ist das der ganze Weg: bei 2 % gewinnen Berlin
und Köln, bei 4 bis 17 % das <b>Ruhrgebiet</b>, ab 21 % <b>Frankfurt</b>, und
ab zwei Dritteln <b>Fulda, Kassel-Wilhelmshöhe und Göttingen</b> — die
geometrische Mitte des Landes. Die Korrelation mit A steigt dabei von 0,76 auf
0,98: am oberen Ende <i>ist</i> die Karte die Geografiekarte.</p>

<h3>Warum ein Viertel voreingestellt ist</h3>
<p>Die Wahl ist nicht Geschmack, sondern hat eine gemessene Grenze. Eine
Erreichbarkeitskarte ist genau so lange eine Dichtekarte, wie die <b>eigene
Agglomeration den geforderten Anteil allein hergibt</b> — dann muss niemand
das Netz benutzen. Nachgezählt: von Essen aus sind in 90 Minuten
<b>11,6 %</b> Deutschlands erreichbar, von Frankfurt 5,6 %, von Berlin 5,4 %,
von München 4,9 %. Rhein-Ruhr ist die größte zusammenhängende Ballung des
Landes, und sie ist rund ein Achtel davon wert.</p>
<p>Oberhalb von etwa einem Siebtel kann also keine Region mehr aus sich selbst
schöpfen — und genau dort kippt die Tabelle oben: bei 17 % führt noch das
Ruhrgebiet, bei 21 % Frankfurt. Am anderen Ende friert die Rangfolge ab etwa
zwei Dritteln ein, weil es dann nur noch darauf ankommt, wie schnell man Sylt
und Rügen erreicht.</p>
<p>Damit liegt das brauchbare Fenster zwischen einem Sechstel und der Hälfte,
und <b>ein Viertel</b> — 20,9 Millionen Menschen, etwa das Doppelte der
größten Ballung — ist die runde Zahl darin. Die Probe: die zehn tiefsten
Bahnhöfe sind dann Frankfurt Flughafen, Frankfurt Hbf, Köln, Mannheim,
Frankfurt Süd, Köln Messe/Deutz, Düsseldorf, Hamm, Hannover und Dortmund. Das
ist nicht eine Region, das ist die ICE-Achse — und es kommt aus der Rechnung,
nicht aus einer Liste.</p>

<h3>Woher die Menschen kommen</h3>
<p>Ein Bevölkerungsgewicht je Bahnhof, aus drei Schritten:</p>
<ul>
<li><b>Kreisbevölkerung</b> zum ${P.menschen_jahr === '2024' ? '31. Dezember 2024' : P.menschen_jahr}
aus dem Nachbarprojekt
<a href="../bevoelkerung-kreise/">Deutschland, gezeichnet von seinen
Menschen</a> — 400 Kreise, zusammen
${(P.menschen/1e6).toFixed(1).replace('.',',')} Millionen.</li>
<li><b>Kreisgeometrie</b> aus derselben Seite. Sie liegt dort in einem
Zickzack-Varint über einem 64-Zeichen-Alphabet und wird hier entpackt: 400
Kreise, 12.000 Knoten, in einer flächentreuen Projektion
(ETRS89-LAEA). Weil die flächentreu ist, lässt sich der Maßstab gegen die
<i>amtlichen</i> Kreisflächen prüfen — 1 Gittereinheit =
${P.gitter_meter.toFixed(1).replace('.',',')} m, und die Abweichung je Kreis
liegt im Median bei ${(P.flaeche_fehler*100).toFixed(2).replace('.',',')} %.
Neun Städte mit bekannter Lage landen alle neun im Ring ihres eigenen
Kreises.</li>
<li><b>Einzugsgebiete.</b> Jeder Kreis wird mit
${P.raster_km.toFixed(0)} km gerastert, jede Zelle trägt ihren Anteil an der
Kreisbevölkerung, und dieser Anteil geht an den <b>nächstgelegenen
Bahnhof</b> — über Kreisgrenzen hinweg, denn Menschen fahren zum nächsten
Bahnhof und nicht zum nächsten im eigenen Kreis.</li>
</ul>

<h3>Schnee, und die Inseln im Meer</h3>
<p>Über den am schlechtesten erreichbaren Gegenden liegt <b>Schnee</b> — die
obersten sechs der fünfunddreißig Farbbänder. Die Grenze ist nicht gesetzt,
sondern abgeleitet: die Farbleiter läuft vom Wasserstand bis zum höchsten Wert
<i>auf dem Land</i> (genauer: bis zu dessen 99,5-Perzentil, sonst walzt ein
einzelner Haltepunkt mit zwei Zügen am Tag die ganze Leiter platt), und die
letzten sechs Bänder sind Schnee. In Minuten steht sie in der Tafel links.
Schnee haben der Zipfel um Konstanz, der Bayerische Wald bei Passau,
Oberstdorf und Garmisch — und einzelne Haltepunkte mitten im Land, an denen
zweimal am Tag ein Zug hält: Demker in der Altmark, Hoppstädten an der Nahe,
Nistertal im Westerwald. Sylt und die Rügener Bäderbahn sind in der Zeitkarte
über den Bildrand hinaus.</p>
<p>Je weiter der Regler in die Zeit läuft, desto mehr <b>Inseln</b> lösen sich
vom Land, und das ist kein Zeichenfehler. Die Federkarte schleudert die
abgehängten Orte so weit hinaus, dass der verzogene Umriss ihnen nicht mehr
folgen kann — in der reinen Zeitkarte liegen 593 der
${P.bahnhoefe.toLocaleString('de-DE')} Bahnhöfe jenseits der Küste. Ein
Bahnhof gehört aber immer auf Land, also bekommt jeder Ausgewanderte seine
eigene <b>Scholle</b>: eine Kreisscheibe mit hartem Rand und 11,5 Minuten
Radius. Wo mehrere dicht beieinander liegen, laufen die Scheiben zu einem
Archipel zusammen. Was im Meer treibt und noch im Bild ist, ist beschriftet:
Freiburg Herdern, Kennelgarten in der Pfalz, Nistertal-Büdingen im
Westerwald, Dienheim am Rhein, Demker in der Altmark.</p>

<h3>Was fehlt, und was es kostet</h3>
<ul>
<li><b>Kein Stadtverkehr.</b> S-Bahn, U-Bahn, Straßenbahn und Bus fehlen. Für
die Ballungsräume heißt das: die Karte zeigt, wie gut sie mit
<i>Regionalzügen</i> erschlossen sind, nicht wie gut sie erschlossen
sind.</li>
<li><b>${P.raus} Bahnhöfe fehlen ganz</b>, weil ihre einzige Verbindung zum
Netz eine S-Bahn-Station ist und sie damit in diesem Datensatz frei in der
Luft hängen: die Strohgäubahn bei Stuttgart, die Gräfenbergbahn bei Nürnberg,
die Müglitztalbahn bei Dresden und einige Stichstrecken mehr.</li>
<li><b>${P.busfahrten} Fahrten auf ${P.buslinien.length} Linien</b> hat der
Quelldatensatz als Schiene geführt, obwohl es Busse sind — Regionalbusnetze im
Oberhavel und Havelland, um Crailsheim und Schwäbisch Hall, Rufbusse um
Dillingen und Memmingen, Ulmer Stadtlinien und die Coburger Linie 1408. Sie
sind heraus.</li>
<li><b>${P.strassenhalte} Straßenhalte</b> der Chemnitzer Zweisystemwagen
(${Object.keys(P.engelinien).join(', ')}) sind heraus: draußen Eisenbahn, in
der Stadt Straßenbahn. Etwa fünfzehn davon sind wirkliche Haltepunkte und
gehen mit — der Datensatz trennt sie nicht. Die Bahnhöfe auf diesen Linien,
Stollberg, Aue, Hainichen, Mittweida, bleiben.</li>
<li><b>Ein Fahrplantag, kein Mittel über viele Mittwoche.</b> Der 13. Mai 2026
ist der Tag vor Christi Himmelfahrt. Der Regionalfahrplan ist der eines
normalen Mittwochs; im Fernverkehr des Abends kann ein Brückentag ein paar
Züge mehr bedeuten.</li>
<li><b>Fahrplan, nicht Wirklichkeit.</b> Verspätungen, Ausfälle und Baustellen
stehen nicht im Soll-Fahrplan.</li>
<li><b>Umsteigen kostet überall ${P.minum} Minuten.</b> In Wirklichkeit ist
die Mindestumsteigezeit je Bahnhof verschieden; die Quelle führt sie
nicht.</li>
<li><b>Die Bevölkerung ist innerhalb eines Kreises gleichmäßig verteilt.</b>
In einem Landkreis mit einer Stadt und viel Wald sitzt damit zu viel
Bevölkerung im Wald. Feiner geht es nur mit Gemeinde- oder Rasterdaten, und
die liegen hier nicht.</li>
<li><b>Die größten Einzugsgebiete liegen an Vorortbahnhöfen</b> — München Ost,
Leverkusen Mitte, Berlin Schöneweide —, weil in den Städten die S-Bahn fehlt
und die Bevölkerung an den wenigen verbliebenen Regionalbahnhöfen landet.
Für das Maß ist das ohne Belang, weil diese Bahnhöfe Minuten voneinander
entfernt liegen; als Zahl je Bahnhof gelesen ist es irreführend.</li>
<li><b>Der Grenzsaum trennt Deutschland nicht sauber ab.</b> Die Landesgrenze
ist auf 2.100 Punkte vereinfacht; ein Saum von 0,6 km rettet Kehl, Gronau und
Warnemünde, holt aber auch acht Auslandsbahnhöfe herein, und Lindau-Insel,
Herten und Rheinfelden (Baden) fehlen dafür.</li>
<li><b>${(P.ohne_feder*100).toFixed(3).replace('.',',')} % der
Bahnhofspaare</b> sind an diesem Tag ab dieser Stunde überhaupt nicht zu
verbinden. Sie bekommen keine Feder.</li>
</ul>

<h3>Bedienung</h3>
<ul>
<li><b>Landkarte → Zeitkarte</b> verzieht die Karte von der Geografie in die
Reisezeit. Umriss und Ländergrenzen laufen mit, verschoben mit dem
Verschiebungsfeld der Bahnhöfe selbst. Der <b>Abspielknopf</b> fährt hin und
her und hält an beiden Enden eine Dreiviertelsekunde an: sonst kehrt die
Fahrt im Endzustand um, ohne ihn gezeigt zu haben — und die beiden
Endzustände sind gerade das, was die Karte behauptet. Weich wird die Karte in
der Fahrt nicht: die Rasterstufe wird gemessen statt gesetzt, läuft also auf
der Ruhestufe und geht nur gröber, wenn die Maschine sonst nicht mitkäme.</li>
<li><b>Anteil Deutschlands</b> ist der Regler, der die Höhe überhaupt
definiert — er schiebt zwischen Ballungsraum und Geografie. Achtzehn Stufen
liegen vorgerechnet in der Seite, dazwischen wird gemischt. Auch er hat einen
Abspielknopf.</li>
<li><b>Wasserstand</b> hebt den Meeresspiegel in Minuten. Er verschiebt die
Farbleiter mit: was darunter liegt, läuft unter Wasser, und die Schneegrenze
rückt nach.</li>
<li><b>Isochronen</b> zeichnet die Linien gleicher Reisezeit um einen der
${P.isoknoten.length} vorgerechneten Knoten, anzuklicken auf der Karte. Das
ist die Probe aufs Ganze: auf der Landkarte sind das ausgefranste Sterne, auf
der Zeitkarte müssen daraus Kreise werden.</li>
</ul>
<p>Der <b>Bildausschnitt</b> steht fest und wandert beim Schieben nicht mit —
sonst wäre genau die Verformung, um die es geht, nicht mehr zu sehen. Er kommt
aber ganz von der Zeitkarte: die Federkarte spannt 1.274 × 1.302 Minuten, die
Landkarte nur 715 × 956, und ein paar Enden von Nebenbahnen fahren so weit
hinaus, dass Deutschland in der Mitte saß wie eine Briefmarke auf einem Bogen.
Darum ist er <b>zugeschnitten</b>, so weit die Landkarte es zulässt: bis sie
mit einem Saum von acht Minuten genau hineinpasst. Der Faktor ist nicht
gesetzt, sondern gemessen — 1,29 —, und Deutschland wird damit gut zwanzig
Prozent größer gezeichnet als vorher: nachgemessen +23 % auf 1440 × 900 und
+29 % hochkant auf dem Telefon. Das Höhenfeld wird dabei mit **einer Zelle je
Bildschirmpixel** gerastert statt mit festen drei Minuten — zweieinhalbmal
feiner je Achse, und in der Fahrt genauso scharf wie im Stand —, und die Küste
wird <b>beschnitten</b> statt ausmaskiert: ein Pfad hat keine Auflösung, eine
Maske im Raster wird beim Hochskalieren weichgezeichnet. In der Landkarte geht
dabei garantiert nichts
verloren; in der reinen Zeitkarte fliegen <b>108 der
${P.bahnhoefe.toLocaleString('de-DE')} Bahnhöfe</b> aus dem Bild: 2,3 % der
Bahnhöfe, aber nur 0,9 % aller Halte am Tag — die Bodenseerunde, die Rügener
Bäderbahn, die Erzgebirgs- und Zittauer Schmalspur, Sylt und Dagebüll, der
Bayerische Wald, die Heidekrautbahn. Wer draußen liegt, wird nicht
gezeichnet.</p>

<h3>Quellen</h3>
<ul>
<li>Fahrplan: <a href="https://www.delfi.de/">DELFI e. V.</a>, offener
Datensatz Deutschland, Fahrplantag 13. Mai 2026 — über den aufbereiteten
Tagesauszug von <a href="https://github.com/Chillchamp1/github.io">Ein Tag auf
der Schiene</a> (MIT).</li>
<li>Umriss und Ländergrenzen: derselbe Datensatz, in Lambert-kegelkonformer
Projektion mit den Normalparallelen 48,67° und 53,67° N.</li>
<li>Rechenwege: Connection Scan (Dibbelt, Pajor, Strasser, Wagner 2013),
Stress-Majorisierung/SMACOF (de Leeuw 1977), Adam (Kingma und Ba 2015).</li>
</ul>
